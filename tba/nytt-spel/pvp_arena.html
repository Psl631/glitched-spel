<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet">
    <title>PVP Battle Arena - Tournament Edition</title>
    <script>// =========================================================================
// 🛑 ENHETS- & WEBBLÄSARSPÄRR MED ANIMERADE VEKTORSKÄRMAR
// =========================================================================
(function() {
    var ua = (navigator.userAgent || navigator.vendor || window.opera || "").toLowerCase();

    // 1. KONTROLLERA ENHETSTYPER
    var isSmartTV = /smart-tv|smarttv|googletv|appletv|hbbtv|pov_tv|netcast.tv|viera/i.test(ua);
    var isCar = /tesla|automotive|carplay|android auto|polestar|mbux|infotainment|ivi|carbrowser|qtcarbrowser/i.test(ua);
    var isTablet = /ipad|tablet|(android(?!.*mobile))/i.test(ua) || (navigator.maxTouchPoints > 1 && /macintosh/i.test(ua));
    var isMobile = !isTablet && /android|webos|iphone|ipod|blackberry|iemobile|opera mini|mobile/i.test(ua);

    // Konsoler (med separat hantering av äldre vs nya)
    var isLegacyConsole = /playstation 3|playstation portable|psp|psvita|wii\b/i.test(ua);
    var isModernConsole = /playstation 5|ps5|xbox series|nintendo switch/i.test(ua);
    var isMidConsole = /playstation 4|xbox one|wii u/i.test(ua);

    // 2. KONTROLLERA WEBBLÄSARE OCH VERSIONER
    var isIE = /msie|trident/i.test(ua);
    var isAndroidStock = /android/i.test(ua) && /version\/[0-9.]+/i.test(ua) && !/chrome/i.test(ua);

    // 💻 OPERATIVSYSTEM & BÄRBARA ENHETER
    var isLinux = /linux/i.test(ua) && !/android/i.test(ua) && !/cros/i.test(ua);
    var isChromeOS = /cros/i.test(ua);
    var isHandheldPC = /steamdeck|rog ally|legion go|ayaneo|gpd win|switch/i.test(ua);
    var isEdgeHTML = /edge\/\d+/i.test(ua);

    // Windows före 10 (NT 5.x = XP, 6.0 = Vista, 6.1 = 7, 6.2/6.3 = 8/8.1)
    var isLegacyWindows = /windows nt (5\.|6\.[0-3])/i.test(ua);

    // Mac äldre än de 2 nyaste (macOS 15 Sequoia och 16 är de senaste; äldre än 15 spärras)
    var isLegacyMac = false;
    if (/macintosh|mac os x/i.test(ua) && !isTablet) {
        var macMatch = ua.match(/mac os x (\d+)[_.](\d+)/i);
        if (macMatch) {
            var macMajor = parseInt(macMatch[1], 10);
            var macMinor = parseInt(macMatch[2], 10);
            if (macMajor < 15 && !(macMajor === 10 && macMinor >= 16)) {
                isLegacyMac = true;
            }
        }
    }
    
    // Versionsparsning
    function getMajorVer(regex) {
        var m = ua.match(regex);
        return m ? parseInt(m[1], 10) : 0;
    }

    var isChrome = /chrome/i.test(ua) && !/edg\//i.test(ua) && !/opr\//i.test(ua);
    var isSafari = /safari/i.test(ua) && !isChrome && !/edg\//i.test(ua) && !/android/i.test(ua);
    var isFirefox = /firefox/i.test(ua);
    var isEdge = /edg\//i.test(ua);

    var chromeVer = isChrome ? getMajorVer(/chrome\/(\d+)/i) : 0;
    var safariVer = isSafari ? getMajorVer(/version\/(\d+)/i) : 0;
    var firefoxVer = isFirefox ? getMajorVer(/firefox\/(\d+)/i) : 0;
    var edgeVer = isEdge ? getMajorVer(/edg\/(\d+)/i) : 0;

    // Kräver absolut senaste versionerna (tröskel för "inte allra senaste")
    var isOldSafari = isSafari && safariVer < 17;
    var isOutdatedBrowser = (isChrome && chromeVer < 125) || 
                            (isFirefox && firefoxVer < 126) || 
                            (isEdge && edgeVer < 125) || 
                            (isSafari && safariVer < 18);

    // 3. FASTSTÄLL KATEGORI
    var blockType = null;
    var title = "";
    var message = "";
    var subText = "";

    // 🦖 INTERNET EXPLORER
    if (isIE) {
        blockType = "IE";
        title = "🦖 GRAVSTEN: INTERNET EXPLORER DOG 2022!";
        message = "Oj oj oj! Försöker du starta ett modernt arkadspel i en webbläsare från förra århundradet?! Internet Explorer orkar knappt rita en cirkel och somnade in för evigt år 2022.";
        subText = "Starta Chrome, Firefox eller Edge på en modern dator!";
    }
    // 📱 ANDROID STOCK-WEBBLÄSARE
    else if (isAndroidStock) {
        blockType = "ANDROID_STOCK";
        title = "📱 FÖRÅLDRAD ANDROID-LÄSARE!";
        message = "Den gamla inbyggda jordglobs-webbläsaren orkar inte med Canvas-animationer eller ljud! Den hackar som en trasig gräsklippare.";
        subText = "Byt till en modern dator med mus och tangentbord!";
    }
    // 🍏 GAMMAL SAFARI
    else if (isOldSafari) {
        blockType = "OLD_SAFARI";
        title = "🍏 FÖRÅLDRAD SAFARI DETEKTERAD!";
        message = "Din Safari-version är för gammal för WebRTC, stereoljud och hårdvaruacceleration. Äpplet har blivit för brunt för att spela arkad!";
        subText = "Uppdatera macOS eller öppna spelet i en modern PC-webbläsare!";
    }
    // 🚗 BILSKÄRM
    else if (isCar) {
        blockType = "CAR";
        title = "🚗 VARNING! BILSKÄRMEN ÄR INGEN SPELSKÄRM!";
        message = "Sitter du i bilen och försöker väja för minor och skjuta lasrar mitt i trafiken?! Håll båda händerna på ratten och ögonen på vägen innan du krockar med en lyktstolpe!";
        subText = "Kör hem, parkera säkert och spela framför skrivbordet istället!";
    }
    // 📺 SMART-TV
    else if (isSmartTV) {
        blockType = "TV";
        title = "📺 HUR HADE DU TÄNKT SPELA MED FJÄRRKONTROLLEN?!";
        message = "Sitter du i soffan med TV-fjärren och tror du är proffs?! Hur ska det gå till: Styra gubben med piltangenterna, skjuta med OK-knappen och ladda om med 'BACK'?!";
        subText = "Upp ur soffan! Sätt dig vid ett riktigt skrivbord med mus och tangentbord!";
    }
    // 🐧 LINUX (PINGVINEN STÖDS EJ)
    else if (isLinux) {
        blockType = "LINUX_PINGVIN";
        title = "🐧 LINUX: PINGVINEN STÖDS EJ!";
        message = "BWAHAHAHA! Sitter du och knappar sudo apt-get i terminalen?! Pingvinen får stanna på Sydpolen! Spelet är inte byggt för öppna Linux-kärnor eller experimentella drivrutiner.";
        subText = "Starta en vanlig Windows- eller Mac-dator om du vill spela!";
    }
    // 💻 CHROMEBOOK (SKOLDATOR SPÄRRAD)
    else if (isChromeOS) {
        blockType = "CHROMEBOOK";
        title = "💻 SKOLDATOR SPÄRRAD: GÖR LÄXORNA FÖRST!";
        message = "Stopp där! Det där är en liten Chromebook byggd för skolarbeten, glosförhör och matteläxor, inte för tung arkadaction! Gör färdigt läxorna och ät ett mellanmål!";
        subText = "Stäng skoldatorn och starta en riktig speldator efter skolan!";
    }
    // 🎮 BÄRBARA SPELENHETER (STEAM DECK, ROG ALLY M.FL.)
    else if (isHandheldPC) {
        blockType = "HANDHELD_PC";
        title = "🎮 BÄRBAR SPELENHET STOPPAD!";
        message = "Försöker du spela arkad på en liten bärbar handdator med små fläktar som blåser varmluft i knäet?! Den lilla skärmen och de inbyggda styrspakarna är inte godkända här!";
        subText = "Koppla upp dig mot en stor datorskärm med riktig mus!";
    }
    // 🌐 GAMLA EDGE (EDGEHTML)
    else if (isEdgeHTML) {
        blockType = "EDGE_HTML";
        title = "🌐 GAMLA EDGEHTML HAR GÅTT I PENSION!";
        message = "Haha! Du hittade den gamla Edge-motorn som Microsoft glömde kvar på vinden och övergav för länge sedan! Den orkar knappt blåsa såpbubblor, än mindre rita moderna effekter.";
        subText = "Uppdatera till moderna Chromium-Edge genast!";
    }
    // 🪟 WINDOWS FÖRE 10 (XP, VISTA, 7, 8, 8.1)
    else if (isLegacyWindows) {
        blockType = "WIN_OLD";
        title = "🪟 DET DÄR ÄR ETT WINDOWS-FOSSIL!";
        message = "GRAAAHR! Sitter du på Windows 7, 8 eller uråldriga XP?! Det systemet är så dammigt att våra monster tror att det är en dinosauriekompis från ett museum!";
        subText = "Uppgradera datorn till Windows 10 eller 11!";
    }
    // 🍏 MAC FÖRE DE 2 NYASTE
    else if (isLegacyMac) {
        blockType = "MAC_OLD";
        title = "🍏 DIN MAC ÄR FÖR GAMMAL FÖR DETTA!";
        message = "Oj oj oj! Ditt macOS ligger för långt bak i tiden och saknar de senaste två versionernas grafik- och ljudrutiner! Den här gamla maskinen orkar inte med farten.";
        subText = "Uppdatera din Mac till en av de två nyaste macOS-versionerna!";
    }
    // 🎮 ÄLDRE KONSOL (PS3 / PSP)
    else if (isLegacyConsole) {
        blockType = "CONSOLE_RETRO";
        title = "💀 PS3 / PSP?! ÄR DU FULLKOMLIGT TOKIG?!";
        message = "Försöker du köra 60 FPS WebRTC-arenastrider genom webbläsaren på en PlayStation 3 eller PSP från 2006?! Konsolen kokar, fläkten låter som ett jetplan och minnet tog slut för 15 år sedan!";
        subText = "Stäng webbläsaren omedelbart innan konsolen smälter ihop till plastmos!";
    }
    // 🎮 MODERN KONSOL (PS5 / XBOX SERIES)
    else if (isModernConsole || isMidConsole) {
        blockType = "CONSOLE_MODERN";
        title = "🎮 STARTA ETT RIKTIGT KONSOLSPEL!";
        message = "Du har en modern konsol för tusentals kronor och ändå smyger du in via konsolens gömda text-webbläsare?! Webbläsaren har ingen muspekare eller tangentbordsstöd här.";
        subText = "Hoppa ur konsolens webbläsare och starta ett konsolspel, eller gå till en PC!";
    }
    // 📱 MOBILTELEFON
    else if (isMobile) {
        blockType = "MOBILE";
        title = "📱 INGET TOUCH-STÖD – SÄTT DIG VID EN PC!";
        message = "Spelet stödjer inte touchskärmar! Att styra med tummarna på en hal 6-tumsskärm gör att fingrarna täcker hela skärmen och du dör på två sekunder.";
        subText = "Sätt dig vid en dator med mus, handkontroll eller tangentbord!";
    }
    // 🐸 SURFPLATTA / IPAD
    else if (isTablet) {
        blockType = "TABLET";
        title = "🐸 SURFPLATTOR HAR NOLL TOUCH-STÖD!";
        message = "En jättestor iPad gör inte saken bättre! Spelet kräver millimeterprecision via datormus eller speldosa, inte flottiga handflator som klappar på glasrutan.";
        subText = "Koppla in en dator med fysiska knappar och spela som folk!";
    }
    // 🔄 INTE ALLRA SENASTE WEBBLÄSAREN
    else if (isOutdatedBrowser) {
        blockType = "UPDATE_BROWSER";
        title = "🔄 UPPDATERA DIN WEBBLÄSARE!";
        message = "Du kör inte den allra senaste versionen av din webbläsare! Spelet kräver de nyaste Canvas-, WebRTC- och ljudoptimeringarna för att inte hacka.";
        subText = "Klicka på webbläsarens inställningar och uppdatera till senaste versionen!";
    }

    // Om godkänd modern datorwebbläsare: släpp igenom!
    if (!blockType) return;

    // 4. BLOCKERA OCH RITA SKÄRMEN PÅ CANVAS
    window.addEventListener('DOMContentLoaded', function() {
        document.body.innerHTML = "";
        document.body.style.margin = "0";
        document.body.style.background = "#05060a";
        document.body.style.overflow = "hidden";

        var blockCanvas = document.createElement('canvas');
        blockCanvas.width = window.innerWidth;
        blockCanvas.height = window.innerHeight;
        blockCanvas.style.display = "block";
        document.body.appendChild(blockCanvas);

        var bCtx = blockCanvas.getContext('2d');
        var t = 0;

        function renderEnforcerLoop() {
            t += 0.04;
            bCtx.clearRect(0, 0, blockCanvas.width, blockCanvas.height);

            // Mörk bakgrund med rött varningsmönster
            bCtx.fillStyle = "#07080f";
            bCtx.fillRect(0, 0, blockCanvas.width, blockCanvas.height);

            // Varningsram
            var isRed = Math.floor(t * 2) % 2 === 0;
            bCtx.strokeStyle = isRed ? "#ff1744" : "#ffd600";
            bCtx.lineWidth = 6;
            bCtx.strokeRect(20, 20, blockCanvas.width - 40, blockCanvas.height - 40);

            var cx = blockCanvas.width / 2;
            var cy = blockCanvas.height / 2 - 40;

            // ==================== 🎨 VEKTORANIMATIONER ====================
            bCtx.save();
            bCtx.translate(cx, cy);

            switch(blockType) {
                // 🦖 1. GRAVSTEN & KROSSAT IE
                case "IE": {
                    // Gravsten
                    bCtx.fillStyle = "#475569";
                    bCtx.beginPath();
                    bCtx.arc(0, -20, 45, Math.PI, 0);
                    bCtx.lineTo(45, 60);
                    bCtx.lineTo(-45, 60);
                    bCtx.closePath();
                    bCtx.fill();
                    bCtx.strokeStyle = "#1e293b";
                    bCtx.lineWidth = 3;
                    bCtx.stroke();

                    bCtx.fillStyle = "#ff1744";
                    bCtx.font = "bold 18px monospace";
                    bCtx.textAlign = "center";
                    bCtx.fillText("R.I.P", 0, 5);
                    bCtx.fillStyle = "#cbd5e1";
                    bCtx.font = "bold 11px monospace";
                    bCtx.fillText("1995-2022", 0, 28);

                    // Svävande spök-ikon
                    var floatY = Math.sin(t * 2) * 8;
                    bCtx.strokeStyle = "#00a2ff";
                    bCtx.lineWidth = 4;
                    bCtx.beginPath();
                    bCtx.arc(80, -30 + floatY, 20, 0, Math.PI * 2);
                    bCtx.stroke();
                    // Rött förbudskryss
                    bCtx.strokeStyle = "#ff1744";
                    bCtx.lineWidth = 4;
                    bCtx.beginPath();
                    bCtx.moveTo(65, -45 + floatY); bCtx.lineTo(95, -15 + floatY);
                    bCtx.stroke();
                    break;
                }

                // 📱 2. MOBIL / SURFPLATTA (KLADDIGT FINGERÖVERDRAG)
                case "MOBILE":
                case "TABLET":
                case "ANDROID_STOCK": {
                    var w = blockType === "TABLET" ? 120 : 70;
                    var h = blockType === "TABLET" ? 90 : 130;

                    // Telefonchassi
                    bCtx.fillStyle = "#1e293b";
                    bCtx.fillRect(-w/2, -h/2, w, h);
                    bCtx.strokeStyle = "#00ffcc";
                    bCtx.lineWidth = 3;
                    bCtx.strokeRect(-w/2, -h/2, w, h);

                    // Skärm
                    bCtx.fillStyle = "#090d16";
                    bCtx.fillRect(-w/2 + 6, -h/2 + 10, w - 12, h - 20);

                    // Pekande finger med pulserande pekcirkel som skakar
                    var fx = Math.sin(t * 3) * (w / 3);
                    var fy = Math.cos(t * 3) * (h / 3);

                    bCtx.fillStyle = "rgba(255, 23, 68, 0.4)";
                    bCtx.beginPath();
                    bCtx.arc(fx, fy, 16 + Math.sin(t * 6) * 4, 0, Math.PI * 2);
                    bCtx.fill();

                    // Rött kryss över handen
                    bCtx.strokeStyle = "#ff1744";
                    bCtx.lineWidth = 5;
                    bCtx.beginPath();
                    bCtx.moveTo(-35, -35); bCtx.lineTo(35, 35);
                    bCtx.moveTo(35, -35); bCtx.lineTo(-35, 35);
                    bCtx.stroke();
                    break;
                }

                // 🐧 8. LINUX PINGVIN MED FÖRBUDSMÄRKE
                case "LINUX_PINGVIN": {
                    // Pingvinkropp
                    bCtx.fillStyle = "#0f172a";
                    bCtx.beginPath();
                    bCtx.ellipse(0, 5, 34, 45, 0, 0, Math.PI * 2);
                    bCtx.fill();
                    // Vit mage
                    bCtx.fillStyle = "#ffffff";
                    bCtx.beginPath();
                    bCtx.ellipse(0, 10, 20, 32, 0, 0, Math.PI * 2);
                    bCtx.fill();
                    // Näbb & fötter
                    bCtx.fillStyle = "#f59e0b";
                    bCtx.fillRect(-6, -18, 12, 7);
                    bCtx.fillRect(-22, 45, 16, 7);
                    bCtx.fillRect(6, 45, 16, 7);
                    // Rött förbudskryss
                    bCtx.strokeStyle = "#ff1744";
                    bCtx.lineWidth = 6;
                    bCtx.beginPath();
                    bCtx.arc(0, 5, 48, 0, Math.PI * 2);
                    bCtx.moveTo(-34, -29); bCtx.lineTo(34, 39);
                    bCtx.stroke();
                    break;
                }

                // 💻 9. CHROMEBOOK / BÄRBAR ENHET MED LÄXBOK
                case "CHROMEBOOK":
                case "HANDHELD_PC": {
                    // Skoldator / Konsolskal
                    bCtx.fillStyle = "#1e293b";
                    bCtx.fillRect(-55, -35, 110, 65);
                    bCtx.strokeStyle = "#ffeb3b";
                    bCtx.lineWidth = 3;
                    bCtx.strokeRect(-55, -35, 110, 65);
                    // Skärm med varning
                    bCtx.fillStyle = "#090d16";
                    bCtx.fillRect(-47, -27, 94, 49);
                    bCtx.fillStyle = "#ff1744";
                    bCtx.font = "bold 18px monospace";
                    bCtx.textAlign = "center";
                    bCtx.fillText("LÄXOR!", 0, 5);
                    // Tangentbord nedfällt
                    bCtx.fillStyle = "#334155";
                    bCtx.fillRect(-65, 33, 130, 10);
                    break;
                }

                // 🪟 10. GAMMALT WINDOWS / EDGEHTML / GAMMAL MAC
                case "EDGE_HTML":
                case "WIN_OLD":
                case "MAC_OLD": {
                    // Dammig låda / skärm som skakar
                    var shake = Math.sin(t * 8) * 3;
                    bCtx.fillStyle = "#1e293b";
                    bCtx.fillRect(-50 + shake, -40, 100, 75);
                    bCtx.strokeStyle = "#ff1744";
                    bCtx.lineWidth = 4;
                    bCtx.strokeRect(-50 + shake, -40, 100, 75);
                    // Dödskalleskärm / Fossil
                    bCtx.fillStyle = "#ff1744";
                    bCtx.font = "bold 26px monospace";
                    bCtx.textAlign = "center";
                    bCtx.fillText("☠️", shake, 8);
                    break;
                }

                // 🚗 3. BILSKÄRM & RATT
                case "CAR": {
                    // Skärm i instrumentbrädan
                    bCtx.fillStyle = "#0f172a";
                    bCtx.fillRect(-90, -50, 180, 100);
                    bCtx.strokeStyle = "#f59e0b";
                    bCtx.lineWidth = 4;
                    bCtx.strokeRect(-90, -50, 180, 100);

                    // Hastighetsmätare som skakar
                    bCtx.strokeStyle = "#ff1744";
                    bCtx.lineWidth = 3;
                    bCtx.beginPath();
                    bCtx.arc(0, 0, 32, Math.PI, 0);
                    bCtx.stroke();

                    // Roterande visare
                    var needleAngle = Math.PI + (Math.sin(t * 4) + 1) * (Math.PI / 2);
                    bCtx.beginPath();
                    bCtx.moveTo(0, 0);
                    bCtx.lineTo(Math.cos(needleAngle) * 28, Math.sin(needleAngle) * 28);
                    bCtx.stroke();

                    // Varningstriangel
                    bCtx.fillStyle = "#ffd600";
                    bCtx.beginPath();
                    bCtx.moveTo(0, -38); bCtx.lineTo(14, -16); bCtx.lineTo(-14, -16);
                    bCtx.closePath();
                    bCtx.fill();
                    break;
                }

                // 📺 4. SMART-TV & FJÄRRKONTROLL
                case "TV": {
                    // TV-ram
                    bCtx.fillStyle = "#1e293b";
                    bCtx.fillRect(-100, -60, 140, 90);
                    bCtx.strokeStyle = "#38bdf8";
                    bCtx.lineWidth = 3;
                    bCtx.strokeRect(-100, -60, 140, 90);

                    // Fjärrkontroll bredvid med blinkande OK-knapp
                    bCtx.fillStyle = "#0f172a";
                    bCtx.fillRect(60, -55, 36, 100);
                    bCtx.strokeStyle = "#ffffff";
                    bCtx.lineWidth = 2;
                    bCtx.strokeRect(60, -55, 36, 100);

                    // Piltangenter & OK-knapp på dosan
                    bCtx.fillStyle = (Math.floor(t * 3) % 2 === 0) ? "#ff1744" : "#ffd600";
                    bCtx.beginPath();
                    bCtx.arc(78, -15, 9, 0, Math.PI * 2);
                    bCtx.fill();

                    bCtx.fillStyle = "#000000";
                    bCtx.font = "bold 8px sans-serif";
                    bCtx.textAlign = "center";
                    bCtx.fillText("OK", 78, -12);

                    // Rött förbudstecken
                    bCtx.strokeStyle = "#ff1744";
                    bCtx.lineWidth = 4;
                    bCtx.beginPath();
                    bCtx.arc(78, -15, 18, 0, Math.PI * 2);
                    bCtx.moveTo(65, -28); bCtx.lineTo(91, -2);
                    bCtx.stroke();
                    break;
                }

                // 💀 5. RETRO KONSOL (PS3 / PSP RÖK & ELD)
                case "CONSOLE_RETRO": {
                    // Rökpelare
                    for (var i = 0; i < 6; i++) {
                        var smokeY = -40 - (i * 12) - (Math.sin(t * 3 + i) * 6);
                        var smokeX = Math.sin(t * 2 + i) * 18;
                        bCtx.fillStyle = "rgba(239, 68, 68, 0.4)";
                        bCtx.beginPath();
                        bCtx.arc(smokeX, smokeY, 10 + i * 2, 0, Math.PI * 2);
                        bCtx.fill();
                    }

                    // Konsol-chassi
                    bCtx.fillStyle = "#09090b";
                    bCtx.fillRect(-70, -10, 140, 45);
                    bCtx.strokeStyle = "#ff1744";
                    bCtx.lineWidth = 3;
                    bCtx.strokeRect(-70, -10, 140, 45);

                    bCtx.fillStyle = "#ff1744";
                    bCtx.font = "bold 14px monospace";
                    bCtx.textAlign = "center";
                    bCtx.fillText("OVERHEAT: 99°C", 0, 18);
                    break;
                }

                // 🎮 6. MODERN KONSOL
                case "CONSOLE_MODERN": {
                    // Handkontroll
                    bCtx.fillStyle = "#ffffff";
                    bCtx.beginPath();
                    bCtx.arc(-30, 0, 26, 0, Math.PI * 2);
                    bCtx.arc(30, 0, 26, 0, Math.PI * 2);
                    bCtx.fill();
                    bCtx.fillRect(-30, -15, 60, 30);

                    // Spakar
                    bCtx.fillStyle = "#334155";
                    bCtx.beginPath();
                    bCtx.arc(-15, 8, 8, 0, Math.PI * 2);
                    bCtx.arc(15, 8, 8, 0, Math.PI * 2);
                    bCtx.fill();

                    // Rött förbudskors
                    bCtx.strokeStyle = "#ff1744";
                    bCtx.lineWidth = 5;
                    bCtx.beginPath();
                    bCtx.moveTo(-45, -35); bCtx.lineTo(45, 35);
                    bCtx.moveTo(45, -35); bCtx.lineTo(-45, 35);
                    bCtx.stroke();
                    break;
                }

                // 🔄 7. UPPDATERA WEBBLÄSAREN (SNURRANDE KUGGHJUL/PIL)
                case "UPDATE_BROWSER":
                case "OLD_SAFARI": {
                    var rotAngle = t * 2;

            const imgY = 95;

                ctx.drawImage(kamekImage, imgX, imgY, imgW, imgH);
                ctx.strokeStyle = "#ffd600";
                ctx.lineWidth = 3;
                ctx.strokeRect(imgX, imgY, imgW, imgH);
            } else {
                // Fallback om bildfilen laddar långsamt
                ctx.font = "70px sans-serif";
                ctx.fillText("🧙‍♂️", canvas.width / 2, 175);
            }

            // Box för regelöverträdelse
            const boxW = 680;
            const boxH = 190;
            const boxX = (canvas.width - boxW) / 2;
            const boxY = 230;

            ctx.fillStyle = "rgba(22, 15, 38, 0.9)";
            ctx.fillRect(boxX, boxY, boxW, boxH);
            ctx.strokeStyle = "#ff1744";
            ctx.lineWidth = 2;
            ctx.strokeRect(boxX, boxY, boxW, boxH);

            // Förseelserubrik
            ctx.fillStyle = "#ff1744";
            ctx.font = "bold 15px 'Courier New', monospace";
            ctx.fillText("⚠️ " + item.title, canvas.width / 2, boxY + 30);

            // Kameks hån
            ctx.fillStyle = "#ffd600";
            ctx.font = "bold 12px monospace";

            // Automatisk radbrytning för dialogen
            const words = item.desc.split(' ');
            let line = '';

                let testLine = line + words[n] + ' ';
                let metrics = ctx.measureText(testLine);

                    line = words[n] + ' ';
                    textY += 20;

                    line = testLine;

            }
            ctx.fillText(line, canvas.width / 2, textY);

            ctx.font = "bold 12px monospace";
            ctx.fillText(item.rule, canvas.width / 2, boxY + 155);

            ctx.lineWidth = 2;

            ctx.fillStyle = "#000000";
            ctx.font = "bold 13px monospace";
            ctx.fillText(pack.prompt, canvas.width / 2, canvas.height - 49);

        }

            if (dbg) {
                let renderer = (gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) || "").toLowerCase();
                if (/intel.*(hd|uhd|iris|graphics)|mesa.*intel|software rasterizer|llvmpipe/i.test(renderer)) {

                        );

            b.addEventListener('chargingchange', testBattery);
        }).catch(() => {});
    }

    return {
        // =========================================================================
        // 🔄 KONTROLL PER BILDRUTA (FPS, DROPS, VÄRME, MINNE)
        // =========================================================================
        updateMetrics: function() {
            if (isHardBlocked) return;

            let now = performance.now();
            let delta = now - lastFrameTime;
            lastFrameTime = now;

            frameDeltas.push(delta);
            if (frameDeltas.length > 60) frameDeltas.shift();

            frameTimestamps.push(now);
            frameTimestamps = frameTimestamps.filter(t => now - t <= 1000);
            let prevFps = currentFps;
            currentFps = frameTimestamps.length;

            // CPU Load uppskattning
            let loadRatio = Math.min(100, Math.round((delta / 16.6) * 45));
            currentCpuLoadEst = Math.round(currentCpuLoadEst * 0.85 + loadRatio * 0.15);

            // Minneskontroll
            if (window.performance && window.performance.memory) {
                ramUsageMB = Math.round(window.performance.memory.usedJSHeapSize / (1024 * 1024));
                if (ramUsageMB > 1200) {
                    this.block("RAM_LEAK");
                    return;
                }
            }

            // Termisk strypning: FPS störtdyker med >50% inom 1 sekund
            if (prevFps >= 50 && currentFps <= 24 && frameTimestamps.length >= 20) {
                this.block("THERMAL_THROTTLE");
                return;
            }

            // Kritiskt låg FPS
            if (currentFps < 20 && frameTimestamps.length >= 25) {
                this.block("CRITICAL_FPS");
            } else if (currentFps < 42 && currentFps > 0) {
                this.triggerWarning(
                    currentLang === 'sv' ? "VARNING: LÅG FPS" : "WARNING: LOW FPS",
                    currentLang === 'sv' ? `Bildfrekvensen sjunker (${currentFps} FPS)! Stäng bakgrundsappar!` : `Frame rate dropping (${currentFps} FPS)! Close apps!`,
                    120, "FPS"
                );
            }

            // Varningstimer nedräkning
            if (activeWarning) {
                activeWarning.timer--;
                if (activeWarning.timer <= 0) activeWarning = null;
            }
        },

        // =========================================================================
        // 🌐 NÄTVERKSRAPPORTERING (PING, JITTER, PAKETFÖRLUST)
        // =========================================================================
        reportPing: function(ms, success = true) {
            if (!success) {
                packetLossCount++;
                if (packetLossCount >= 3) {
                    this.block("PACKET_LOSS");
                }
                return;
            }

            packetLossCount = 0;
            currentPing = Math.round(ms);
            pingHistory.push(currentPing);
            if (pingHistory.length > 8) pingHistory.shift();

            // Mät latensjitter (hopp > 140 ms mellan senaste pings)
            if (pingHistory.length >= 4) {
                let minP = Math.min(...pingHistory);
                let maxP = Math.max(...pingHistory);
                if (maxP - minP > 140) {
                    this.triggerWarning(
                        currentLang === 'sv' ? "VARNING: INSTABIL NÄTVERKSJITTER" : "WARNING: UNSTABLE JITTER",
                        currentLang === 'sv' ? `Ping varierar mellan ${minP} och ${maxP} ms!` : `Ping swings between ${minP} and ${maxP} ms!`,
                        160, "JITTER"
                    );
                    if (maxP - minP > 230) {
                        this.block("JITTER_SPIKE");
                        return;
                    }
                }
            }

            // Kritiskt hög ping
            if (currentPing > 280) {
                this.block("CRITICAL_PING");
            } else if (currentPing > 135) {
                this.triggerWarning(
                    currentLang === 'sv' ? "VARNING: HÖG LATENS" : "WARNING: HIGH LATENCY",
                    currentLang === 'sv' ? `Svarstid är ${currentPing} ms. Undvik Wi-Fi!` : `Latency is ${currentPing} ms. Avoid Wi-Fi!`,
                    150, "PING"
                );
            }
        },

        triggerWarning: function(title, desc, duration = 180, type = "GEN") {
            if (isHardBlocked) return;
            if (!activeWarning || activeWarning.timer < 35) {
                activeWarning = { title, desc, timer: duration, type };
                try {
                    let a = new Audio('boooop.mp3');
                    a.volume = 0.35;
                    a.play().catch(() => {});
                } catch(e) {}
            }
        },

        block: function(reasonKey) {
            if (isHardBlocked) return;
            isHardBlocked = true;
            blockReasonKey = reasonKey;

            // Slumpa fram dialog bland tillgängliga alternativ
            let lang = (typeof currentLang !== 'undefined' && currentLang === 'en') ? 'en' : 'sv';
            let pack = HARDWARE_RULES[lang];
            let item = pack[blockReasonKey] || pack.CRITICAL_FPS;
            selectedDialogueIdx = Math.floor(Math.random() * item.dialogues.length);

            try {
                let a = new Audio('windows_error.mp3');
                a.volume = 0.9;
                a.play().catch(() => {});
            } catch(e) {}

            window.addEventListener('mousedown', function() {
                if (isHardBlocked) window.location.reload();
            }, { once: true });
        },

        isBlocked: function() {
            return isHardBlocked;
        },

        // =========================================================================
        // 📊 RITA METRIC-HUD (FPS, PING, CPU, RAM) OCH FLYTANDE GULA VARNINGAR
        // =========================================================================
        drawHUD: function(ctx, canvas) {
            if (isHardBlocked) return;

            ctx.save();
            let startX = 14;
            let startY = 14;

            function getColor(val, warnThresh, critThresh, invert = false) {
                if (!invert) {
                    if (val >= critThresh) return "#ff1744";
                    if (val >= warnThresh) return "#ffd600";
                    return "#00ffcc";
                } else {
                    if (val <= critThresh) return "#ff1744";
                    if (val <= warnThresh) return "#ffd600";
                    return "#00ffcc";
                }
            }

            let fpsColor = getColor(currentFps, 42, 22, true);
            let pingColor = getColor(currentPing, 130, 260, false);
            let cpuColor = getColor(currentCpuLoadEst, 65, 88, false);

            ctx.fillStyle = "rgba(6, 9, 18, 0.88)";
            ctx.fillRect(startX, startY, 215, 48);
            ctx.strokeStyle = "rgba(0, 255, 204, 0.3)";
            ctx.lineWidth = 1.5;
            ctx.strokeRect(startX, startY, 215, 48);

            ctx.font = "bold 11px monospace";
            ctx.textAlign = "left";

            // FPS
            ctx.fillStyle = "#ffffff";
            ctx.fillText("FPS: ", startX + 8, startY + 18);
            ctx.fillStyle = fpsColor;
            ctx.fillText(currentFps, startX + 42, startY + 18);

            // PING
            ctx.fillStyle = "#ffffff";
            ctx.fillText("PING: ", startX + 78, startY + 18);
            ctx.fillStyle = pingColor;
            ctx.fillText(currentPing + "ms", startX + 118, startY + 18);

            // CPU
            ctx.fillStyle = "#ffffff";
            ctx.fillText("CPU: ", startX + 8, startY + 38);
            ctx.fillStyle = cpuColor;
            ctx.fillText(currentCpuLoadEst + "%", startX + 42, startY + 38);

            // RAM
            ctx.fillStyle = "#ffffff";
            ctx.fillText("RAM: ", startX + 78, startY + 38);
            ctx.fillStyle = ramUsageMB > 800 ? "#ffd600" : "#00ffcc";
            ctx.fillText((ramUsageMB > 0 ? ramUsageMB + "MB" : "OK"), startX + 118, startY + 38);

            // ⚠️ Flytande varningsruta vid dåliga värden
            if (activeWarning && activeWarning.timer > 0) {
                let boxW = 500;
                let boxH = 52;
                let boxX = (canvas.width - boxW) / 2;
                let boxY = 64;

                let pulse = Math.floor(Date.now() / 150) % 2 === 0;
                ctx.fillStyle = "rgba(22, 16, 4, 0.95)";
                ctx.fillRect(boxX, boxY, boxW, boxH);
                ctx.strokeStyle = pulse ? "#ffd600" : "#ff9100";
                ctx.lineWidth = 2.5;
                ctx.strokeRect(boxX, boxY, boxW, boxH);

                ctx.textAlign = "center";
                ctx.fillStyle = "#ffd600";
                ctx.font = "bold 13px 'Courier New', monospace";
                ctx.fillText("⚠️ " + activeWarning.title, canvas.width / 2, boxY + 21);

                ctx.fillStyle = "#ffffff";
                ctx.font = "11px monospace";
                ctx.fillText(activeWarning.desc, canvas.width / 2, boxY + 40);
            }

            ctx.restore();
        },

        // =========================================================================
        // 🛑 TELIA FULLSKÄRMSSPÄRR MED TELIA.JFIF OCH SLUMPADE DIALOGER
        // =========================================================================
        drawOverlay: function(ctx, canvas) {
            if (!isHardBlocked) return;

            let lang = (typeof currentLang !== 'undefined' && currentLang === 'en') ? 'en' : 'sv';
            let pack = HARDWARE_RULES[lang];
            let item = pack[blockReasonKey] || pack.CRITICAL_FPS;
            let dialogueText = item.dialogues[selectedDialogueIdx] || item.dialogues[0];

            ctx.save();
            ctx.setTransform(1, 0, 0, 1, 0, 0);

            // Mörk Telia-bakgrund
            ctx.fillStyle = "rgba(8, 3, 22, 0.98)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Pulserande ram
            let pulse = Math.floor(Date.now() / 200) % 2 === 0;
            ctx.strokeStyle = pulse ? "#ff1744" : "#9900ee";
            ctx.lineWidth = 5;
            ctx.strokeRect(16, 16, canvas.width - 32, canvas.height - 32);

            ctx.textAlign = "center";
            ctx.fillStyle = pulse ? "#ffd600" : "#ff1744";
            ctx.font = "bold 22px 'Courier New', monospace";
            ctx.fillText(pack.banner, canvas.width / 2, 55);

            ctx.fillStyle = "#38bdf8";
            ctx.font = "bold 12px monospace";
            ctx.fillText(pack.subTitle, canvas.width / 2, 80);

            // Rita telia.jfif
            let imgW = 120, imgH = 120;
            let imgX = canvas.width / 2 - imgW / 2;
            let imgY = 95;

            if (teliaImage.complete && teliaImage.naturalWidth > 0) {
                ctx.drawImage(teliaImage, imgX, imgY, imgW, imgH);
                ctx.strokeStyle = "#9900ee";
                ctx.lineWidth = 3;
                ctx.strokeRect(imgX, imgY, imgW, imgH);
            } else {
                ctx.font = "65px sans-serif";
                ctx.fillText("📡", canvas.width / 2, 175);
            }

            // Dialog- & förklaringsruta
            let boxW = 700, boxH = 190;
            let boxX = (canvas.width - boxW) / 2;
            let boxY = 230;

            ctx.fillStyle = "rgba(24, 10, 48, 0.92)";
            ctx.fillRect(boxX, boxY, boxW, boxH);
            ctx.strokeStyle = "#ff1744";
            ctx.lineWidth = 2;
            ctx.strokeRect(boxX, boxY, boxW, boxH);

            ctx.fillStyle = "#ff1744";
            ctx.font = "bold 15px 'Courier New', monospace";
            ctx.fillText("🛑 " + item.title, canvas.width / 2, boxY + 30);

            // Automatisk radbrytning av vald dialog
            ctx.fillStyle = "#e2e8f0";
            ctx.font = "bold 12px monospace";
            let words = dialogueText.split(' ');
            let line = '';
            let textY = boxY + 65;
            for (let n = 0; n < words.length; n++) {
                let testLine = line + words[n] + ' ';
                if (ctx.measureText(testLine).width > boxW - 40 && n > 0) {
                    ctx.fillText(line, canvas.width / 2, textY);
                    line = words[n] + ' ';
                    textY += 20;
                } else {
                    line = testLine;
                }
            }
            ctx.fillText(line, canvas.width / 2, textY);

            ctx.fillStyle = "#ffd600";
            ctx.font = "bold 12px monospace";
            ctx.fillText(item.action, canvas.width / 2, boxY + 155);

            // Omstartsknapp
            ctx.fillStyle = "#9900ee";
            ctx.fillRect(canvas.width / 2 - 190, canvas.height - 75, 380, 42);
            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 2;
            ctx.strokeRect(canvas.width / 2 - 190, canvas.height - 75, 380, 42);

            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 12px monospace";
            ctx.fillText(pack.prompt, canvas.width / 2, canvas.height - 49);

            ctx.restore();
        }
    };
})();

    // =========================================================================
    // 🔍 KATEGORISERING AV INKOPPLADE USB- & HID-ENHETER
    // =========================================================================
    function categorizeDevice(name) {
        const s = (name || "").toLowerCase();

        // 1. Godkänd hårdvara (släpps igenom)
        const isApprovedMouseKb = /keyboard|mouse|mus|tangentbord|hid-compliant mouse|hid-compliant keyboard/i.test(s);
        const isApprovedGamepad = /xbox|playstation|dualsense|dualshock|nintendo|switch pro|standard gamepad|x-box/i.test(s);
        const isSuspicious = /wheel|pedal|hotas|flight|yoke|throttle|shifter|scanner|fan|warmer|heater|coffee|mug|ducky|badusb|macro|midi|synth|piano/i.test(s);

        if ((isApprovedMouseKb || isApprovedGamepad) && !isSuspicious) {
            return null; // Godkänd!
        }

        // 2. Kategorisera felaktig enhet för specifikt hån
        if (/wheel|pedal|g29|g920|t300|thrustmaster|fanatec|shifter|handbrake/i.test(s)) {
            return "WHEEL_PEDALS";
        }
        if (/hotas|flight|yoke|throttle|rudder|saitek|warthog|x52|x56|joystick/i.test(s)) {
            return "FLIGHT_HOTAS";
        }
        if (/warmer|heater|coffee|mug|cup|termo/i.test(s)) {
            return "CUP_WARMER";
        }
        if (/fan|cooler|light|lamp|disco|tree|led/i.test(s)) {
            return "USB_FAN_LIGHT";
        }
        if (/barcode|scanner|pos\b|honeywell|zebra|datalogic/i.test(s)) {
            return "BARCODE_SCANNER";
        }
        if (/ducky|badusb|injector|teensy|flipper/i.test(s)) {
            return "HACKING_DONGLE";
        }
        if (/midi|synth|piano|keystation|yamaha|casio|korg|akai/i.test(s)) {
            return "MIDI_MUSIC";
        }

        return "GENERIC_JUNK";
    }

    // 1. WebUSB Connect Listener
    if (navigator.usb) {
        navigator.usb.addEventListener('connect', (event) => {
            const devName = event.device.productName || event.device.manufacturerName || "Okänd USB-gadget";
            const category = categorizeDevice(devName);
            if (category) {
                triggerBlock(category, devName);
            }
        });
    }

    // 2. WebHID Connect Listener
    if (navigator.hid) {
        navigator.hid.addEventListener('connect', (event) => {
            const devName = event.device.productName || "Okänd HID-enhet";
            const category = categorizeDevice(devName);
            if (category) {
                triggerBlock(category, devName);
            }
        });
    }

    // 3. Spärra olämpliga Gamepads kontinuerligt
    function auditConnectedGamepads() {
        if (!navigator.getGamepads || isUsbBlocked) return;
        const gamepads = navigator.getGamepads();
        for (let i = 0; i < gamepads.length; i++) {
            const gp = gamepads[i];
            if (!gp || !gp.connected) continue;
            const category = categorizeDevice(gp.id);
            if (category) {
                triggerBlock(category, gp.id);
                return;
            }
        }
    }
    setInterval(auditConnectedGamepads, 1200);

    // 4. Detektera BadUSB & Streckkodsläsare via extrem tangenthastighet
    let burstKeys = [];
    window.addEventListener('keydown', function(e) {
        if (isUsbBlocked) return;
        const now = performance.now();
        burstKeys.push(now);
        burstKeys = burstKeys.filter(t => now - t < 120);

        if (burstKeys.length > 12) {
            if (e.key === 'Enter') {
                triggerBlock("BARCODE_SCANNER", "Streckkodsläsare / POS-scanner");
            } else {
                triggerBlock("HACKING_DONGLE", "USB Keystroke Injector / Rubber Ducky");
            }
        }
    });

    function triggerBlock(categoryKey, deviceName) {
        if (isUsbBlocked) return;
        isUsbBlocked = true;
        blockedCategoryKey = categoryKey;
        rawDeviceName = deviceName || "Okänd USB-pryl";

        try {
            const a = new Audio('windows_error.mp3');
            a.volume = 0.9;
            a.play().catch(() => {});
        } catch (e) {}

        window.addEventListener('mousedown', function() {
            if (isUsbBlocked) window.location.reload();
        }, { once: true });
    }

    return {
        // Kör UsbEnforcer.simulate("CUP_WARMER") i konsolen för att testa
        simulate: function(categoryKey, customName) {
            triggerBlock(categoryKey || "GENERIC_JUNK", customName || "Test-enhet");
        },

        isBlocked: function() {
            return isUsbBlocked;
        },

        // =========================================================================
        // 🎨 RITA BILTEMA FULLSKÄRMSSPÄRR PÅ CANVAS
        // =========================================================================
        drawOverlay: function(ctx, canvas) {
            if (!isUsbBlocked) return;

            const lang = (typeof currentLang !== 'undefined' && currentLang === 'en') ? 'en' : 'sv';
            const pack = BILTEMA_MOCKS[lang];
            const item = pack[blockedCategoryKey] || pack.GENERIC_JUNK;

            ctx.save();
            ctx.setTransform(1, 0, 0, 1, 0, 0);

            // Biltema-blå djup bakgrund
            ctx.fillStyle = "rgba(4, 16, 44, 0.98)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Varningsram i Biltema-blått & gult
            const isPulse = Math.floor(Date.now() / 200) % 2 === 0;
            ctx.strokeStyle = isPulse ? "#2563eb" : "#ffd600";
            ctx.lineWidth = 6;
            ctx.strokeRect(16, 16, canvas.width - 32, canvas.height - 32);

            ctx.textAlign = "center";

            // Avdelningsetikett & Banner
            ctx.fillStyle = "#38bdf8";
            ctx.font = "bold 13px monospace";
            ctx.fillText(item.dept, canvas.width / 2, 46);

            ctx.fillStyle = isPulse ? "#ffd600" : "#ff1744";
            ctx.font = "bold 20px 'Courier New', monospace";
            ctx.fillText(pack.banner, canvas.width / 2, 70);

            // 🌭 BILTEMA-LOGGA (biltema.jfif)
            const imgW = 145, imgH = 90;

            if (biltemaImg.complete && biltemaImg.naturalWidth > 0) {
                ctx.drawImage(biltemaImg, imgX, imgY, imgW, imgH);
                ctx.strokeStyle = "#2563eb";
                ctx.lineWidth = 3;
                ctx.strokeRect(imgX, imgY, imgW, imgH);
            } else {
                ctx.fillStyle = "#0284c7";
                ctx.fillRect(imgX, imgY, imgW, imgH);
                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 22px sans-serif";
                ctx.fillText("BILTEMA", canvas.width / 2, imgY + 54);
            }

            // Huvudbox för hånet
            const boxW = 710, boxH = 210;
            const boxX = (canvas.width - boxW) / 2;
            const boxY = 186;

            ctx.fillStyle = "rgba(8, 22, 60, 0.95)";
            ctx.fillRect(boxX, boxY, boxW, boxH);
            ctx.strokeStyle = "#38bdf8";
            ctx.lineWidth = 2;
            ctx.strokeRect(boxX, boxY, boxW, boxH);

            // Rubrik för prylen
            ctx.fillStyle = "#ff1744";
            ctx.font = "bold 14px 'Courier New', monospace";
            ctx.fillText("⚠️ " + item.title, canvas.width / 2, boxY + 26);

            ctx.fillStyle = "#ffd600";
            ctx.font = "bold 11px monospace";
            ctx.fillText(pack.deviceLabel + `"${rawDeviceName}"`, canvas.width / 2, boxY + 44);

            // Dialogtext med automatisk radbrytning
            ctx.fillStyle = "#e2e8f0";
            ctx.font = "bold 12px monospace";
            const words = item.dialogue.split(' ');
            let line = '';
            let textY = boxY + 74;
            for (let n = 0; n < words.length; n++) {
                let testLine = line + words[n] + ' ';
                if (ctx.measureText(testLine).width > boxW - 40 && n > 0) {
                    ctx.fillText(line, canvas.width / 2, textY);
                    line = words[n] + ' ';
                    textY += 19;
                } else {
                    line = testLine;
                }
            }
            ctx.fillText(line, canvas.width / 2, textY);

            // Åtgärd / Körv-tips
            ctx.fillStyle = "#38bdf8";
            ctx.font = "bold 12px monospace";
            ctx.fillText(item.action, canvas.width / 2, boxY + 188);

            // Återställningsknapp
            ctx.fillStyle = "#2563eb";
            ctx.fillRect(canvas.width / 2 - 195, canvas.height - 68, 390, 42);
            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 2;
            ctx.strokeRect(canvas.width / 2 - 195, canvas.height - 68, 390, 42);

            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 12px monospace";
            ctx.fillText(pack.prompt, canvas.width / 2, canvas.height - 42);

            ctx.restore();
        }
    };
})();

// 🌐 ONLINEMOTOR MED PEERJS (P2P WEBRTC)
// =========================================================================
const OnlineEngine = {
    peer: null,
    conn: null,
    peerId: "",
    isHost: false,
    isConnected: false,
    state: "NONE",

    initHost: function() {
    if (!navigator.onLine) {
        currentScreenState = "NO_INTERNET";
        screenMessageTitle = currentLang === 'sv' ? "INGEN INTERNETANSLUTNING" : "NO INTERNET CONNECTION";
        screenMessageSub = currentLang === 'sv' ? "Kontrollera nätverkskabeln eller Wi-Fi!" : "Check network cable or Wi-Fi!";
        return;
    }

    this.isHost = true;
    currentScreenState = "CONNECTING";
    screenMessageTitle = currentLang === 'sv' ? "SKAPAR P2P-RUM..." : "CREATING P2P ROOM...";
    screenMessageSub = currentLang === 'sv' ? "Väntar på PeerJS-servern..." : "Waiting for PeerJS server...";

    this.peer = new Peer();
    
    // Timeout efter 8 sekunder om ingen anslutning sker
    let connTimeout = setTimeout(() => {
        if (!this.isConnected) {
            currentScreenState = "TIMEOUT";
            screenMessageTitle = currentLang === 'sv' ? "ANSLUTNINGEN TOG FÖR LÅNG TID" : "CONNECTION TIMED OUT";
            screenMessageSub = currentLang === 'sv' ? "Signalen svarade inte i tid." : "The signal did not respond in time.";
        }
    }, 8000);

    this.peer.on('open', (id) => {
        this.peerId = id;
        screenMessageTitle = currentLang === 'sv' ? "VÄNTAR PÅ MOTSTÅNDARE..." : "WAITING FOR OPPONENT...";
        screenMessageSub = `RUMS-ID: ${id}`;
    });

    this.peer.on('connection', (c) => {
        clearTimeout(connTimeout);
        this.conn = c;
        this.setupConnection();
    });

    this.peer.on('error', () => {
        clearTimeout(connTimeout);
        currentScreenState = "CONN_FAILED";
        screenMessageTitle = currentLang === 'sv' ? "ANSLUTNING MISSLYCKADES" : "CONNECTION FAILED";
        screenMessageSub = currentLang === 'sv' ? "Kunde inte upprätta P2P-sessionen." : "Could not establish P2P session.";
    });
},

    initJoin: function(targetId) {
    if (!navigator.onLine) {
        currentScreenState = "NO_INTERNET";
        screenMessageTitle = currentLang === 'sv' ? "INGEN INTERNETANSLUTNING" : "NO INTERNET CONNECTION";
        screenMessageSub = currentLang === 'sv' ? "Nätverksanslutning saknas." : "No network connection.";
        return;
    }

    this.isHost = false;
    currentScreenState = "CONNECTING";
    screenMessageTitle = currentLang === 'sv' ? "ANSLUTER TILL HOST..." : "CONNECTING TO HOST...";
    screenMessageSub = currentLang === 'sv' ? `Söker rum: ${targetId}` : `Searching room: ${targetId}`;

    let joinTimeout = setTimeout(() => {
        if (!this.isConnected) {
            currentScreenState = "TIMEOUT";
            screenMessageTitle = currentLang === 'sv' ? "TIMEOUT: INGET SVAR" : "TIMEOUT: NO RESPONSE";
            screenMessageSub = currentLang === 'sv' ? "Kontrollera rums-ID och brandvägg." : "Check room ID and firewall.";
        }
    }, 7000);

    this.peer = new Peer();
    this.peer.on('open', () => {
        this.conn = this.peer.connect(targetId);
        this.setupConnection();
    });

    this.peer.on('error', () => {
        clearTimeout(joinTimeout);
        currentScreenState = "CONN_FAILED";
        screenMessageTitle = currentLang === 'sv' ? "ANSLUTNING MISSLYCKADES" : "CONNECTION FAILED";
        screenMessageSub = currentLang === 'sv' ? "Kunde inte hitta motståndarens rum." : "Could not find opponent's room.";
    });
},

    setupConnection: function() {
        setInterval(function() {
        if (OnlineEngine.isConnected && OnlineEngine.conn && OnlineEngine.conn.open) {
            var pingStart = performance.now();
            OnlineEngine.send({ type: 'PING_PROBE', sent: pingStart });
        }
    }, 2000);
        this.conn.on('open', () => {
            this.isConnected = true;
            startMatch('ONLINE');
        });
        this.conn.on('data', (data) => {
            if (data.type === 'STATE' && !this.isHost) {
                applyOnlineState(data.payload);
            } else if (data.type === 'INPUT' && this.isHost) {
                handleClientInput(data.payload);
            }
            if (data.type === 'PING_PROBE') {
        OnlineEngine.send({ type: 'PONG_REPLY', sent: data.sent });
        let pingTimeout = setTimeout(() => {
        HardwareMonitor.reportPing(999, false);
    }, 1200);
    } else if (data.type === 'PONG_REPLY') {
        var rtt = performance.now() - data.sent;
        clearTimeout(pingTimeout);
    HardwareMonitor.reportPing(rtt, true);
    }
        });
    },

    send: function(msg) {
        if (this.conn && this.conn.open) {
            this.conn.send(msg);
        }
    }
};

// ⚔️ SPELARKLASS, HÄLSA & KRAFT-UPPDATERINGAR

let gameState = "MENU";
let gameMode = "LOCAL";
let totalPlayers = 2;
let winnerText = "";
let screenShakeTimer = 0;
let nukeFlashTimer = 0;

const PLAYER_COLORS = ["#00ffcc", "#ff1744", "#ffd600", "#c084fc"];

class Player {
    constructor(id, x, y, color, isCpu = false) {
        this.id = id;
        this.x = x;
        this.y = y;
        this.color = color;
        this.isCpu = isCpu;
        this.radius = 16;
        this.vx = 0;
        this.vy = 0;
        this.baseSpeed = 3.8;
        this.hp = 100;
        this.maxHp = 100;
        this.aimAngle = 0;
        this.shootCooldown = 0;
        this.alive = true;
        this.invulnerableTimer = 0; // Stjärna
        this.speedBoostTimer = 0;
        this.isCrosshairRed = false;
        this.meleeCooldown = 0;
        this.meleeSwingTimer = 0;
        this.maxHp = 150; // Ökad bashälsa för längre och intensivare matcher
        this.hp = 150;
        this.freezeTimer = 0;   // Blir helt fastfrusen
        this.poisonTimer = 0;   // Tickar skada över tid
        this.confuseTimer = 0;  // Inverterar styrning och sikte
        this.meleeHitboxRadius = 42;
    }

    update(arenaWidth, arenaHeight, obstacles, allPlayers) {
        if (!this.alive) return;
        if (this.shootCooldown > 0) this.shootCooldown--;
        if (this.invulnerableTimer > 0) this.invulnerableTimer--;
        if (this.speedBoostTimer > 0) this.speedBoostTimer--;
        if (this.shootCooldown > 0) this.shootCooldown--;
        if (this.meleeCooldown > 0) this.meleeCooldown--;
        if (this.meleeSwingTimer > 0) this.meleeSwingTimer--;

        // 🧪 Gift-effekt: Tickar skada var 30:e frame (0.5 sek)
        if (this.poisonTimer > 0) {
            this.poisonTimer--;
            if (this.poisonTimer % 30 === 0) {
                this.takeDamage(6);
                for (let k = 0; k < 3; k++) {
                    particles.push({
                        x: this.x, y: this.y,
                        vx: (Math.random() - 0.5) * 3,
                        vy: (Math.random() - 0.5) * 3,
                        color: "#22c55e",
                        life: 15
                    });
                }
            }
        }

        if (this.confuseTimer > 0) this.confuseTimer--;

        // 🧊 Frys-effekt: Kan varken gå eller skjuta medan timern tickar
        if (this.freezeTimer > 0) {
            this.freezeTimer--;
            this.vx = 0;
            this.vy = 0;
            return; // Spelaren står helt stilla under isen
        }

        let currentSpeed = this.baseSpeed * (this.speedBoostTimer > 0 ? 1.5 : 1.0);

        if (this.isCpu) {
            this.updateCpu(allPlayers, obstacles, currentSpeed);
        }

        this.x += this.vx;
        this.y += this.vy;
        this.vx *= 0.85;
        this.vy *= 0.85;

        // Ytterväggar
        this.x = Math.max(this.radius + 15, Math.min(arenaWidth - this.radius - 15, this.x));
        this.y = Math.max(this.radius + 15, Math.min(arenaHeight - this.radius - 15, this.y));

        // Hinder
        obstacles.forEach(obs => {
            if (this.x + this.radius > obs.x && this.x - this.radius < obs.x + obs.w &&
                this.y + this.radius > obs.y && this.y - this.radius < obs.y + obs.h) {
                this.x -= this.vx * 1.4;
                this.y -= this.vy * 1.4;
            }
        });
    }

    updateCpu(allPlayers, obstacles, currentSpeed) {
        let diff = CPU_DIFFICULTIES[selectedCpuDiffIdx];
        let target = null;
        let minDist = 9999;

        allPlayers.forEach(p => {
            if (p.id !== this.id && p.alive) {
                let d = Math.hypot(p.x - this.x, p.y - this.y);
                if (d < minDist) {
                    minDist = d;
                    target = p;
                }
            }
        });

        if (target) {
            let dx = target.x - this.x;
            let dy = target.y - this.y;
            let idealAngle = Math.atan2(dy, dx);

            // Precision baserad på svårighet
            let inaccuracy = (1 - diff.aimAccuracy) * (Math.random() - 0.5) * 1.2;
            this.aimAngle = idealAngle + inaccuracy;

            let step = currentSpeed * diff.speedMult * 0.35;
            if (minDist > 160) {
                this.vx += Math.cos(this.aimAngle) * step;
                this.vy += Math.sin(this.aimAngle) * step;
            } else if (minDist < 90) {
                this.vx -= Math.cos(this.aimAngle) * step;
                this.vy -= Math.sin(this.aimAngle) * step;
            }

            // Ducka för kulor
            if (Math.random() < diff.dodgeChance) {
                this.vx += (Math.random() - 0.5) * 4;
                this.vy += (Math.random() - 0.5) * 4;
            }

            if (this.shootCooldown <= 0 && Math.random() < diff.shootChance) {
                shootBullet(this);
            }
        }
    }

    takeDamage(dmg) {
        if (!this.alive || this.invulnerableTimer > 0) return;
        this.hp = Math.max(0, this.hp - dmg);
        SoundEngine.hit();

        if (this.hp <= 0) {
            this.alive = false;
            for (let k = 0; k < 18; k++) {
                particles.push({
                    x: this.x, y: this.y,
                    vx: (Math.random() - 0.5) * 8,
                    vy: (Math.random() - 0.5) * 8,
                    color: this.color,
                    life: 30
                });
            }
        }
    }

    draw(ctx) {
        if (!this.alive) return;

        ctx.save();
        ctx.translate(this.x, this.y);

        // Odödlig stjärneffekt (blinkande gyllene aura)
        if (this.invulnerableTimer > 0) {
            ctx.strokeStyle = Math.floor(Date.now() / 60) % 2 === 0 ? "#ffd600" : "#ffffff";
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.arc(0, 0, this.radius + 6, 0, Math.PI * 2);
            ctx.stroke();
        }

        // Rita närstridsattack / sving
        if (this.meleeSwingTimer > 0) {
            ctx.save();
            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.arc(0, 0, this.radius + 18, -0.6, 0.6);
            ctx.stroke();

            ctx.strokeStyle = this.color;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(0, 0, this.radius + 22, -0.8, 0.8);
            ctx.stroke();
            ctx.restore();
        }

        // 🧊 Isblock om spelaren är fryst
        if (this.freezeTimer > 0) {
            ctx.fillStyle = "rgba(56, 189, 248, 0.45)";
            ctx.strokeStyle = "#38bdf8";
            ctx.lineWidth = 2;
            ctx.strokeRect(-this.radius - 4, -this.radius - 4, (this.radius + 4) * 2, (this.radius + 4) * 2);
            ctx.fillRect(-this.radius - 4, -this.radius - 4, (this.radius + 4) * 2, (this.radius + 4) * 2);
        }

        // 🧪 Grön gift-aura
        if (this.poisonTimer > 0) {
            ctx.strokeStyle = "#22c55e";
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(0, 0, this.radius + 4, 0, Math.PI * 2);
            ctx.stroke();
        }

        // 🌀 Förvirrings-spiral
        if (this.confuseTimer > 0) {
            ctx.strokeStyle = "#a855f7";
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.arc(0, -this.radius - 18, 6, 0, Math.PI * 1.6);
            ctx.stroke();
        }

        // Kropp
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 2;
        ctx.stroke();

        // Pipa
        ctx.rotate(this.aimAngle);
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(this.radius - 2, -3, 11, 6);
        ctx.restore();

        // 🟢 HÄLSOMÄTARE (HP-BAR) OVANFÖR SPELAREN
        let barW = 38;
        let barH = 5;
        let barX = this.x - barW / 2;
        let barY = this.y - this.radius - 12;

        ctx.fillStyle = "rgba(0, 0, 0, 0.75)";
        ctx.fillRect(barX, barY, barW, barH);

        let hpPercent = this.hp / this.maxHp;
        ctx.fillStyle = hpPercent > 0.5 ? "#00ffcc" : (hpPercent > 0.25 ? "#ffd600" : "#ff1744");
        ctx.fillRect(barX, barY, barW * hpPercent, barH);

        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 1;
        ctx.strokeRect(barX, barY, barW, barH);

        // Namnetikett
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 9px monospace";
        ctx.textAlign = "center";
        let label = (this.isCpu ? "CPU " : "P") + (this.id + 1);
        ctx.fillText(label, this.x, barY - 3);
    }
}

// 🎁 POWER-UPS (BOMBER, HJÄRTAN, NUKE, STJÄRNA, SPEED)
// =========================================================================
let powerUps = [];
let bombs = [];
const POWERUP_TYPES = [
    { type: "HEART", symbol: "❤️", color: "#ff1744", label: "+40 HP" },
    { type: "BOMB_DROP", symbol: "💣", color: "#f59e0b", label: "BOMB" },
    { type: "STAR", symbol: "⭐", color: "#ffd600", label: "ODÖDLIG" },
    { type: "NUKE", symbol: "☢️", color: "#ff0055", label: "NUKE!" },
    { type: "SPEED", symbol: "⚡", color: "#00ffcc", label: "FART" },
    { type: "FREEZE_ENEMY", symbol: "🧊", color: "#38bdf8", label: "FRYS FIENDER" },
    { type: "POISON_ENEMY", symbol: "🧪", color: "#22c55e", label: "FÖRGIFTA FIENDER" },
    { type: "CONFUSE_ENEMY", symbol: "🌀", color: "#a855f7", label: "FÖRVIRRA FIENDER" }
];

function spawnPowerUp() {
    if (powerUps.length >= 4) return;
    let chosen = POWERUP_TYPES[Math.floor(Math.random() * POWERUP_TYPES.length)];
    powerUps.push({
        x: 60 + Math.random() * (canvas.width - 120),
        y: 60 + Math.random() * (canvas.height - 120),
        radius: 15,
        type: chosen.type,
        symbol: chosen.symbol,
        color: chosen.color,
        pulse: 0
    });
}

function applyPowerUp(player, pUp) {
    SoundEngine.powerup();

    if (pUp.type === "HEART") {
        player.hp = Math.min(player.maxHp, player.hp + 40);
    } else if (pUp.type === "STAR") {
        player.invulnerableTimer = 360; // 6 sekunder
    } else if (pUp.type === "SPEED") {
        player.speedBoostTimer = 300;
    } else if (pUp.type === "BOMB_DROP") {
        bombs.push({
            x: player.x,
            y: player.y,
            timer: 90, // 1.5 sekunder
            radius: 75,
            ownerId: player.id
        });
    } else if (pUp.type === "NUKE") {
        // ☢️ NUKE FÅR MAN INTE GÅ IN I – DEN SOM RÖR DEN DÖR OMEDELBART!
        nukeFlashTimer = 35;
        screenShakeTimer = 25;
        SoundEngine.nuke();
        player.takeDamage(9999);
    } else if (pUp.type === "MEGA_HP") { // 💖 1. MEGA-HÄLSA (Ökar maxhälsa och helar fullt)
        player.maxHp = 200; // Tillfälligt utökad hälsa (Overheal)
        player.hp = player.maxHp;
    }
    // 🧊 2. FRYS ALLA MOTSTÅNDARE (Låser fast dem i 2.5 sekunder)
    else if (pUp.type === "FREEZE_ENEMY") {
        players.forEach(target => {
            if (target.id !== player.id && target.alive && target.invulnerableTimer <= 0) {
                target.freezeTimer = 150; // 2.5 sekunder vid 60fps
            }
        });
    }
    // 🧪 3. FÖRGIFTA ALLA MOTSTÅNDARE (Skada över tid i 4 sekunder)
    else if (pUp.type === "POISON_ENEMY") {
        players.forEach(target => {
            if (target.id !== player.id && target.alive && target.invulnerableTimer <= 0) {
                target.poisonTimer = 240; // 4 sekunder
            }
        });
    }
    // 🌀 4. FÖRVIRRA MOTSTÅNDARE (Inverterar motståndarnas sikte och kontroller)
    else if (pUp.type === "CONFUSE_ENEMY") {
        players.forEach(target => {
            if (target.id !== player.id && target.alive && target.invulnerableTimer <= 0) {
                target.confuseTimer = 240; // 4 sekunder
            }
        });
    }
}

// Skott & Hinder
let bullets = [];
let particles = [];
let obstacles = [
    { x: 170, y: 140, w: 40, h: 130 },
    { x: 590, y: 140, w: 40, h: 130 },
    { x: 170, y: 330, w: 40, h: 130 },
    { x: 590, y: 330, w: 40, h: 130 },
    { x: 360, y: 260, w: 80, h: 80 }
];
let players = [];

function shootBullet(player) {
    if (player.shootCooldown > 0 || !player.alive) return;
    player.shootCooldown = 16;

    let bx = player.x + Math.cos(player.aimAngle) * (player.radius + 6);
    let by = player.y + Math.sin(player.aimAngle) * (player.radius + 6);

    bullets.push({
        x: bx,
        y: by,
        vx: Math.cos(player.aimAngle) * 10,
        vy: Math.sin(player.aimAngle) * 10,
        ownerId: player.id,
        color: player.color,
        damage: 25,
        life: 60
    });

    SoundEngine.laser();
}

function meleeAttack(player) {
    if (!player.alive || player.meleeCooldown > 0) return;
    player.meleeCooldown = 25;   // Cooldown mellan slag
    player.meleeSwingTimer = 12; // Hur länge slageffekten syns

    SoundEngine.hit();

    // Riktning för slaget framför spelaren
    let hitX = player.x + Math.cos(player.aimAngle) * 28;
    let hitY = player.y + Math.sin(player.aimAngle) * 28;

    // Gnistor vid sving
    for (let k = 0; k < 6; k++) {
        particles.push({
            x: hitX, y: hitY,
            vx: Math.cos(player.aimAngle + (Math.random() - 0.5)) * 5,
            vy: Math.sin(player.aimAngle + (Math.random() - 0.5)) * 5,
            color: "#ffffff",
            life: 12
        });
    }

    // Träffkoll mot motståndare i närstridszonen
    players.forEach(target => {
        if (target.alive && target.id !== player.id) {
            let dist = Math.hypot(hitX - target.x, hitY - target.y);
            if (dist <= player.meleeHitboxRadius) {
                target.takeDamage(40); // 40 skada per närstridsträff

                // Knockback-effekt (knuffas bakåt av slaget)
                target.vx += Math.cos(player.aimAngle) * 8;
                target.vy += Math.sin(player.aimAngle) * 8;

                if (typeof screenShakeTimer !== 'undefined') screenShakeTimer = 6;
            }
        }
    });
}

function startMatch(mode) {
    gameMode = mode;
    gameState = "PLAYING";
    matchTimer = MATCH_DURATION;
    bullets = [];
    bombs = [];
    powerUps = [];
    particles = [];
    players = [];
    screenShakeTimer = 0;
    nukeFlashTimer = 0;

    const spawns = [
        { x: 70, y: 70 },
        { x: 730, y: 530 },
        { x: 730, y: 70 },
        { x: 70, y: 530 }
    ];

    for (let i = 0; i < totalPlayers; i++) {
        let isCpu = (mode === "CPU" && i > 0);
        players.push(new Player(i, spawns[i].x, spawns[i].y, PLAYER_COLORS[i], isCpu));
    }
}

function applyOnlineState(payload) {
    payload.players.forEach((pData, idx) => {
        if (players[idx]) {
            players[idx].x = pData.x;
            players[idx].y = pData.y;
            players[idx].aimAngle = pData.aimAngle;
            players[idx].hp = pData.hp;
            players[idx].alive = pData.alive;
        }
    });
    bullets = payload.bullets;
}

function handleClientInput(input) {
    if (players[1] && players[1].alive) {
        players[1].vx += input.dx * players[1].baseSpeed * 0.35;
        players[1].vy += input.dy * players[1].baseSpeed * 0.35;
        players[1].aimAngle = input.aimAngle;
        if (input.shoot) shootBullet(players[1]);
    }
}
