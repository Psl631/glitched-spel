// 🎮 STYRNING, SIKTEN & TANGENTBORDSKONTROLLER
// =========================================================================
const keys = {};
let mouseX = 400, mouseY = 300;

window.addEventListener('keydown', (e) => {
    keys[e.code] = true;
    if (e.key === 'Escape') {
        if (currentScreenState !== "NONE") {
            currentScreenState = "NONE";
            gameState = "MENU";
            return;
        }
    }

    if (e.key === 'l' || e.key === 'L') {
        toggleLanguage();
        return;
    }

    if (gameState === "MENU") {
        if (e.key === '1') { totalPlayers = 2; startMatch('LOCAL'); }
        if (e.key === '2') { totalPlayers = 2; startMatch('CPU'); }
        if (e.key === '3') { gameState = "ONLINE_MENU"; }

        // Ändra antal spelare
        if (e.key === 'ArrowRight') totalPlayers = Math.min(4, totalPlayers + 1);
        if (e.key === 'ArrowLeft') totalPlayers = Math.max(2, totalPlayers - 1);

        // Ändra bot-svårighet (1-9) med siffertangenter eller W/S
        if (e.key >= '1' && e.key <= '9') {
            selectedCpuDiffIdx = parseInt(e.key) - 1;
        }
        if (e.key === 'w' || e.key === 'W') selectedCpuDiffIdx = Math.min(8, selectedCpuDiffIdx + 1);
        if (e.key === 's' || e.key === 'S') selectedCpuDiffIdx = Math.max(0, selectedCpuDiffIdx - 1);

        if (e.key === 'Enter') startMatch('LOCAL');
    } else if (gameState === "ONLINE_MENU") {
        if (e.key === 'h' || e.key === 'H') OnlineEngine.initHost();
        if (e.key === 'j' || e.key === 'J') {
            let target = prompt(t("onlineClientTitle"));
            if (target) OnlineEngine.initJoin(target.trim());
        }
        if (e.key === 'Escape') gameState = "MENU";
    } else if (gameState === "GAMEOVER") {
        if (e.key === 'Enter') startMatch(gameMode);
        if (e.key === 'Escape') gameState = "MENU";
    }
    
});

window.addEventListener('keyup', (e) => keys[e.code] = false);

window.addEventListener('mousemove', (e) => {
    const rect = canvas.getBoundingClientRect();
    mouseX = (e.clientX - rect.left) * (canvas.width / rect.width);
    mouseY = (e.clientY - rect.top) * (canvas.height / rect.height);
});

window.addEventListener('mousedown', (e) => {
    const rect = canvas.getBoundingClientRect();
    const cx = (e.clientX - rect.left) * (canvas.width / rect.width);
    const cy = (e.clientY - rect.top) * (canvas.height / rect.height);

    // Klick på flaggorna i högra hörnet
    if (cx >= 710 && cx <= 746 && cy >= 12 && cy <= 36) { toggleLanguage('sv'); return; }
    if (cx >= 754 && cx <= 790 && cy >= 12 && cy <= 36) { toggleLanguage('en'); return; }

    if (gameState === "PLAYING" && players[0] && players[0].alive) {
        shootBullet(players[0]);
    }
});

function pollGamepads() {
    if (!navigator.getGamepads) return;
    const gamepads = navigator.getGamepads();

    for (let i = 0; i < gamepads.length; i++) {
        const gp = gamepads[i];
        if (!gp || !gp.connected) continue;

        let playerIdx = 2 + i;
        if (totalPlayers === 2 && i === 0) playerIdx = 1;

        let p = players[playerIdx];
        if (!p || !p.alive) continue;

        let ax = Math.abs(gp.axes[0]) > 0.2 ? gp.axes[0] : 0;
        let ay = Math.abs(gp.axes[1]) > 0.2 ? gp.axes[1] : 0;
        p.vx += ax * p.baseSpeed * 0.35;
        p.vy += ay * p.baseSpeed * 0.35;

        let rAx = gp.axes.length >= 4 && Math.abs(gp.axes[2]) > 0.25 ? gp.axes[2] : ax;
        let rAy = gp.axes.length >= 4 && Math.abs(gp.axes[3]) > 0.25 ? gp.axes[3] : ay;
        if (Math.abs(rAx) > 0.2 || Math.abs(rAy) > 0.2) {
            p.aimAngle = Math.atan2(rAy, rAx);
        }

        // Skjut med A (0) eller R2 (7)
        if (gp.buttons[0]?.pressed || gp.buttons[7]?.pressed) {
            shootBullet(p);
        }

        // 🥊 NÄRSTRIDSATTACK: X / Fyrkant (knappindex 2)
        if (gp.buttons[2]?.pressed) {
            meleeAttack(p);
        }
    }
}

function processInputs() {
    if (gameState !== "PLAYING") return;

    // --- P1 (TANGENTBORD + MUS) ---
    if (players[0] && players[0].alive) {
        let p = players[0];
        let mult = p.confuseTimer > 0 ? -1 : 1; // 👈 Inverterar riktningen
        if (keys['KeyW']) p.vy -= p.baseSpeed * 0.3;
        if (keys['KeyS']) p.vy += p.baseSpeed * 0.3;
        if (keys['KeyA']) p.vx -= p.baseSpeed * 0.3;
        if (keys['KeyD']) p.vx += p.baseSpeed * 0.3;
        if (keys['Space']) shootBullet(players[0]);
        if (keys['KeyE'] || keys['KeyF']) meleeAttack(players[0]); // P1 Melee

        let targetAim = Math.atan2(mouseY - p.y, mouseX - p.x);
        p.aimAngle = p.confuseTimer > 0 ? targetAim + Math.PI : targetAim; // Bakvänt sikte
        

        // 🎯 SIKTESKONTROLL: BLIR RÖTT OM MAN SIKTAR PÅ EN MOTSTÅNDARE
        p.isCrosshairRed = false;
        players.forEach(other => {
            if (other.id !== p.id && other.alive) {
                let distToAim = Math.hypot(mouseX - other.x, mouseY - other.y);
                if (distToAim <= other.radius + 8) {
                    p.isCrosshairRed = true;
                }
            }
        });
    }

    // --- P2 (LOKAL) ---
    if (players[1] && players[1].alive && gameMode === "LOCAL") {
        let p = players[1];
        let moved = false;
        let dx = 0, dy = 0;
        if (keys['ArrowUp']) { p.vy -= p.baseSpeed * 0.3; dy = -1; moved = true; }
        if (keys['ArrowDown']) { p.vy += p.baseSpeed * 0.3; dy = 1; moved = true; }
        if (keys['ArrowLeft']) { p.vx -= p.baseSpeed * 0.3; dx = -1; moved = true; }
        if (keys['ArrowRight']) { p.vx += p.baseSpeed * 0.3; dx = 1; moved = true; }

        if (moved) p.aimAngle = Math.atan2(dy, dx);
        if (keys['Enter']) shootBullet(players[1]);
        if (keys['Numpad0'] || keys['KeyK']) meleeAttack(players[1]); // P2 Melee
    }

    // --- P2 (ONLINE CLIENT) ---
    if (gameMode === "ONLINE" && !OnlineEngine.isHost) {
        let dx = 0, dy = 0;
        if (keys['KeyW'] || keys['ArrowUp']) dy -= 1;
        if (keys['KeyS'] || keys['ArrowDown']) dy += 1;
        if (keys['KeyA'] || keys['ArrowLeft']) dx -= 1;
        if (keys['KeyD'] || keys['ArrowRight']) dx += 1;

        OnlineEngine.send({
            type: 'INPUT',
            payload: {
                dx: dx,
                dy: dy,
                aimAngle: Math.atan2(mouseY - 300, mouseX - 400),
                shoot: Boolean(keys['Space'] || keys['Enter'])
            }
        });
    }

    pollGamepads();
}

// =========================================================================
// 🔄 HUVUDLOOP & FYSIK
// =========================================================================
function update() {
    // 📡 Mät bildrutedelta för att upptäcka CPU-strypning/drops
    HardwareMonitor.updateMetrics();

    if (HardwareMonitor.isBlocked()) return;
    if (PvpAntiCheat.isTriggered()) return;
    if (gameState !== "PLAYING") return;

    processInputs();

    // Spawna power-ups slumpmässigt
    if (Math.random() < 0.006) {
        spawnPowerUp();
    }

    // Räkna ner timern under pågående match
    if (matchTimer > 0) {
        matchTimer--;
    } else {
        // Tiden är slut! Korar vinnaren baserat på högst HP
        gameState = "GAMEOVER";
        SoundEngine.win();

        let p1 = players[0];
        let p2 = players[1];

        if (p1 && p2) {
            if (p1.hp > p2.hp) {
                winnerText = t("winner") + "PLAYER 1 (" + p1.hp + " HP)";
            } else if (p2.hp > p1.hp) {
                let p2Name = p2.isCpu ? "CPU" : "PLAYER 2";
                winnerText = t("winner") + p2Name + " (" + p2.hp + " HP)";
            } else {
                winnerText = "DRAW! (" + p1.hp + " HP LIKA)";
            }
        } else {
            winnerText = "DRAW!";
        }
        return;
    }

    // Skärmskak & Nuke Flash
    if (screenShakeTimer > 0) screenShakeTimer--;
    if (nukeFlashTimer > 0) nukeFlashTimer--;

    // Spelaruppdatering
    players.forEach(p => p.update(canvas.width, canvas.height, obstacles, players));

    // Power-up upplockning
    for (let i = powerUps.length - 1; i >= 0; i--) {
        let pUp = powerUps[i];
        pUp.pulse += 0.05;

        players.forEach(p => {
            if (p.alive) {
                let dist = Math.hypot(p.x - pUp.x, p.y - pUp.y);
                if (dist < p.radius + pUp.radius) {
                    applyPowerUp(p, pUp);
                    powerUps.splice(i, 1);
                }
            }
        });
    }

    // Bombtimer och explosioner
    for (let i = bombs.length - 1; i >= 0; i--) {
        let b = bombs[i];
        b.timer--;
        if (b.timer <= 0) {
            // Bomben detonerar
            SoundEngine.hit();
            screenShakeTimer = 12;

            for (let k = 0; k < 25; k++) {
                particles.push({
                    x: b.x, y: b.y,
                    vx: (Math.random() - 0.5) * 10,
                    vy: (Math.random() - 0.5) * 10,
                    color: "#f59e0b",
                    life: 25
                });
            }

            players.forEach(p => {
                if (p.alive) {
                    let d = Math.hypot(p.x - b.x, p.y - b.y);
                    if (d <= b.radius) {
                        p.takeDamage(55);
                    }
                }
            });

            bombs.splice(i, 1);
        }
    }

    // Kulor
    for (let i = bullets.length - 1; i >= 0; i--) {
        let b = bullets[i];
        b.x += b.vx;
        b.y += b.vy;
        b.life--;

        obstacles.forEach(obs => {
            if (b.x > obs.x && b.x < obs.x + obs.w && b.y > obs.y && b.y < obs.y + obs.h) {
                b.life = 0;
            }
        });

        players.forEach(p => {
            if (p.alive && p.id !== b.ownerId) {
                let dist = Math.hypot(p.x - b.x, p.y - b.y);
                if (dist < p.radius + 4) {
                    p.takeDamage(b.damage);
                    b.life = 0;
                }
            }
        });

        if (b.life <= 0 || b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height) {
            bullets.splice(i, 1);
        }
    }

    // Partiklar
    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
    }

    // Slutkontroll
    // Kontrollera om matchen är över
    let alivePlayers = players.filter(p => p.alive);
    if (alivePlayers.length <= 1) {
        gameState = "GAMEOVER";
        SoundEngine.win();

        let isP1Winner = (alivePlayers.length === 1 && alivePlayers[0].id === 0);

        if (alivePlayers.length === 1) {
            let winLabel = (alivePlayers[0].isCpu ? "CPU " : "PLAYER ") + (alivePlayers[0].id + 1);
            winnerText = t("winner") + winLabel;
            // Visa vinst-pokal om P1 vann, annars dödskalle (förlust)
            currentScreenState = isP1Winner ? "VICTORY" : "DEFEAT";
        } else {
            winnerText = t("draw");
            currentScreenState = "DEFEAT";
        }

        screenMessageTitle = winnerText;
        screenMessageSub = t("restartPrompt");
    }

    // Online synk
    if (gameMode === "ONLINE" && OnlineEngine.isHost && OnlineEngine.isConnected) {
        OnlineEngine.send({
            type: 'STATE',
            payload: {
                players: players.map(p => ({ x: p.x, y: p.y, aimAngle: p.aimAngle, hp: p.hp, alive: p.alive })),
                bullets: bullets
            }
        });
    }
}

// =========================================================================
// 🎨 RENDERING (SIKTEN, HUD, ARENA & EFFEKTER)
// =========================================================================
function render() {
    ctx.save();

    // Skärmskakeffekt vid detonationer
    if (screenShakeTimer > 0) {
        let sx = (Math.random() - 0.5) * screenShakeTimer * 1.5;
        let sy = (Math.random() - 0.5) * screenShakeTimer * 1.5;
        ctx.translate(sx, sy);
    }

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Rutnät
    ctx.strokeStyle = "rgba(0, 255, 204, 0.12)";
    ctx.lineWidth = 1;
    for (let x = 0; x < canvas.width; x += 40) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
    }
    for (let y = 0; y < canvas.height; y += 40) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
    }

    // Hinder
    ctx.fillStyle = "#161b26";
    ctx.strokeStyle = "#38bdf8";
    ctx.lineWidth = 2;
    obstacles.forEach(obs => {
        ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
        ctx.strokeRect(obs.x, obs.y, obs.w, obs.h);
    });

    // Rita Power-ups och Nuke-fara
    powerUps.forEach(pUp => {
        let r = pUp.radius + Math.sin(pUp.pulse) * 2;

        if (pUp.type === "NUKE") {
            // Varningsfält runt Nuke så man ser att man inte får gå in i den
            ctx.fillStyle = "rgba(255, 0, 85, 0.25)";
            ctx.beginPath();
            ctx.arc(pUp.x, pUp.y, r + 8, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = Math.floor(Date.now() / 100) % 2 === 0 ? "#ff0055" : "#ffd600";
            ctx.lineWidth = 2.5;
        } else {
            ctx.fillStyle = "rgba(0, 0, 0, 0.6)";
            ctx.strokeStyle = pUp.color;
            ctx.lineWidth = 2;
        }

        ctx.beginPath();
        ctx.arc(pUp.x, pUp.y, r, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        ctx.font = "16px sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(pUp.symbol, pUp.x, pUp.y);
    });

    // Rita Bomber
    bombs.forEach(b => {
        let flash = Math.floor(b.timer / 8) % 2 === 0;
        ctx.fillStyle = flash ? "#ff1744" : "#111111";
        ctx.beginPath();
        ctx.arc(b.x, b.y, 14, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = "#ffd600";
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.font = "14px sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("💣", b.x, b.y);
    });

    // Skott
    bullets.forEach(b => {
        ctx.fillStyle = b.color;
        ctx.shadowColor = b.color;
        ctx.shadowBlur = 8;
        ctx.beginPath();
        ctx.arc(b.x, b.y, 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
    });

    // Partiklar
    particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, 3, 3);
    });

    // Spelare
    players.forEach(p => p.draw(ctx));

    // 🎯 DYNAMISKT SIKTE FÖR P1 (GRÖNT -> RÖTT NÄR MAN SIKTAR PÅ EN FIENDE)
    if (gameState === "PLAYING" && players[0] && players[0].alive) {
        let crossColor = players[0].isCrosshairRed ? "#ff1744" : "#00ffcc";
        ctx.save();
        ctx.strokeStyle = crossColor;
        ctx.lineWidth = 2;

        // Yttre cirkel
        ctx.beginPath();
        ctx.arc(mouseX, mouseY, 12, 0, Math.PI * 2);
        ctx.stroke();

        // Kors
        ctx.beginPath();
        ctx.moveTo(mouseX - 18, mouseY); ctx.lineTo(mouseX + 18, mouseY);
        ctx.moveTo(mouseX, mouseY - 18); ctx.lineTo(mouseX, mouseY + 18);
        ctx.stroke();

        // Mittpunkt
        ctx.fillStyle = crossColor;
        ctx.beginPath();
        ctx.arc(mouseX, mouseY, 2.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }

    // ☢️ NUKE VIT BLIXT
    if (nukeFlashTimer > 0) {
        ctx.fillStyle = `rgba(255, 255, 255, ${nukeFlashTimer / 35})`;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    // Flaggor
    drawSwedishFlag(ctx, 710, 12, 36, 24);
    drawBritishFlag(ctx, 754, 12, 36, 24);

    // =========================================================================
    // 🏆 TOPP-HUD: TIMER & STORA HÄLSOMÄTARE (LUCKIEST GUY)
    // =========================================================================
    if (gameState === "PLAYING" && players.length >= 2) {
        ctx.save();

        let p1 = players[0];
        let p2 = players[1];
        let centerX = canvas.width / 2;
        let barWidth = 260;
        let barHeight = 22;
        let topY = 16;

        // 1. VÄNSTER HÄLSOMÄTARE: SPELARE 1
        let p1Pct = Math.max(0, p1.hp / p1.maxHp);
        ctx.fillStyle = "rgba(0, 0, 0, 0.75)";
        ctx.fillRect(centerX - 55 - barWidth, topY, barWidth, barHeight);

        // Fyllning från höger mot mitten
        ctx.fillStyle = p1Pct > 0.5 ? "#00ffcc" : (p1Pct > 0.25 ? "#ffd600" : "#ff1744");
        ctx.fillRect(centerX - 55 - (barWidth * p1Pct), topY, barWidth * p1Pct, barHeight);

        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 2.5;
        ctx.strokeRect(centerX - 55 - barWidth, topY, barWidth, barHeight);

        // P1 Namn & HP-text
        ctx.font = "18px 'Luckiest Guy', cursive";
        ctx.fillStyle = "#ffffff";
        ctx.textAlign = "left";
        ctx.fillText("P1: " + Math.ceil(p1.hp) + " HP", centerX - 50 - barWidth, topY + barHeight - 4);

        // 2. HÖGER HÄLSOMÄTARE: SPELARE 2 / CPU
        let p2Pct = Math.max(0, p2.hp / p2.maxHp);
        ctx.fillStyle = "rgba(0, 0, 0, 0.75)";
        ctx.fillRect(centerX + 55, topY, barWidth, barHeight);

        // Fyllning från mitten mot höger
        ctx.fillStyle = p2Pct > 0.5 ? "#ff1744" : (p2Pct > 0.25 ? "#ffd600" : "#ff0055");
        ctx.fillRect(centerX + 55, topY, barWidth * p2Pct, barHeight);

        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 2.5;
        ctx.strokeRect(centerX + 55, topY, barWidth, barHeight);

        // P2/CPU Namn & HP-text
        ctx.font = "18px 'Luckiest Guy', cursive";
        ctx.fillStyle = "#ffffff";
        ctx.textAlign = "right";
        let p2Title = (p2.isCpu ? "CPU: " : "P2: ") + Math.ceil(p2.hp) + " HP";
        ctx.fillText(p2Title, centerX + 50 + barWidth, topY + barHeight - 4);

        // 3. CENTRERAD MATCHTIMER
        let secondsLeft = Math.ceil(matchTimer / 60);
        let timerBoxW = 75;
        let timerBoxH = 40;

        ctx.fillStyle = "#0c0d14";
        ctx.fillRect(centerX - timerBoxW / 2, topY - 8, timerBoxW, timerBoxH);

        // Röd pulserande ram när det är mindre än 10 sekunder kvar
        let isCriticalTime = secondsLeft <= 10;
        ctx.strokeStyle = isCriticalTime ? (Math.floor(Date.now() / 150) % 2 === 0 ? "#ff1744" : "#ffd600") : "#00ffcc";
        ctx.lineWidth = 3;
        ctx.strokeRect(centerX - timerBoxW / 2, topY - 8, timerBoxW, timerBoxH);

        ctx.font = "30px 'Luckiest Guy', cursive";
        ctx.fillStyle = isCriticalTime ? "#ff1744" : "#ffeb3b";
        ctx.textAlign = "center";
        ctx.fillText(secondsLeft, centerX, topY + 23);

        ctx.restore();
    }

    // =========================================================================
    // 🖥️ MENYER & OVERLAYS
    // =========================================================================
    if (gameState === "MENU") {
        ctx.fillStyle = "rgba(6, 7, 10, 0.94)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.textAlign = "center";
        ctx.fillStyle = "#ffeb3b";
        ctx.font = "bold 26px 'Courier New', monospace";
        ctx.fillText(t("title"), canvas.width / 2, 75);

        ctx.fillStyle = "#38bdf8";
        ctx.font = "13px monospace";
        ctx.fillText(t("subTitle"), canvas.width / 2, 105);

        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 15px monospace";
        ctx.fillText(`${t("players")} [ ◄ ${totalPlayers}P ► ]`, canvas.width / 2, 155);

        // 🤖 CPU Svårighetsväljare (1-9)
        let curDiff = CPU_DIFFICULTIES[selectedCpuDiffIdx];
        ctx.fillStyle = "#facc15";
        ctx.font = "bold 13px monospace";
        ctx.fillText(`${t("cpuDiffTitle")} [ ◄ Nivå ${curDiff.name} ► ] (Välj med W/S eller 1-9)`, canvas.width / 2, 195);

        ctx.fillStyle = "#00ffcc";
        ctx.font = "14px monospace";
        ctx.fillText(t("modeLocal"), canvas.width / 2, 250);
        ctx.fillText(t("modeCpu"), canvas.width / 2, 285);
        ctx.fillText(t("modeOnline"), canvas.width / 2, 320);

        ctx.fillStyle = "#aaaaaa";
        ctx.font = "11px monospace";
        ctx.fillText(t("controlsP1"), canvas.width / 2, 395);
        ctx.fillText(t("controlsP2"), canvas.width / 2, 420);
        ctx.fillText(t("controlsP3P4"), canvas.width / 2, 445);

        ctx.fillStyle = "#22c55e";
        ctx.font = "bold 16px monospace";
        ctx.fillText(t("startMatch"), canvas.width / 2, 515);
    } else if (gameState === "ONLINE_MENU") {
        ctx.fillStyle = "rgba(6, 7, 10, 0.95)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.textAlign = "center";
        ctx.fillStyle = "#00ffcc";
        ctx.font = "bold 24px monospace";
        ctx.fillText("🌐 P2P WEBRTC ONLINELÄGE", canvas.width / 2, 100);

        ctx.fillStyle = "#ffffff";
        ctx.font = "14px monospace";
        ctx.fillText(t("hostRoom"), canvas.width / 2, 180);
        ctx.fillText(t("joinRoom"), canvas.width / 2, 220);

        if (OnlineEngine.state === "HOSTING") {
            ctx.fillStyle = "#ffeb3b";
            ctx.font = "bold 15px monospace";
            ctx.fillText(t("onlineHostTitle"), canvas.width / 2, 300);
            ctx.fillStyle = "#00ffcc";
            ctx.font = "bold 18px monospace";
            ctx.fillText(OnlineEngine.peerId || t("waitingPeer"), canvas.width / 2, 335);
        }

        ctx.fillStyle = "#888888";
        ctx.font = "12px monospace";
        ctx.fillText("[ESC: TILLBAKA TILL HUVUDMENY]", canvas.width / 2, 500);
    } else if (gameState === "GAMEOVER") {
        ctx.fillStyle = "rgba(0, 0, 0, 0.88)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.textAlign = "center";
        ctx.fillStyle = "#ffd600";
        ctx.font = "bold 28px monospace";
        ctx.fillText(winnerText, canvas.width / 2, canvas.height / 2 - 20);

        ctx.fillStyle = "#ffffff";
        ctx.font = "14px monospace";
        ctx.fillText(t("restartPrompt"), canvas.width / 2, canvas.height / 2 + 40);
    }

    ctx.restore();

    if (currentScreenState !== "NONE") {
        StatusScreens.renderOverlay(ctx, canvas, currentScreenState, screenMessageTitle, screenMessageSub);
    }
    HardwareMonitor.drawHUD(ctx, canvas);

    if (PvpAntiCheat.isTriggered()) {
        PvpAntiCheat.drawLockScreen(ctx, canvas);
    }
    HardwareMonitor.drawOverlay(ctx, canvas);
    
}

function mainLoop() {
    update();
    render();
    requestAnimationFrame(mainLoop);
}

requestAnimationFrame(mainLoop);
</script>
</body>
</html>
