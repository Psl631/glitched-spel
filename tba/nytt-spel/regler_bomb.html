        function detectBrowserLanguage() {
    // 1. Kontrollera URL-parameter (?lang=no eller ?tournament=true)
    const params = new URLSearchParams(window.location.search);
    if (params.get('tournament') === 'true' || params.get('lang') === 'no') {
        return 'no';
    }

    // 2. Läs av språkinställningarna i användarens operativsystem/webbläsare
    const browserLangs = navigator.languages || [navigator.language || navigator.userLanguage || ''];
    for (let raw of browserLangs) {
        const l = raw.toLowerCase();
        // Norska (Bokmål, Nynorsk, generisk)
        if (l.startsWith('no') || l.startsWith('nb') || l.startsWith('nn')) return 'no';
        // Svenska
        if (l.startsWith('sv')) return 'sv';
        // Engelska
        if (l.startsWith('en')) return 'en';
    }

    // Standard fallback om datorn kör t.ex. finska, tyska eller annat
    return 'no';
}

                    <li><strong>PAUS:</strong> Öppning av Crew-verktyg pausar automatiskt spelet utan att trigga Kameks anti-cheat.</li>
                </ul>
            </div>
        `;

        function switchView(view) {
            currentView = view;
            document.getElementById('tab-rules').classList.toggle('active', view === 'rules');
            document.getElementById('tab-admin').classList.toggle('active', view === 'admin');
            document.getElementById('langBtnGroup').style.display = view === 'rules' ? 'flex' : 'none';

            if (view === 'rules') {
                setRuleLang(currentRuleLang);
            } else {
                document.getElementById('mTitle').innerText = "🛠️ CREW ADMIN & BRACKET-LATHUND";
                document.getElementById('mBody').innerHTML = ADMIN_HTML;
                document.getElementById('mCloseBtn').innerText = "TILLBAKA";
                renderBracket(8);
            }
        }

        function setRuleLang(lang) {
            currentRuleLang = lang;
            document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
            const btn = document.getElementById('btn-' + lang);
            if (btn) btn.classList.add('active');

            const data = RULE_I18N[lang] || RULE_I18N.sv;
            document.getElementById('mTitle').innerText = data.title;
            document.getElementById('mBody').innerHTML = data.body;
            document.getElementById('mCloseBtn').innerText = data.closeBtn;
        }

        function renderBracket(count) {
            const container = document.getElementById('bracketCanvas');
            if (!container) return;

            let html = "";
            if (count === 4) {
                html = `
                    <div class="bracket-round">
                        <strong style="color:#38bdf8;">SEMIFINAL <span class="match-badge badge-rand">SLUMP</span></strong>
                        <div class="match-card">Match W1: Spelare 1 vs 2</div>
                        <div class="match-card">Match W2: Spelare 3 vs 4</div>
                        <div class="match-card" style="border-color:#f59e0b;">Match L1: Förlorare W1 vs W2<br><small style="color:#f59e0b;">(Losers: 1 förlust = UTE)</small></div>
                    </div>
                    <div class="bracket-round">
                        <strong style="color:#ff0055;">STORFINAL <span class="match-badge badge-blind">BLIND ??</span></strong>
                        <div class="match-card" style="border-color:#ff0055;">Vinnare Winners vs Vinnare Losers</div>
                        <div class="match-card" style="border-color:#ef4444; background:#2a0812;">
                            <strong>🔥 RESET BRACKET</strong><br>
                            Körs om Losers vinner Match 1!
                        </div>
                    </div>
                `;
            } else if (count === 8) {
                html = `
                    <div class="bracket-round">
                        <strong style="color:#00ffcc;">KVARTSFINAL <span class="match-badge badge-15s">15s</span></strong>
                        <div class="match-card">Bord 1 (4 Spelare)</div>
                        <div class="match-card">Bord 2 (4 Spelare)</div>
                    </div>
                    <div class="bracket-round">
                        <strong style="color:#38bdf8;">SEMIFINAL <span class="match-badge badge-rand">SLUMP</span></strong>
                        <div class="match-card">Winners: Top 2 Bord 1 & 2</div>
                        <div class="match-card" style="border-color:#f59e0b;">Losers Bracket: 2:a chansen</div>
                    </div>
                    <div class="bracket-round">
                        <strong style="color:#ff0055;">STORFINAL <span class="match-badge badge-blind">BLIND ??</span></strong>
                        <div class="match-card" style="border-color:#ff0055;">Winners Champ vs Losers Champ</div>
                        <div class="match-card" style="border-color:#ef4444; background:#2a0812;">
                            <strong>🔥 RESET MATCH</strong><br>
                            Avgörande match om Losers vinner!
                        </div>
                    </div>
                `;
            } else {
                html = `
                    <div class="bracket-round">
                        <strong style="color:#00ffcc;">OMGÅNG 1 <span class="match-badge badge-15s">15s</span></strong>
                        <div class="match-card">Bord A, B, C, D (4p/bord)</div>
                    </div>
                    <div class="bracket-round">
                        <strong style="color:#00ffcc;">KVARTSFINAL <span class="match-badge badge-15s">15s</span></strong>
                        <div class="match-card">Winners Bord 1 & 2</div>
                        <div class="match-card" style="border-color:#f59e0b;">Losers Omgång 1 & 2</div>
                    </div>
                    <div class="bracket-round">
                        <strong style="color:#38bdf8;">SEMIFINAL <span class="match-badge badge-rand">SLUMP</span></strong>
                        <div class="match-card">Winners Final & Losers Final</div>
                    </div>
                    <div class="bracket-round">
                        <strong style="color:#ff0055;">STORFINAL <span class="match-badge badge-blind">BLIND ??</span></strong>
                        <div class="match-card" style="border-color:#ff0055;">Grand Finals + Eventuell Reset</div>
                    </div>
                `;
            }
            container.innerHTML = html;
        }
        function openModal(defaultView = 'rules') {
            const savedLang = localStorage.getItem('trivia_lang') || 'sv';
            currentRuleLang = ['sv', 'no', 'en'].includes(savedLang) ? savedLang : 'sv';
            document.getElementById('ruleModalOverlay').style.display = 'flex';
            switchView(defaultView);
        }

        function closeModal() {
            document.getElementById('ruleModalOverlay').style.display = 'none';
        }

        function onOverlayClick(e) {
            if (e.target.id === 'ruleModalOverlay') closeModal();
        }

        // F1 & ESC tangentstöd
        window.addEventListener('keydown', (e) => {
            if (e.key === 'F1') {
                e.preventDefault();
                const modal = document.getElementById('ruleModalOverlay');
                if (modal.style.display === 'flex') {
                    closeModal();
                } else {
                    openModal('rules');
                }
            } else if (e.key === 'Escape') {
                closeModal();
            }
        });
    </script>
</body>
</html>
