const UsbDeviceEnforcer = (function() {
    const ALLOWED_VENDORS = [
        0x054c, // Sony (PS3, PS4, PS5, Buzz!)

        0x1b1c, // Corsair (Tangentbord, Möss, Headsets)
        0x1038, // SteelSeries (Headsets, Möss)
        0x041e, // Creative Labs (Webbkameror, Audio/Mickar)
        0x08a5, // Blue Microphones (Yeti, Snowball)
        0x03f0, // HP / HyperX (Möss, Headsets)
        0x17ef  // Lenovo (Cams, Accessories)
    ];

    const ALLOWED_KEYWORDS = [
        "LIGHTGUN", "GUN", "GUNCON", "AIMTRAK", "SINDEN", "MAYFLASH", "ADAPTER", "SENSOR",
        "CONTROLLER", "GAMEPAD", "JOYSTICK", "BUZZ", "SCENE IT", "WII", "DANCE",
        "CAMERA", "WEBCAM", "VIDEO", "CAM",
        "MICROPHONE", "MIC", "AUDIO", "HEADSET", "HEADPHONE", "SOUND",
        "MOUSE", "POINTER", "TRACKBALL",
        "KEYBOARD", "KEYPAD"
    ];

    let blockedAlert = {
        active: false,
        character: "KAMEK", // "KAMEK" eller "GÖRAN"
        deviceName: "",
        title: "",
        mockText: "",
        timer: 0
    };

    function isAllowed(device) {
        const vendorId = device.vendorId || 0;
        const name = (device.productName || device.id || "").toUpperCase();

        if (ALLOWED_VENDORS.includes(vendorId)) return true;

        for (let kw of ALLOWED_KEYWORDS) {
            if (name.includes(kw)) return true;
        }

        if (device.collections && device.collections.length > 0) {
            for (let c of device.collections) {
                if ([1, 11, 12].includes(c.usagePage)) return true;
            }
        }
        return false;
    }

    function generateMock(name, character) {
        const u = name.toUpperCase();

        if (character === "KAMEK") {
            if (u.includes("PRINTER") || u.includes("SKRIVARE")) {
                return "🧙‍♂️ KAMEK: 'En skrivare?! Trodde du att du kunde skriva ut ett intyg på att du inte suger?! Dra ur sladden innan jag förvandlar papperstråget till aska!'";

            } else if (u.includes("FLASH") || u.includes("DRIVE") || u.includes("KINGSTON") || u.includes("SANDISK")) {

                return "🧙‍♂️ KAMEK: 'Ett hembygge från slöjden med två motstånd och en lysdiod?! Tror du att det imponerar på min magi?!'";

            }
        } else {
            // Görans hån

                return "👾 GÖRAN: 'Haha! En skrivare?! Ska du skriva ut en manual för hur man faktiskt siktar?! Lägg ner och spela som folk!'";
            } else if (u.includes("BARCODE") || u.includes("SCANNER")) {

    function blockDevice(device) {

(function() {
    let lastActivityTime = Date.now();
    let hasWarnedAFK = false;

    function resetActivity() {
        lastActivityTime = Date.now();
        hasWarnedAFK = false;
    }

    // Lyssna på mus och tangentbord
    window.addEventListener('mousemove', resetActivity);
    window.addEventListener('mousedown', resetActivity);
    window.addEventListener('keydown', resetActivity);

    // Kontrollera om handkontrollen rörs eller knapp trycks
    function pollGamepadActivity() {
        if (!navigator.getGamepads) return false;
        var gps = navigator.getGamepads();
        for (var i = 0; i < gps.length; i++) {
            var gp = gps[i];
            if (!gp || !gp.connected) continue;

            // Spakar
            for (var a = 0; a < gp.axes.length; a++) {
                if (Math.abs(gp.axes[a]) > 0.15) {
                    resetActivity();
                    return true;
                }
            }
            // Knappar
            for (var b = 0; b < gp.buttons.length; b++) {
                if (gp.buttons[b] && (gp.buttons[b].pressed || gp.buttons[b].value > 0.15)) {
                    resetActivity();
                    return true;
                }
            }
        }
        return false;
    }

    // Exponera reset-funktionen globalt så spelet kan nolla timern vid start
    window.resetAFKTimer = resetActivity;

    setInterval(function() {
        // Kontrollera att matchen faktiskt pågår
        if (typeof isGameCurrentlyRunning === 'function' && !isGameCurrentlyRunning()) {
            resetActivity();
            return;
        }

        if (typeof AntiCheatEngine !== 'undefined' && AntiCheatEngine.isTriggered && AntiCheatEngine.isTriggered()) {
            resetActivity();
            return;
        }

        // Avläs gamepad
        pollGamepadActivity();

        const idleDuration = Date.now() - lastActivityTime;

        // 1. Förvarning vid 10 sekunders inaktivitet
        if (idleDuration > 10000 && idleDuration <= 15000 && !hasWarnedAFK) {
            hasWarnedAFK = true;
            if (typeof addFloatingText === 'function') {
                addFloatingText("⚠️ VAKNA! AFK-BLOCKERING OM 5 SEKUNDER!", 320, 160, "#ffeb3b", 18);
            }
            try {
                let warnAudio = new Audio('pauseerr.wav');
                warnAudio.volume = 0.6;
                warnAudio.play().catch(function() {});
            } catch (e) {}
        }

        // 2. Kamek-blockering vid 15 sekunder
        if (idleDuration > 15000) {
            resetActivity();
            if (typeof window.triggerKamekLock === 'function') {
                window.triggerKamekLock("AFK_NAP");
            }
        }
    }, 1000);
})();

const SystemHealthSensors = (function() {
    let lastFrameTime = performance.now();
    let lowFpsCounter = 0;
    let highCpuCounter = 0;

    return {
        init: function() {
            window.addEventListener('offline', function() {
                if (typeof window.triggerKamekLock === 'function') {
                    window.triggerKamekLock("LOST_CONNECTION");
                }
            });
        },

        checkMetrics: function() {
            const now = performance.now();
            const delta = now - lastFrameTime;
            lastFrameTime = now;

            const inGame = (typeof BossBattleGame !== 'undefined' && BossBattleGame.isActive) &&
                           (typeof showStartScreen === 'undefined' || !showStartScreen) &&
                           (typeof isGameOver === 'undefined' || !isGameOver);

            if (!inGame) return;

            // 1. Låg FPS / Lagg (>45ms per frame = under ~22 FPS)
            if (delta > 45) {
                lowFpsCounter++;
                if (lowFpsCounter === 30) { // Mjuk varning efter en stunds lagg
                    if (typeof addFloatingText === 'function') {
                        addFloatingText("⚠️ VARNING: LÅG FPS / LAGG DETEKTERAT!", 320, 150, "#ffeb3b", 16);
                    }
                }
                if (lowFpsCounter > 150) { // Hård blockering om det fortsätter
                    lowFpsCounter = 0;
                    window.triggerKamekLock("LOW_FPS");
                }
            } else {
                lowFpsCounter = Math.max(0, lowFpsCounter - 1);
            }

            // 2. RAM-minne (om tillgängligt via performance.memory)
            if (window.performance && performance.memory) {
                const used = performance.memory.usedJSHeapSize;
                const limit = performance.memory.jsHeapSizeLimit;
                const ratio = used / limit;

                if (ratio > 0.85 && ratio <= 0.95) {
                    // Mjuk varning vid högt minnesbruk
                    if (Math.random() < 0.005 && typeof addFloatingText === 'function') {
                        addFloatingText("⚠️ VARNING: LITE RAM-MINNE KVAR!", 320, 180, "#ff9800", 16);
                    }
                } else if (ratio > 0.95) {
                    window.triggerKamekLock("RAM_FULL");
                }
            }
        }
    };
})();

// =========================================================================
const SystemHealthSensorsII = (function() {
    let lastFrameTime = performance.now();
    let lowFpsCount = 0;
    let isCheckingPing = false;

    return {
        // 1. KONTROLLERA NÄTVERK & TEST-FETCH VID BRUTEN ANSLUTNING
        initNetworkMonitor: function() {
            window.addEventListener('offline', function() {
                SystemHealthSensorsII.verifyNetworkLoss();
            });
        },

       verifyNetworkLoss: function() {
    fetch("https://www.google.com/favicon.ico?" + Date.now(), { 
        method: 'HEAD', 
        mode: 'no-cors', 
        cache: 'no-store' 
    })
    .then(function() {})
    .catch(function() {
        if (typeof window.triggerKamekLock === 'function') {
            window.triggerKamekLock("LOST_CONNECTION", true);
        }
    });
},

        // 2. MÄT PING: TOAST VID HÖG PING, HÅRD LÅSNING VID KRITISK NIVÅ
        criticalPingStrikeCount: 0,

        measurePing: function() {
            if (isCheckingPing || !navigator.onLine) return;
            isCheckingPing = true;
            var start = performance.now();
            var self = this;

            fetch("https://www.google.com/favicon.ico?" + Date.now(), { 
                method: 'HEAD', 
                mode: 'no-cors', 
                cache: 'no-store' 
            })
            .then(function() {
                var ping = Math.round(performance.now() - start);
                isCheckingPing = false;

                var inGame = (typeof BossBattleGame !== 'undefined' && BossBattleGame.isActive) &&
                             (typeof showStartScreen === 'undefined' || !showStartScreen) &&
                             (typeof isGameOver === 'undefined' || !isGameOver);

                if (!inGame) {
                    self.criticalPingStrikeCount = 0;
                    return;
                }

                // NIVÅ 1: Varning / Toast vid måttlig lagg (400 - 799 ms)
                if (ping >= 400 && ping < 800) {
                    self.criticalPingStrikeCount = 0;
                    if (typeof window.addFloatingText === 'function') {
                        window.addFloatingText("📶 VARNING: HÖG PING (" + ping + " ms)", 320, 80, "#facc15", 15);
                    }
                }
                // NIVÅ 2: Kritisk nivå (≥ 800 ms)
                else if (ping >= 800) {
                    self.criticalPingStrikeCount++;

                    // Visar först en röd varning vid första toppen
                    if (typeof window.addFloatingText === 'function') {
                        window.addFloatingText("🚨 KRITISK PING: " + ping + " ms!", 320, 80, "#ef4444", 17);
                    }

                    // Kräver 2 mätningar i rad för att undvika falsklarm från CPU-spikar
                    if (self.criticalPingStrikeCount >= 2) {
                        self.criticalPingStrikeCount = 0;
                        if (typeof window.triggerKamekLock === 'function') {
                            window.triggerKamekLock("HIGH_PING");
                        }
                    }
                } else {
                    // Normal anslutning återställer räknaren
                    self.criticalPingStrikeCount = 0;
                }
            })
            .catch(function() {
                isCheckingPing = false;
            });
        },

        // 3. MÄT CPU-BELASTNING & FRAMEDROPS I SPEL-LOOPEN
        checkPerformance: function() {
            const now = performance.now();
            const delta = now - lastFrameTime;
            lastFrameTime = now;

            // Delta > 40ms motsvarar under 25 FPS
            if (delta > 40) {
                lowFpsCount++;
                if (lowFpsCount > 90) { // ~3 sekunder av kraftigt lagg
                    lowFpsCount = 0;
                    if (typeof window.triggerKamekLock === 'function') {
                        window.triggerKamekLock("HIGH_CPU");
                    }
                }
            } else {
                lowFpsCount = Math.max(0, lowFpsCount - 1);
            }

            // 4. KONTROLLERA RAM-MINNE OM WEBBLÄSAREN STÖDER DET
            if (window.performance && performance.memory) {
                const used = performance.memory.usedJSHeapSize;
                const limit = performance.memory.jsHeapSizeLimit;
                if (used / limit > 0.90) { // Mer än 90% fullt minne
                    if (typeof window.triggerKamekLock === 'function') {
                        window.triggerKamekLock("RAM_FULL");
                    }
                }
            }
        }
    };
})();

// 🎮 KAMEK & GÖRAN: HANDKONTROLLS-ENFORCER (BANNADE RETRO- & V-SMILE-DOSOR)
// =========================================================================
const ControllerBanEnforcer = (function() {
    let checkedGamepads = new Set();

    function evaluateGamepad(gp) {
        if (!gp || !gp.connected) return;
        if (checkedGamepads.has(gp.index)) return;
        checkedGamepads.add(gp.index);

        const id = (gp.id || "").toLowerCase();
        const buttonsCount = gp.buttons ? gp.buttons.length : 0;
        const axesCount = gp.axes ? gp.axes.length : 0;

        let banReasonKey = null;

        // 1. V-SMILE (Vtech V.Smile) - SKALL GARANTERAT BANNAS!
        if (id.includes("vtech") || id.includes("v.smile") || id.includes("vsmile") || id.includes("learning")) {
            banReasonKey = "VSMILE";
        }
        // 2. 8BITDO
        else if (id.includes("8bitdo") || id.includes("22d8") || id.includes("2d28")) {
            banReasonKey = "8BITDO";
        }
        // 3. SEGA (Mega Drive, Saturn, Dreamcast)
        else if (id.includes("sega") || id.includes("genesis") || id.includes("saturn") || id.includes("dreamcast")) {
            banReasonKey = "SEGA";
        }
        // 4. NINTENDO 64
        else if (id.includes("n64") || id.includes("nintendo 64")) {
            banReasonKey = "N64";
        }
        // 5. GAMECUBE
        else if (id.includes("gamecube") || id.includes("ngc") || id.includes("wavebird")) {
            banReasonKey = "GAMECUBE";
        }
        // 6. NES / SNES / PS1 DIGITAL (Få knappar, inga eller få axlar)
        else if (id.includes("nes") || id.includes("snes") || id.includes("playstation 1") || id.includes("ps1") || (buttonsCount <= 8 && axesCount <= 2)) {
            if (id.includes("nes")) banReasonKey = "NES";
            else if (id.includes("snes")) banReasonKey = "SNES";
            else banReasonKey = "PS1_DIGITAL";
        }

        if (banReasonKey && typeof window.triggerKamekLock === 'function') {
            window.triggerKamekLock("BANNED_CONTROLLER_" + banReasonKey);
        }
    }

    return {
        poll: function() {
            if (!navigator.getGamepads) return;
            const gps = navigator.getGamepads();
            for (let i = 0; i < gps.length; i++) {
                if (gps[i] && gps[i].connected) {
                    evaluateGamepad(gps[i]);
                }
            }
        },

        reset: function() {
            checkedGamepads.clear();
        }
    };
})();

// Polla handkontroller löpande
setInterval(function() {
    ControllerBanEnforcer.poll();
}, 1000);

    ControllerBanEnforcer.poll();
});

// 🎮 UTÖKAD TILLBEHÖRS- & DOSBANNAR (SKYLANDERS, LEGO, DISNEY, BUZZ M.FL.)
// =========================================================================
const ToyPortalAndDeviceBanEnforcer = (function() {
    let checkedDevices = new Set();

    function evaluateDevice(name, id) {
        const uName = (name || "").toUpperCase();
        const uId = (id || "").toUpperCase();

        let banKey = null;

        // 1. LEKSAKSPORTALER (Skylanders, Lego Dimensions, Disney Infinity)
        if (uName.includes("SKYLANDERS") || uId.includes("1430") || uName.includes("PORTAL OF POWER")) {
            banKey = "SKYLANDERS_PORTAL";
        }
        else if (uName.includes("LEGO DIMENSIONS") || uName.includes("TOY PAD")) {
            banKey = "LEGO_PORTAL";
        }
        else if (uName.includes("DISNEY INFINITY") || uName.includes("BASE")) {
            banKey = "DISNEY_PORTAL";
        }
        // 2. MUSIK- OCH GITARRSPEL (Guitar Hero / DJ Hero / Rock Band)
        else if (uName.includes("GUITAR") || uName.includes("HERO") || uName.includes("DRUM") || uName.includes("TURNTABLE")) {
            banKey = "GUITAR_HERO";
        }
        // 3. DANSMATTA (Om den inte tillåts i det aktuella spelläget)
        else if (uName.includes("DANCE") || uName.includes("MAT") || uName.includes("PAD") && !uName.includes("GAMEPAD")) {
            banKey = "DANCE_MAT";
        }
        // 4. FLYGPILOT & RATTAR (Flight Stick / Racing Wheel)
        else if (uName.includes("WHEEL") || uName.includes("PEDALS") || uName.includes("FLIGHT") || uName.includes("YOKE") || uName.includes("RACING")) {
            banKey = "RACING_WHEEL";
        }

        if (banKey && typeof window.triggerKamekLock === 'function') {
            window.triggerKamekLock("BANNED_TOY_OR_DEVICE_" + banKey);
        }
    }

    return {
        poll: function() {
            // A. Kolla WebHID (Portaler och specialtillbehör)
            if ('hid' in navigator && navigator.hid.getDevices) {
                navigator.hid.getDevices().then(devices => {
                    devices.forEach(d => {
                        const devKey = "hid_" + (d.productId || d.vendorId);
                        if (!checkedDevices.has(devKey)) {
                            checkedDevices.add(devKey);
                            evaluateDevice(d.productName, String(d.productId));
                        }
                    });
                }).catch(() => {});
            }

            // B. Kolla Gamepads (Musikinstrument, rattar, specialdosor)
            if (navigator.getGamepads) {
                const gps = navigator.getGamepads();
                for (let i = 0; i < gps.length; i++) {
                    let gp = gps[i];
                    if (gp && gp.connected) {
                        if (!checkedDevices.has("gp_" + gp.index)) {
                            checkedDevices.add("gp_" + gp.index);
                            evaluateDevice(gp.id, gp.id);
                        }
                    }
                }
            }
        },

        reset: function() {
            checkedDevices.clear();
        }
    };
})();

    ToyPortalAndDeviceBanEnforcer.poll();

// 🔋 SENSOR: TRÅDLÖSA DOSOR, 2.4GHZ/BLUETOOTH & BATTERIVARNING
// =========================================================================
var WirelessControllerBatterySensor = (function() {
    var lowBatteryWarned = false;
    var wirelessDetectedWarned = false;
    var currentBatteryLevel = 1.0; // 0.0 till 1.0
    var isWireless = false;
    var isLowBattery = false;

    // 1. Kontrollera systemets batteri (laptops / trådlösa klienter)
    if (navigator.getBattery) {
        navigator.getBattery().then(function(battery) {
            function updateSysBattery() {
                if (!battery.charging && battery.level <= 0.15) {
                    isLowBattery = true;
                    currentBatteryLevel = battery.level;
                }
            }
            battery.addEventListener('levelchange', updateSysBattery);
            battery.addEventListener('chargingchange', updateSysBattery);
            updateSysBattery();
        }).catch(function() {});
    }

    // 2. Pollning av anslutna handkontroller (Bluetooth / 2.4GHz)
    function pollGamepads() {
        if (!navigator.getGamepads) return;
        var gps = navigator.getGamepads();
        
        for (var i = 0; i < gps.length; i++) {
            var gp = gps[i];
            if (!gp) continue;

            var idLower = (gp.id || "").toLowerCase();
            
            // Detektera trådlösa anslutningar via ID
            if (idLower.indexOf("bluetooth") !== -1 || 
                idLower.indexOf("wireless") !== -1 || 
                idLower.indexOf("2.4g") !== -1 || 
                idLower.indexOf("dongle") !== -1) {
                isWireless = true;
            }

            // Läs av gamepad-batteri om webbläsaren/dosan stödjer det
            // @ts-ignore
            if (gp.battery) {
                // @ts-ignore
                var b = gp.battery;
                currentBatteryLevel = b.level;
                if (!b.charging && b.level <= 0.20) {
                    isLowBattery = true;
                }
            }
        }

        // Varning i spelet vid lågt batteri (< 20%)
        if (isLowBattery && !lowBatteryWarned) {
            lowBatteryWarned = true;
            if (typeof addFloatingText === 'function') {
                addFloatingText("🪫 VARNING: TRÅDLÖS DOSA HAR LÅGT BATTERI!", 320, 200, "#ff1744", 20);
            }
            try {
                var snd = new Audio('windows_error.mp3');
                snd.volume = 0.8;
                snd.play().catch(function() {});
            } catch (e) {}
        }
    }

    setInterval(pollGamepads, 1000);

    return {
        // Ritar ut det blinkande röda batteriet på canvas
        renderHUD: function(ctx, canvasWidth) {
            if (!isLowBattery && !isWireless) return;

            var now = Date.now();
            var blink = Math.floor(now / 400) % 2 === 0;

            var posX = canvasWidth - 140;
            var posY = 15;

            ctx.save();

            // Om batteriet är kritiskt lågt (< 20%): Rita blinkande röd batteri-ikon
            if (isLowBattery) {
                if (blink) {
                    // Batteriram
                    ctx.strokeStyle = "#ff1744";
                    ctx.lineWidth = 2;
                    ctx.strokeRect(posX, posY, 36, 18);
                    
                    // Batteripol
                    ctx.fillStyle = "#ff1744";
                    ctx.fillRect(posX + 36, posY + 4, 3, 10);

                    // Röd fyllnadsnivå
                    var fillW = Math.max(4, Math.floor(32 * currentBatteryLevel));
                    ctx.fillStyle = "#ff1744";
                    ctx.fillRect(posX + 2, posY + 2, fillW, 14);

                    // Text
                    ctx.font = "bold 11px 'Trebuchet MS', sans-serif";
                    ctx.fillStyle = "#ff1744";
                    ctx.fillText("🪫 LÅGT BATTERI (" + Math.round(currentBatteryLevel * 100) + "%)", posX - 100, posY + 13);
                }
            } 
            // Om dosan bara är trådlös med bra batteri: Diskret gul trådlös ikon
            else if (isWireless) {
                ctx.font = "bold 11px 'Trebuchet MS', sans-serif";
                ctx.fillStyle = "#ffd600";
                ctx.fillText("📶 TRÅDLÖS DOSA (2.4G/BT)", posX - 50, posY + 13);
            }

            ctx.restore();
        },

        triggerDeadBatteryLock: function() {
            if (typeof window.triggerKamekLock === 'function') {
                window.triggerKamekLock("DEAD_CONTROLLER_BATTERY");
            }
        }
    };
})();

// 🎮 GAMEPAD-MOTOR: ANPASSAD FÖR POWERA SWITCH & NINTENDO KONTROLLER
// =========================================================================
window.GamepadControllerSystem = (function() {
    var isGamepadActive = false;
    var lastButtonState = {};
    var deadzone = 0.15;

    window.addEventListener("gamepadconnected", function(e) {
        isGamepadActive = true;
        if (typeof addFloatingText === 'function') {
            addFloatingText("🎮 POWERA SWITCH-DOSA ANSLUTEN!", 320, 220, "#00ffcc", 18);
        }
    });

    window.addEventListener("gamepaddisconnected", function(e) {
        isGamepadActive = false;
        if (typeof addFloatingText === 'function') {
            addFloatingText("🔌 DOSA FRÅNKOPPLAD!", 320, 220, "#ff1744", 18);
        }
    });

    return {
        isActive: function() {
            return isGamepadActive;
        },

        update: function() {
            if (!navigator.getGamepads) return;
            var gamepads = navigator.getGamepads();
            var gp = null;

            for (var i = 0; i < gamepads.length; i++) {
                if (gamepads[i] && gamepads[i].connected) {
                    gp = gamepads[i];
                    break;
                }
            }

            if (!gp) {
                isGamepadActive = false;
                return;
            }

            isGamepadActive = true;

            // Kontrollera om en runda pågår
            if (typeof isGameCurrentlyRunning === 'function' && !isGameCurrentlyRunning()) {
                return;
            }

            var canvas = document.getElementById('gameCanvas');
            var cW = canvas ? canvas.width : 640;
            var cH = canvas ? canvas.height : 480;

            // -------------------------------------------------------------
            // 🕹️ 1. SIKTA: VÄNSTER SPAK, HÖGER SPAK & D-PAD
            // -------------------------------------------------------------
            var moveX = 0;
            var moveY = 0;

            var ax0 = gp.axes[0] || 0;
            var ax1 = gp.axes[1] || 0;
            var ax2 = gp.axes[2] || 0;
            var ax3 = gp.axes[3] || 0;

            // Vänster spak
            if (Math.abs(ax0) > deadzone) moveX += ax0;
            if (Math.abs(ax1) > deadzone) moveY += ax1;

            // Höger spak (på PowerA Switch ligger den ofta på axel 2 & 3 eller 2 & 5)
            if (gp.axes.length >= 4) {
                if (Math.abs(ax2) > deadzone) moveX += ax2;
                if (Math.abs(ax3) > deadzone) moveY += ax3;
            }

            // D-Pad / Styrkors
            if (gp.buttons[14] && gp.buttons[14].pressed) moveX -= 1.0;
            if (gp.buttons[15] && gp.buttons[15].pressed) moveX += 1.0;
            if (gp.buttons[12] && gp.buttons[12].pressed) moveY -= 1.0;
            if (gp.buttons[13] && gp.buttons[13].pressed) moveY += 1.0;

            if (Math.abs(moveX) > 0.05 || Math.abs(moveY) > 0.05) {
                var speed = 10.0;
                if (typeof aimX !== 'undefined') {
                    aimX = Math.max(10, Math.min(cW - 10, aimX + (moveX * speed)));
                    shotX = aimX;
                }
                if (typeof aimY !== 'undefined') {
                    aimY = Math.max(10, Math.min(cH - 10, aimY + (moveY * speed)));
                    shotY = aimY;
                }
            }

            // -------------------------------------------------------------
            // 💥 2. SKJUTA (ZR / R / A / B PÅ NINTENDO SWITCH-LAYOUT)
            // PowerA Switch mappar ZR till knapp 7 eller 5, och A/B till 0/1
            // -------------------------------------------------------------
            var btnZR = Boolean(gp.buttons[7] && (gp.buttons[7].pressed || gp.buttons[7].value > 0.3));
            var btnR  = Boolean(gp.buttons[5] && gp.buttons[5].pressed);
            var btnA  = Boolean(gp.buttons[1] && gp.buttons[1].pressed); // Switch A-knapp (höger)
            var btnB  = Boolean(gp.buttons[0] && gp.buttons[0].pressed); // Switch B-knapp (botten)

            var isShooting = btnZR || btnR || btnA || btnB;

            if (isShooting && !lastButtonState.shoot) {
                if (typeof AdvancedAntiCheatSensors !== 'undefined' && AdvancedAntiCheatSensors.registerShot) {
                    AdvancedAntiCheatSensors.registerShot();
                }

                var targetX = (typeof aimX !== 'undefined') ? aimX : 320;
                var targetY = (typeof aimY !== 'undefined') ? aimY : 240;

                // Anropa spelets skjutmotor direkt
                if (typeof fireWeapon === 'function') {
                    fireWeapon(targetX, targetY);
                } else if (typeof shootWeapon === 'function') {
                    shootWeapon(targetX, targetY);
                }
            }
            lastButtonState.shoot = isShooting;

            // -------------------------------------------------------------
            // 🔄 3. LADDA OM: Y-knapp (Knapp 3), X-knapp (Knapp 2), ZL (Knapp 6) eller L (Knapp 4)
            // -------------------------------------------------------------
            var btnZL = Boolean(gp.buttons[6] && (gp.buttons[6].pressed || gp.buttons[6].value > 0.3));
            var btnL  = Boolean(gp.buttons[4] && gp.buttons[4].pressed);
            var btnX  = Boolean(gp.buttons[3] && gp.buttons[3].pressed); // Switch X (topp)
            var btnY  = Boolean(gp.buttons[2] && gp.buttons[2].pressed); // Switch Y (vänster)

            var isReloading = btnZL || btnL || btnX || btnY;

            if (isReloading && !lastButtonState.reload) {
                if (typeof reloadWeapon === 'function') {
                    reloadWeapon();
                }
            }
            lastButtonState.reload = isReloading;

            // -------------------------------------------------------------
            // ⏸️ 4. PAUS: + / PLUS-KNAPPEN (Knapp 9 eller 8)
            // -------------------------------------------------------------
            var btnPlus = Boolean((gp.buttons[9] && gp.buttons[9].pressed) || (gp.buttons[8] && gp.buttons[8].pressed));
            if (btnPlus && !lastButtonState.plus) {
                var curMode = (typeof GAME_MODES !== 'undefined' && GAME_MODES[currentGameModeIdx]) ? GAME_MODES[currentGameModeIdx] : {};
                if (curMode.isTournamentMode || (typeof isTournamentMode !== 'undefined' && isTournamentMode)) {
                    if (typeof AdvancedAntiCheatSensors !== 'undefined') {
                        AdvancedAntiCheatSensors.handleTournamentPauseAttempt();
                    }
                } else {
                    if (typeof isPaused !== 'undefined') isPaused = !isPaused;
                }
            }
            lastButtonState.plus = btnPlus;

            // -------------------------------------------------------------
            // 🚨 5. NÖDSTOPP: Höger Spaktryck (R3 / Knapp 11) eller Capture-knapp (Knapp 16/17)
            // -------------------------------------------------------------
            var btnStickClick = Boolean((gp.buttons[11] && gp.buttons[11].pressed) || (gp.buttons[16] && gp.buttons[16].pressed));
            if (btnStickClick && !lastButtonState.stickClick) {
                if (typeof triggerEmergencyStop === 'function') {
                    triggerEmergencyStop("POWERA_STICK_CLICK");
                }
            }
            lastButtonState.stickClick = btnStickClick;
        },

        renderHUD: function(ctx, canvasHeight) {
            if (!isGamepadActive) return;

            var posX = 15;
            var posY = canvasHeight - 16;

            ctx.save();
            ctx.fillStyle = "rgba(10, 5, 20, 0.85)";
            ctx.strokeStyle = "#e60012"; // Switch-röd ram
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            if (ctx.roundRect) {
                ctx.roundRect(posX - 5, posY - 18, 140, 24, 6);
            } else {
                ctx.rect(posX - 5, posY - 18, 140, 24);
            }
            ctx.fill();
            ctx.stroke();

            ctx.font = "bold 11px 'Trebuchet MS', sans-serif";
            ctx.fillStyle = "#ffffff";
            ctx.fillText("🎮 SWITCH-DOSA [ZR]", posX + 3, posY - 2);
            ctx.restore();
        }
    };
})();

// 🛠️ INSTÄLLNINGSMENY-MOTOR (GRAFIK, SIKTES-PREVIEW & NAVIGATION)
// =========================================================================
const SettingsMenuEngine = (function() {
    let currentRow = 0;
    const ROWS = [
        "SFX_VOL",
        "MUSIC_VOL",
        "CONTROLS",
        "RETICLE",
        "WEAPON",
        "DIFFICULTY",
        "BACK_BTN"
    ];

    return {
        handleInput: function(e) {
            // Navigera UPP / NED
            if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') {
                currentRow = (currentRow - 1 + ROWS.length) % ROWS.length;
                if (typeof SoundFX !== 'undefined' && SoundFX.step) SoundFX.step();
                return;
            }
            if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') {
                currentRow = (currentRow + 1) % ROWS.length;
                if (typeof SoundFX !== 'undefined' && SoundFX.step) SoundFX.step();
                return;
            }

            // Justera VÄNSTER / HÖGER
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
                this.adjustSetting(-1);
                return;
            }
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
                this.adjustSetting(1);
                return;
            }

            // Gå tillbaka
            if (e.key === 'Escape' || (currentRow === 6 && (e.key === 'Enter' || e.key === ' '))) {
                currentState = STATES.BOSS_BATTLE;
                if (typeof SoundFX !== 'undefined' && SoundFX.correct) SoundFX.correct();
            }
        },

        adjustSetting: function(dir) {
            const cur = ROWS[currentRow];

            if (cur === "SFX_VOL") {
                gameSettings.volumeSFX = Math.max(0, Math.min(100, gameSettings.volumeSFX + (dir * 10)));
                gameSettings.soundEnabled = gameSettings.volumeSFX > 0;
                if (typeof SoundFX !== 'undefined' && SoundFX.step) SoundFX.step();
            } 
            else if (cur === "MUSIC_VOL") {
                gameSettings.volumeMusic = Math.max(0, Math.min(100, gameSettings.volumeMusic + (dir * 10)));
                gameSettings.musicEnabled = gameSettings.volumeMusic > 0;
                if (typeof ThemeJukebox !== 'undefined' && ThemeJukebox.updateVolume) {
                    ThemeJukebox.updateVolume();
                }
            } 
            else if (cur === "CONTROLS") {
                gameSettings.controlSchemeIdx = (gameSettings.controlSchemeIdx + dir + CONTROL_SCHEMES.length) % CONTROL_SCHEMES.length;
                if (typeof SoundFX !== 'undefined' && SoundFX.step) SoundFX.step();
            } 
            else if (cur === "RETICLE") {
                gameSettings.reticleStyleIdx = (gameSettings.reticleStyleIdx + dir + RETICLE_STYLES.length) % RETICLE_STYLES.length;
                if (typeof SoundFX !== 'undefined' && SoundFX.step) SoundFX.step();
            } 
            else if (cur === "WEAPON") {
    gameSettings.weaponTypeIdx = (gameSettings.weaponTypeIdx + dir + WEAPON_TYPES.length) % WEAPON_TYPES.length;
    var newWep = WEAPON_TYPES[gameSettings.weaponTypeIdx];
    maxAmmo = newWep.maxAmmo;
    ammo = Math.min(ammo, maxAmmo); // Justera nuvarande ammo till maxgränsen
    if (typeof SoundFX !== 'undefined' && SoundFX.step) SoundFX.step();
}
            else if (cur === "DIFFICULTY") {
                if (typeof BOSS_DIFFICULTIES !== 'undefined') {
                    gameSettings.difficultyIdx = (gameSettings.difficultyIdx + dir + BOSS_DIFFICULTIES.length) % BOSS_DIFFICULTIES.length;
                    if (typeof currentBossDiffIdx !== 'undefined') currentBossDiffIdx = gameSettings.difficultyIdx;
                }
                if (typeof SoundFX !== 'undefined' && SoundFX.step) SoundFX.step();
            }
        },

        render: function(ctx, canvas) {
            ctx.save();
            ctx.setTransform(1, 0, 0, 1, 0, 0);

            // 1. Mörk bakgrund
            ctx.fillStyle = "rgba(8, 6, 16, 0.96)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 2. Huvudram
            const boxW = 580;
            const boxH = 430;
            const boxX = (canvas.width - boxW) / 2;
            const boxY = (canvas.height - boxH) / 2;

            ctx.fillStyle = "#100d23";
            ctx.fillRect(boxX, boxY, boxW, boxH);
            ctx.strokeStyle = "#00ffcc";
            ctx.lineWidth = 2.5;
            ctx.strokeRect(boxX, boxY, boxW, boxH);

            // Rubrik
            ctx.textAlign = "center";
            ctx.font = "bold 20px 'Impact', 'Orbitron', sans-serif";
            ctx.fillStyle = "#ffeb3b";
            ctx.fillText("⚙️ SPELINSTÄLLNINGAR & ARSENAL", canvas.width / 2, boxY + 28);

            // Bygg menyraderna
            const curControl = CONTROL_SCHEMES[gameSettings.controlSchemeIdx];
            const curReticle = RETICLE_STYLES[gameSettings.reticleStyleIdx];
            const curWeapon = WEAPON_TYPES[gameSettings.weaponTypeIdx];
            const curDiff = (typeof BOSS_DIFFICULTIES !== 'undefined') ? BOSS_DIFFICULTIES[gameSettings.difficultyIdx] : { name: "NORMAL" };

            const items = [
                { label: "🔊 LJUDVOLYM (SFX)", val: `◄  ${gameSettings.volumeSFX}%  ►` },
                { label: "🎵 MUSIKVOLYM", val: `◄  ${gameSettings.volumeMusic}%  ►` },
                { label: "🎮 STYRSÄTT / KONTROLL", val: `◄  ${curControl.name}  ►` },
                { label: "🎯 SIKTESLAYOUT (8 VAL)", val: `◄  ${curReticle.name}  ►` },
                { label: "🔫 VAPENTYP / SKJUTLÄGE", val: `◄  ${curWeapon.name}  ►` },
                { label: "💀 SVÅRIGHETSGRAD", val: `◄  ${curDiff.name}  ►` },
                { label: "ÅTERGÅ", val: "◀  SPARA & TILLBAKA TILL MATCHEN [ESC]  ▶" }
            ];

            const startY = boxY + 54;
            const rowSpacing = 44;

            items.forEach((item, idx) => {
                const ry = startY + (idx * rowSpacing);
                const isSelected = (currentRow === idx);

                if (isSelected) {
                    ctx.fillStyle = idx === 6 ? "rgba(34, 197, 94, 0.25)" : "rgba(0, 255, 204, 0.15)";
                    ctx.fillRect(boxX + 12, ry - 14, boxW - 24, 38);
                    ctx.strokeStyle = idx === 6 ? "#22c55e" : "#00ffcc";
                    ctx.lineWidth = 1.5;
                    ctx.strokeRect(boxX + 12, ry - 14, boxW - 24, 38);
                }

                ctx.textAlign = "left";
                ctx.font = "bold 11px 'Trebuchet MS', sans-serif";
                ctx.fillStyle = isSelected ? "#00ffcc" : "#94a3b8";
                ctx.fillText(item.label, boxX + 22, ry);

                ctx.textAlign = "right";
                ctx.font = isSelected ? "bold 12px 'Impact', sans-serif" : "bold 11px 'Trebuchet MS', sans-serif";
                ctx.fillStyle = isSelected ? (idx === 6 ? "#22c55e" : "#ffeb3b") : "#ffffff";
                ctx.fillText(item.val, boxX + boxW - 90, ry);
            });

            // 3. LIVE SIKTES-FÖRHANDSGRANSKNING (ÖVRE HÖGRA HÖRNET I MENYN)
            const previewX = boxX + boxW - 50;
            const previewY = startY + (3 * rowSpacing) - 2;

            ctx.fillStyle = "rgba(0, 0, 0, 0.6)";
            ctx.fillRect(previewX - 22, previewY - 22, 44, 44);
            ctx.strokeStyle = "#443366";
            ctx.lineWidth = 1;
            ctx.strokeRect(previewX - 22, previewY - 22, 44, 44);

            SettingsMenuEngine.drawReticle(ctx, previewX, previewY, gameSettings.reticleStyleIdx, "#00ffcc");

            // 4. VAPENFÖRKLARING LÄNGST NER
            ctx.textAlign = "center";
            ctx.font = "italic 11px 'Trebuchet MS', sans-serif";
            ctx.fillStyle = "#38bdf8";
            ctx.fillText(`Info: ${curWeapon.desc} (Magasin: ${curWeapon.maxAmmo} skott)`, canvas.width / 2, boxY + boxH - 34);

            ctx.font = "10px monospace";
            ctx.fillStyle = "#8888aa";
            ctx.fillText("[⬆️/⬇️] Bläddra  |  [⬅️/➡️] Ändra värde  |  [ENTER/ESC] Bekräfta", canvas.width / 2, boxY + boxH - 14);

            ctx.restore();
        },

        // Ritar de 8 olika siktesvarianterna
        drawReticle: function(ctx, x, y, styleIdx, color) {
            ctx.save();
            ctx.strokeStyle = color;
            ctx.fillStyle = color;
            ctx.lineWidth = 2;

            switch(styleIdx) {
                case 0: // 1. KLASSISKT KORS
                    ctx.beginPath();
                    ctx.arc(x, y, 12, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(x - 18, y); ctx.lineTo(x + 18, y);
                    ctx.moveTo(x, y - 18); ctx.lineTo(x, y + 18);
                    ctx.stroke();
                    break;

                case 1: // 2. CIRKEL MED PRICK
                    ctx.beginPath();
                    ctx.arc(x, y, 14, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.arc(x, y, 2.5, 0, Math.PI * 2);
                    ctx.fill();
                    break;

                case 2: // 3. SNIPER-SIKTE
                    ctx.beginPath();
                    ctx.arc(x, y, 16, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(x - 22, y); ctx.lineTo(x - 6, y);
                    ctx.moveTo(x + 6, y); ctx.lineTo(x + 22, y);
                    ctx.moveTo(x, y - 22); ctx.lineTo(x, y - 6);
                    ctx.moveTo(x, y + 6); ctx.lineTo(x, y + 22);
                    ctx.stroke();
                    break;

                case 3: // 4. TAKTISK CHEVRON
                    ctx.beginPath();
                    ctx.moveTo(x, y - 10);
                    ctx.lineTo(x - 8, y + 6);
                    ctx.lineTo(x + 8, y + 6);
                    ctx.closePath();
                    ctx.stroke();
                    ctx.fillRect(x - 1.5, y + 10, 3, 3);
                    break;

                case 4: // 5. HAGELRING
                    ctx.lineWidth = 2.5;
                    ctx.setLineDash([4, 4]);
                    ctx.beginPath();
                    ctx.arc(x, y, 18, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.setLineDash([]);
                    ctx.fillRect(x - 1.5, y - 1.5, 3, 3);
                    break;

                case 5: // 6. CYBER-RUTNÄT
                    ctx.strokeRect(x - 12, y - 12, 24, 24);
                    ctx.fillRect(x - 2, y - 2, 4, 4);
                    ctx.beginPath();
                    ctx.moveTo(x - 16, y); ctx.lineTo(x - 12, y);
                    ctx.moveTo(x + 12, y); ctx.lineTo(x + 16, y);
                    ctx.stroke();
                    break;

                case 6: // 7. ARKAD-KLAMRAR
                    // Vänster klammer
                    ctx.beginPath();
                    ctx.moveTo(x - 8, y - 12); ctx.lineTo(x - 14, y - 12);
                    ctx.lineTo(x - 14, y + 12); ctx.lineTo(x - 8, y + 12);
                    // Höger klammer
                    ctx.moveTo(x + 8, y - 12); ctx.lineTo(x + 14, y - 12);
                    ctx.lineTo(x + 14, y + 12); ctx.lineTo(x + 8, y + 12);
                    ctx.stroke();
                    ctx.fillRect(x - 1.5, y - 1.5, 3, 3);
                    break;

                case 7: // 8. MINIMAL RÖD-PUNKT
                    ctx.beginPath();
                    ctx.arc(x, y, 3.5, 0, Math.PI * 2);
                    ctx.fill();
                    break;
            }
            ctx.restore();
        }
    };
})();

    function applyWitchCurse() {
    const curses = ["JAM", "POISON", "NAUSEA", "REVERSE", "BLIND"];
    const chosen = curses[Math.floor(Math.random() * curses.length)];
    const isKamek = THEMES[currentThemeIdx] && THEMES[currentThemeIdx].id === "BOWSERS_CASTLE";
    const sourceName = isKamek ? "KAMEK" : "HÄXAN";

    if (chosen === "JAM") {
        statusEffects.jammedClicksNeeded = 4; // Klicka höger/ladda 4 ggr för att rensa
        addFloatingText("🛑 VAPNET FASTNADE! KLICKA LÖS DET!", aimX, aimY - 20, "#ff1744", 20);
    } else if (chosen === "POISON") {
        statusEffects.poisonTimer = 240; // Gift tickar skada
        addFloatingText("🧪 FÖRGIFTAD! -HP ÖVER TID!", aimX, aimY - 20, "#22c55e", 20);
    } else if (chosen === "NAUSEA") {
        statusEffects.nauseaTimer = 200; // Skärmen vobblar
        addFloatingText("🌀 ILLAMÅENDE! SKÄRMEN VOBBLAR!", aimX, aimY - 20, "#a855f7", 20);
    } else if (chosen === "REVERSE") {
        statusEffects.reverseAimTimer = 180; // Inverterat sikte
        addFloatingText("🔄 FÖRVIRRING! INVERTERAT SIKTE!", aimX, aimY - 20, "#f97316", 20);
    } else if (chosen === "BLIND") {
        statusEffects.blindTimer = 150; // Mörker i 2.5 sekunder
        addFloatingText("🌑 BLÄNDAD AV HÄXAN!", aimX, aimY - 20, "#64748b", 20);
    }

    if (typeof SoundFX !== 'undefined' && SoundFX.wrong) SoundFX.wrong();
}

    function calculateRank(finalScore, accuracy) {
        if (finalScore >= 3500 && accuracy >= 80) return "S";
        if (finalScore >= 2400 && accuracy >= 65) return "A";
        if (finalScore >= 1400 && accuracy >= 45) return "B";
        if (finalScore >= 600) return "C";
        return "D";
    }

    // --- 💾 LOCALSTORAGE HIGH SCORE MOTOR ---
    function getThemeLeaderboard(themeId) {
        try {
            const raw = localStorage.getItem(`shooting_gallery_hs_${themeId}`);
            return raw ? JSON.parse(raw) : [];
        } catch (e) {
            return [];
        }
    }

    function saveThemeScore(themeId, newScore, accuracy) {
        try {
            let list = getThemeLeaderboard(themeId);
            list.push({
                score: newScore,
                accuracy: accuracy,
                date: new Date().toLocaleDateString()
            });
            list.sort((a, b) => {
                if (b.score !== a.score) return b.score - a.score;
                return b.accuracy - a.accuracy; // Tiebreaker
            });
            list = list.slice(0, 5); // Topp 5
            localStorage.setItem(`shooting_gallery_hs_${themeId}`, JSON.stringify(list));
        } catch (e) {}
    }

// 📖 SPELINSTRUKTIONER, KONTROLLER & BANBRIEFING FÖR SKJUTSPELET
// =========================================================================
let showShooterHelpModal = false;
let helpModalTab = "CONTROLS"; // "CONTROLS", "POWERUPS", "THEMES", "WARNINGS"

function openShooterInstructions() {
    showShooterHelpModal = true;
    if (typeof SoundFX !== 'undefined' && SoundFX.correct) SoundFX.correct();
}

function closeShooterInstructions() {
    showShooterHelpModal = false;
    if (typeof SoundFX !== 'undefined' && SoundFX.step) SoundFX.step();
}

function renderShooterInstructionsOverlay(ctx, canvas) {
    if (!showShooterHelpModal) return;

    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);

    // Mörk halvtransparent bakgrund
    ctx.fillStyle = "rgba(4, 2, 10, 0.97)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    const boxW = Math.min(620, canvas.width - 20);
    const boxH = Math.min(440, canvas.height - 20);
    const boxX = (canvas.width - boxW) / 2;
    const boxY = (canvas.height - boxH) / 2;

    // Huvudram
    ctx.fillStyle = "#0c0a1a";
    ctx.fillRect(boxX, boxY, boxW, boxH);
    ctx.strokeStyle = "#00ffcc";
    ctx.lineWidth = 3;
    ctx.strokeRect(boxX, boxY, boxW, boxH);

    // Rubrik och stängknapp
    ctx.textAlign = "left";
    ctx.fillStyle = "#ffeb3b";
    ctx.font = "bold 18px 'Impact', 'Orbitron', sans-serif";
    ctx.fillText("📖 SPELINSTRUKTIONER & SENSORISK BRIEFING", boxX + 16, boxY + 28);

    ctx.textAlign = "right";
    ctx.fillStyle = "#ff1744";
    ctx.font = "bold 13px 'Impact', monospace";
    ctx.fillText("[ESC / H / KLICK: STÄNG]", boxX + boxW - 16, boxY + 28);

    // Flik-knappar (6 st)
    const tabs = [
        { id: "HOW_TO_PLAY", name: "🎯 MÅL & REGLER" },
        { id: "SENSORY",     name: "👁️ SENSORISKT" },
        { id: "CONTROLS",    name: "🎮 KONTROLLER" },
        { id: "POWERUPS",    name: "⭐ POWER-UPS" },
        { id: "THEMES",      name: "🗺️ BANOR & HOT" },
        { id: "WARNINGS",    name: "⚠️ REGLER" }
    ];

    const tabW = (boxW - 32) / tabs.length;
    tabs.forEach((tab, i) => {
        const tx = boxX + 16 + (i * tabW);
        const ty = boxY + 42;
        const isActiveTab = (helpModalTab === tab.id);

        ctx.fillStyle = isActiveTab ? "#00ffcc" : "#1e1b38";
        ctx.fillRect(tx, ty, tabW - 3, 24);
        ctx.strokeStyle = isActiveTab ? "#ffffff" : "#443e68";
        ctx.lineWidth = 1;
        ctx.strokeRect(tx, ty, tabW - 3, 24);

        ctx.textAlign = "center";
        ctx.fillStyle = isActiveTab ? "#000000" : "#ffffff";
        ctx.font = "bold 10px 'Trebuchet MS', sans-serif";
        ctx.fillText(tab.name, tx + (tabW - 3) / 2, ty + 16);
    });

    // Innehållsarea
    const contentY = boxY + 80;
    ctx.textAlign = "left";

    // ---------------------------------------------------------------------
    // FLIK 1: SÅ GÅR SPELET TILL
    // ---------------------------------------------------------------------
    if (helpModalTab === "HOW_TO_PLAY") {
        ctx.fillStyle = "#ffeb3b";
        ctx.font = "bold 13px 'Trebuchet MS', sans-serif";
        ctx.fillText("🎯 SÅ GÅR SPELET TILL (SPELIDÉ & SLUTVILLKOR):", boxX + 20, contentY);

        ctx.fillStyle = "#ffffff";

function spawnThemeBoss() {
    const currentTheme = THEMES[currentThemeIdx];
    const themeKey = currentTheme ? currentTheme.id : "WESTERN";
    const cfg = THEME_BOSS_CONFIGS[themeKey];

    if (!cfg) return;

    const clonedWeakPoints = (cfg.weakPoints || []).map(wp => ({
        ...wp,
        destroyed: false,
        hp: wp.maxHp
    }));

    activeBoss = {
        name: cfg.name,
        isBigBoss: cfg.isBigBoss,
        x: canvas.width / 2,
        y: cfg.isBigBoss ? 130 : 160,
        vx: cfg.isBigBoss ? 1.5 : 2.5,
        hp: cfg.maxHp,
        maxHp: cfg.maxHp,
        width: cfg.width,
        height: cfg.height,
        emoji: cfg.emoji,
        points: cfg.points,
        weakPoints: clonedWeakPoints,
        hitFlashTimer: 0
    };

    if (typeof ArcadeAlertSystem !== 'undefined') {
        ArcadeAlertSystem.show({
            type: "CRITICAL",
            title: `⚠️ ${cfg.name} ANFALLER!`,
            message: cfg.weakPoints.length > 0 ? "Skjut på de sårbara delarna!" : "Töm magasinet i bossen!",
            duration: 180
        });
    }
}

    // --- SKJUTLOGIK ---
    function addFloatingText(text, x, y, color = "#ffeb3b", fontSize = 16) {
    floatingTexts.push({

    // --- GEMENSAM GAME OVER-FUNKTION ---
    function triggerGameOverSequence(cause) {
        if (gameOverSequence.active || isGameOver) return;
    gameOverCause = cause;

    gameOverSequence.active = true;
    gameOverSequence.cause = cause;
    gameOverSequence.timer = 0;
    gameOverSequence.soundFinished = false;
    gameOverSequence.marioAudioPlayed = false;
    gameOverSequence.fadeInAlpha = 0.0;

    if (typeof ThemeJukebox !== 'undefined') {
        ThemeJukebox.stop();
    }

    // Funktion som anropas när primära ljudeffekten tystnat
    function onInitialSoundEnded() {
        gameOverSequence.soundFinished = true;
        
        // 🎵 Spela upp Mario Death Sound
        if (!gameOverSequence.marioAudioPlayed) {
            gameOverSequence.marioAudioPlayed = true;
            try {
                const marioDeath = new Audio('mk64_loser.wav');
                marioDeath.volume = (typeof gameSettings !== 'undefined' && gameSettings.volumeSFX !== undefined) 
                    ? (gameSettings.volumeSFX / 100) : 0.8;
                marioDeath.play().catch(() => {});
            } catch (e) {}
        }
    }

    // ⏰ Ljudeffekt vid timeout
    if (cause === "TIME_OUT") {
        try {
            const audio = new Audio('alarm.mp3');
            audio.volume = 0.8;
            audio.play().catch(() => {setTimeout(onInitialSoundEnded, 1500);});
            audio.onended = onInitialSoundEnded;
            gameOverCause = "TIME_OUT";
        } catch (e) {}
    } else if (cause === "NUKE") {
        const audio = new Audio('explosion_big.mp3');
            audio.volume = 0.8;
            audio.play().catch(() => {setTimeout(onInitialSoundEnded, 1500);});
            audio.onended = onInitialSoundEnded;
            gameOverCause = "NUKE";
    } else if (cause === "ENEMY_KILL" || cause === "TEN_MISSES") {
        const audio = new Audio('death.wav');
            audio.volume = 0.8;
            audio.play().catch(() => {setTimeout(onInitialSoundEnded, 1500);});
            audio.onended = onInitialSoundEnded;
            if (isTenMissesDeath) {
                gameOverCause = "TEN_MISSES"; } 
                else {
                    gameOverCause = "ENEMY_KILL"; 
                }
    }

    setTimeout(onInitialSoundEnded, 1500);
}

// =========================================================================
// 🎯 KOMPLETT TRÄFFREGISTRERING: BOSSAR, POWER-UPS, NUKE, PANSRAR & FIENDER
// =========================================================================
function checkTargetHit(tx, ty, wepDmg) {
    let dmg = (typeof wepDmg === 'number' && wepDmg > 0) ? wepDmg : 1;
    // 🪓 1. INKOMMANDE PROJEKTILER / YXOR / SKOTT
    if (typeof enemyProjectiles !== 'undefined' && Array.isArray(enemyProjectiles)) {
        for (let i = enemyProjectiles.length - 1; i >= 0; i--) {
            let p = enemyProjectiles[i];
            if (!p) continue;
            let dist = Math.hypot(tx - p.x, ty - p.y);
            let projRadius = p.radius || 20;

            if (dist <= projRadius) {
                enemyProjectiles.splice(i, 1);
                score += 150;
                if (typeof addFloatingText === 'function') {
                    addFloatingText("💥 DEFLECTED! +150P", p.x, p.y, "#00ffcc", 16);
                }
                try {
                    let hitAudio = new Audio('click.mp3');
                    hitAudio.volume = 0.5;
                    hitAudio.play().catch(function() {});
                } catch (e) {}
                return true;
            }
        }
    }

    // 🤖 2. HUVUDBOSS (OM ETT DEDIKERAT BOSS-OBJEKT ANVÄNDS)
    if (typeof boss !== 'undefined' && boss && boss.alive && boss.hp > 0) {
        let bossRadius = boss.radius || (boss.size ? boss.size / 2 : 45);
        let distToBoss = Math.hypot(tx - boss.x, ty - boss.y);

        if (distToBoss <= bossRadius) {
            boss.hitFlashTimer = 8;
            boss.hp -= (10 * dmg); // Ex. Sniper (3x skada) gör 30 skada istället för 10

            if (boss.hp > 0) {
                if (typeof addFloatingText === 'function') {
                    addFloatingText(`💥 BOSS TRÄFF! (${boss.hp}/${boss.maxHp || 100})`, boss.x, boss.y - 30, "#ffeb3b", 18);
                }
                try {
                    let bossHitAudio = new Audio('step.wav');
                    bossHitAudio.volume = 0.6;
                    bossHitAudio.play().catch(function() {});
                } catch (e) {}

                // Gnistor vid bossträff
                if (typeof floatingParticles !== 'undefined' && Array.isArray(floatingParticles)) {
                    for (let k = 0; k < 8; k++) {
                        floatingParticles.push({
                            x: boss.x,
                            y: boss.y,
                            vx: (Math.random() - 0.5) * 8,
                            vy: (Math.random() - 0.5) * 8,
                            life: 25,
                            color: "#ff9800"
                        });
                    }
                }
            } else {
                // 💀 Bossen besegrad!
                boss.hp = 0;
                boss.alive = false;
                let bossKillPts = 2500;
                score += bossKillPts;

                if (typeof addFloatingText === 'function') {
                    addFloatingText(`👑 BOSS DEFEATED! +${bossKillPts}P`, boss.x, boss.y - 35, "#00ffcc", 24);
                }
                try {
                    let bossDieAudio = new Audio('pling.mp3');
                    bossDieAudio.volume = 0.8;
                    bossDieAudio.play().catch(function() {});
                } catch (e) {}
            }
            return true; // 👈 Registreras som träff
        }
    }

    // 🎯 3. MÅLTAVLOR / POWER-UPS / NUKES / PANSRADE ELITER / IN-ARRAY BOSSAR
    if (typeof targets !== 'undefined' && Array.isArray(targets)) {
        for (let i = targets.length - 1; i >= 0; i--) {
            let targetObj = targets[i];
            if (!targetObj || targetObj.destroyed || (targetObj.hp !== undefined && targetObj.hp <= 0)) {
                continue;
            }

            let dist = Math.hypot(tx - targetObj.x, ty - targetObj.y);
            let targetRadius = targetObj.radius || (targetObj.w ? targetObj.w / 2 : 25);

            if (dist <= targetRadius) {
                targetObj.hitFlashTimer = 8;

                // =========================================================
                // 🤖 A. BOSS-MÅL INUTI TARGETS-ARRAYEN
                // =========================================================
                if (targetObj.isBoss || targetObj.type === "BOSS" || targetObj.type === "MECHA_GORAN") {
                    targetObj.hp -= ((targetObj.damagePerShot || 1) * dmg);

                    if (targetObj.hp > 0) {
                        if (typeof addFloatingText === 'function') {
                            addFloatingText(`💥 BOSS: ${targetObj.hp}/${targetObj.maxHp} HP`, targetObj.x, targetObj.y - 25, "#ffeb3b", 18);
                        }
                        try {
                            let bHit = new Audio('step.wav');
                            bHit.volume = 0.5;
                            bHit.play().catch(function() {});
                        } catch (e) {}

                        if (typeof floatingParticles !== 'undefined' && Array.isArray(floatingParticles)) {
                            for (let k = 0; k < 6; k++) {
                                floatingParticles.push({
                                    x: targetObj.x,
                                    y: targetObj.y,
                                    vx: (Math.random() - 0.5) * 7,
                                    vy: (Math.random() - 0.5) * 7,
                                    life: 25,
                                    color: "#ff1744"
                                });
                            }
                        }
                    } else {
                        targetObj.destroyed = true;
                        targetObj.hp = 0;
                        targetObj.isAiming = false;
                        let bPts = targetObj.pts || 3000;
                        score += bPts;

                        if (typeof addFloatingText === 'function') {
                            addFloatingText(`👑 BOSS ELIMINERAD! +${bPts}P`, targetObj.x, targetObj.y - 30, "#00ffcc", 24);
                        }
                        try {
                            let bDead = new Audio('pling.mp3');
                            bDead.volume = 0.8;
                            bDead.play().catch(function() {});
                        } catch (e) {}
                    }
                    return true;
                }

                // =========================================================
                // ☢️ B. NUKE-MINA (SKJUT EJ! HALVERAR POÄNG & SKADAR SPELAREN)
                // =========================================================
                if (targetObj.type === "NUKE_MINE" || targetObj.type === "NUKE" || targetObj.isNuke) {
                    targetObj.destroyed = true;
                    targetObj.hp = 0;

                    score = Math.floor(score / 2);
                    playerHealth = Math.max(0, playerHealth - 1);
                    damageFlashTimer = 35;
                    nukeFlashTimer = 30;

                    if (typeof addFloatingText === 'function') {
                        addFloatingText("☢️ NUKE DETONATION! -50% POÄNG & -1 LIV!", targetObj.x, targetObj.y - 25, "#ff1744", 18);
                    }

                    try {
                        let boomAudio = new Audio('explosion.mp3');
                        boomAudio.volume = 0.9;
                        boomAudio.play().catch(function() {});
                    } catch (e) {}

                    if (playerHealth <= 0) {
                        triggerGameOverSequence("NUKE_SELF_DESTRUCT");
                    }
                    return true;
                }

                // =========================================================
                // 🎁 C. POWER-UPS OCH BONUSFÖREMÅL
                // =========================================================
                if (targetObj.isPowerUp || targetObj.type === "EXTRA_LIFE" || targetObj.type === "TIME_CLOCK" || 
                    targetObj.type === "DOUBLE_POINTS" || targetObj.type === "STAR_INVICIBLE" || 
                    targetObj.type === "POWERUP" || targetObj.type === "AMMO_CRATE") {

                    targetObj.destroyed = true;
                    targetObj.hp = 0;

                    if (targetObj.type === "EXTRA_LIFE" || targetObj.type === "HEALTH" || targetObj.type === "LIFE") {
                        playerHealth = Math.min(MAX_PLAYER_HEALTH || 5, playerHealth + 1);
                        if (typeof addFloatingText === 'function') {
                            addFloatingText("❤️ +1 LIV!", targetObj.x, targetObj.y - 20, "#ff1744", 20);
                        }
                    } else if (targetObj.type === "TIME_CLOCK" || targetObj.type === "TIME" || targetObj.type === "CLOCK") {
                        roundTimer += 300;
                        if (typeof addFloatingText === 'function') {
                            addFloatingText("⏱️ +5 SEKUNDER!", targetObj.x, targetObj.y - 20, "#00ffcc", 20);
                        }
                    } else if (targetObj.type === "DOUBLE_POINTS" || targetObj.type === "2X") {
                        doublePointsTimer = 360;
                        if (typeof addFloatingText === 'function') {
                            addFloatingText("✖️2 DUBBLA POÄNG AKTIVERAT!", targetObj.x, targetObj.y - 20, "#ff00ff", 20);
                        }
                    } else if (targetObj.type === "STAR_INVICIBLE" || targetObj.type === "STAR" || targetObj.type === "INVINCIBLE") {
                        invulnerableTimer = 360;
                        if (typeof addFloatingText === 'function') {
                            addFloatingText("⭐ ODÖDLIGHET AKTIVERAD!", targetObj.x, targetObj.y - 20, "#ffeb3b", 20);
                        }
                    } else {
                        ammo = maxAmmo;
                        score += targetObj.pts || 200;
                        if (typeof addFloatingText === 'function') {
                            addFloatingText("⚡ FULL AMMO & BONUS!", targetObj.x, targetObj.y - 20, "#00ffcc", 18);
                        }
                    }

                    try {
                        let puAudio = new Audio('pling.mp3');
                        puAudio.volume = 0.7;
                        puAudio.play().catch(function() {});
                    } catch (e) {}

                    return true;
                }

                // =========================================================
                // 🛑 D. PANSRAD FIENDE TAR DELSKADA (FLER ÄN 1 HP KVAR)
                // =========================================================
                if (targetObj.hp === undefined) targetObj.hp = 1;
                if (targetObj.maxHp === undefined) targetObj.maxHp = 1;

                if (targetObj.hp > 1) {
                    targetObj.hp -= dmg;
    if (targetObj.hp <= 0) {
        // Om skadan sänkte fienden direkt (t.ex. Sniper mot 3 HP fiende), markera död

    }
                    if (typeof addFloatingText === 'function') {
                        addFloatingText(`💥 TRÄFF! (${targetObj.hp}/${targetObj.maxHp})`, targetObj.x, targetObj.y - 20, "#ffeb3b", 15);

                    if (typeof floatingParticles !== 'undefined' && Array.isArray(floatingParticles)) {

    // Funktion för att avfyra ett enskilt skott/pellet
    function dischargeShot() {
        if (ammo <= 0) return;
        ammo--;
        shotsFired++;
        lightgunFlashFrames = (curWep.id === "SHOTGUN" || curWep.id === "SNIPER") ? 4 : 2;

            gunshotAudio.volume = curWep.id === "SNIPER" ? 1.0 : 0.75;
            gunshotAudio.play().catch(function() {});

        var anyPelletHit = false;

        // Skjut alla hagel/kulor med vapnets spridning
        for (var p = 0; p < curWep.pellets; p++) {
            var offsetX = (Math.random() - 0.5) * curWep.spread;
            var offsetY = (Math.random() - 0.5) * curWep.spread;
            
            var hit = checkTargetHit(targetX + offsetX, targetY + offsetY, curWep.damage);
            if (hit) anyPelletHit = true;
        }

        if (anyPelletHit) {
            shotsHit++;
            streak++;
            consecutiveMisses = 0;

            if (typeof HOTD_RANKS !== 'undefined') {
                for (var r = HOTD_RANKS.length - 1; r >= 0; r--) {
                    if (streak >= HOTD_RANKS[r].streak) {
                        hotdRankIdx = r;
                        break;
                    }
                }
            }
        } else {
            registerShotMiss();
        }
    }

    // ⚡ BURST_RIFLE: Skjuter en 3-skotts salva med 70 ms mellanrum
    if (curWep.id === "BURST_RIFLE") {
        dischargeShot();
        setTimeout(function() { if (ammo > 0) dischargeShot(); }, 70);
        setTimeout(function() { if (ammo > 0) dischargeShot(); }, 140);
    } else {
        // Enkelskott (Pistol, Shotgun, Sniper, Minigun)
        dischargeShot();

}

function registerShotMiss() {

}


    function checkBossHit(shotX, shotY) {
    if (!activeBoss || activeBoss.hp <= 0) return false;

    // A. Boss med svagpunkter (Draken, Colossus, Kraken)
    if (activeBoss.weakPoints && activeBoss.weakPoints.length > 0) {
        const outerDead = activeBoss.weakPoints
            .filter(wp => !wp.lockedUntilWingsDead)
            .every(wp => wp.destroyed);

        for (let wp of activeBoss.weakPoints) {
            if (wp.destroyed) continue;

            // Om kärnan är låst tills vingarna/delarna är borta
            const isLocked = wp.lockedUntilWingsDead && !outerDead;

            const wx = activeBoss.x + wp.relX;
            const wy = activeBoss.y + wp.relY;
            const dist = Math.hypot(shotX - wx, shotY - wy);

            // Generös träffradie (radius + 8px)
            if (dist <= wp.radius + 8) {
                if (isLocked) {
                    // Träff på låst kärna studsar
                    if (typeof SoundFX !== 'undefined' && SoundFX.wrong) SoundFX.wrong();//[cite: 2, 3]
                    return true;
                }

                wp.hp -= 30;
                activeBoss.hp -= 30;
                activeBoss.hitFlashTimer = 8;

                if (wp.hp <= 0) {
                    wp.destroyed = true;
                    if (typeof SoundFX !== 'undefined' && SoundFX.heavyCrash) SoundFX.heavyCrash();//[cite: 2, 3]
                } else {
                    if (typeof SoundFX !== 'undefined' && SoundFX.correct) SoundFX.correct();//[cite: 2, 3]
                }

                if (activeBoss.hp <= 0) onBossDefeated();
                return true;
            }
        }
    }

    // B. Miniboss eller direkt kroppsträff
    const distToBody = Math.hypot(shotX - activeBoss.x, shotY - activeBoss.y);
    if (distToBody <= activeBoss.width / 1.5) {
        // Om bossen kräver svagpunkter först
        if (activeBoss.weakPoints && activeBoss.weakPoints.some(wp => !wp.destroyed)) {
            if (typeof SoundFX !== 'undefined' && SoundFX.wrong) SoundFX.wrong();//[cite: 2, 3]
            return true;
        }

        activeBoss.hp -= 25;
        activeBoss.hitFlashTimer = 8;
        if (typeof SoundFX !== 'undefined' && SoundFX.correct) SoundFX.correct();//[cite: 2, 3]

        if (activeBoss.hp <= 0) onBossDefeated();
        return true;
    }

    return false;
}

function onBossDefeated() {
    score += activeBoss.points * (doublePointsTimer > 0 ? 2 : 1);
    if (typeof SoundFX !== 'undefined' && SoundFX.heavyCrash) SoundFX.heavyCrash();//[cite: 3]
    
    if (typeof ArcadeAlertSystem !== 'undefined') {
        ArcadeAlertSystem.show({
            type: "INFO",
            title: `🏆 ${activeBoss.name} BESEGRAD!`,
            message: `+${activeBoss.points} BONUSPOÄNG!`,
            duration: 150
        });
    }
    activeBoss = null;
}

// 1. Extra Kamek-risk i Häxslottet
function checkKamekJumpscare(isDirectMissEvent = false) {
    if (jumpscareState.active || showStartScreen || isGameOver || isPaused || isEmergencyStopped) return;

    const currentThemeId = THEMES[currentThemeIdx].id;
    const allowedThemes = ["ZOMBIE", "CYBERPUNK", "CIRCUS", "HAUNTED_CASTLE", "DEATH_ZONE"];
    if (!allowedThemes.includes(currentThemeId)) return;

    let scareChance = 0.05;
    if (currentThemeId === "HAUNTED_CASTLE") scareChance = 0.15; // ⚡ 3x högre chans i Häxslottet

    if (consecutiveMisses >= 2) scareChance += consecutiveMisses * 0.20;

    if ((isDirectMissEvent && Math.random() < scareChance) || (!isDirectMissEvent && Math.random() < 0.003)) {
        triggerKamekJumpscare();
    }
}

// 2. Skottsvärmar från fiender i Bowsers slott och Dödszonen
function updateThemeProjectiles() {
    const theme = THEMES[currentThemeIdx];
    if (!theme) return;

    // Fiender på banan skjuter snabbare och med flera kulor
    if (theme.bulletStorm || theme.isInfernalDifficulty) {

            const randomTarget = targets[Math.floor(Math.random() * targets.length)];
            if (randomTarget && !randomTarget.isCivilian && !randomTarget.destroyed) {
                enemyProjectiles.push({
                    x: randomTarget.x,
                    y: randomTarget.y,
                    vx: (aimX - randomTarget.x) / 35,
                    speed: theme.isInfernalDifficulty ? 5.5 : 4.0,
                    radius: 8,
                    color: theme.isInfernalDifficulty ? "#a855f7" : "#ff5722"
                });
            }
        }
    }
}

            const chosenTrack = list[Math.floor(Math.random() * list.length)];
            currentTrackTitle = chosenTrack.title;

            try {

                currentAudio.loop = true;
                currentAudio.volume = getVolume();
                currentAudio.play().catch(() => {});
            } catch (e) {}

            if (currentAudio) {
                const vol = getVolume();
                currentAudio.volume = vol;
                if (vol <= 0 || (typeof gameSettings !== 'undefined' && !gameSettings.musicEnabled)) {
                    currentAudio.pause();
                } else if (currentAudio.paused) {
                    currentAudio.play().catch(() => {});
                }
            }

            if (currentAudio) currentAudio.pause();

            if (currentAudio) {

function pollShooterGamepadInput(targetCanvas) {
    if (!isActive || isGameOver || isEmergencyStopped) return;

    // 🛑 1. KONTROLLERA OM EN HANDKONTROLL ÄR INKOPPLAD – RETURNERA DIREKT OM INGEN FINNS
    if (!navigator.getGamepads) return;
    const gamepads = navigator.getGamepads();
    let gp = null;

    for (let i = 0; i < gamepads.length; i++) {
        if (gamepads[i] && gamepads[i].connected) {
            gp = gamepads[i];
            break;
        }
    }

    if (!gp) return; // 👈 Avbryt omedelbart om ingen dosa är ansluten

    const activeCanvas = targetCanvas || canvas || document.getElementById('gameCanvas');
    if (!activeCanvas) return;

    const deadzone = 0.20;
    const aimSpeed = 9.5;

    // -------------------------------------------------------------
    // 🕹️ 1. SIKTA: VÄNSTER SPAK & STYRKORS (D-PAD)
    // -------------------------------------------------------------
    let moveX = 0;
    let moveY = 0;

    if (Math.abs(gp.axes[0]) > deadzone) moveX += gp.axes[0];
    if (Math.abs(gp.axes[1]) > deadzone) moveY += gp.axes[1];

    if (gp.buttons[14] && gp.buttons[14].pressed) moveX -= 1.0;
    if (gp.buttons[15] && gp.buttons[15].pressed) moveX += 1.0;
    if (gp.buttons[12] && gp.buttons[12].pressed) moveY -= 1.0;
    if (gp.buttons[13] && gp.buttons[13].pressed) moveY += 1.0;

    aimX = Math.max(10, Math.min(activeCanvas.width - 10, aimX + moveX * aimSpeed));
    aimY = Math.max(10, Math.min(activeCanvas.height - 10, aimY + moveY * aimSpeed));

    // 🔘 2. AVLÄS KNAPPAR
    // -------------------------------------------------------------
    const btnA = Boolean(gp.buttons[0] && gp.buttons[0].pressed);

    const btnX = Boolean(gp.buttons[2] && gp.buttons[2].pressed);
    const btnY = Boolean(gp.buttons[3] && gp.buttons[3].pressed);
    const btnR2 = Boolean(gp.buttons[7] && (gp.buttons[7].pressed || gp.buttons[7].value > 0.4));

function renderArmoredEnemy(ctx, t) {
    ctx.save();
    ctx.translate(t.x, t.y);

    let damageRatio = (t.maxHp - t.hp) / t.maxHp; // 0.0 = Hel, 0.8 = Nästan död

    // 1. Vit träffblixt vid skott
    if (t.hitFlashTimer > 0) {
        ctx.fillStyle = "#ffffff";
        t.hitFlashTimer--;

        ctx.fillStyle = t.color;
    }

    // Basfigur (Pansrad kropp)
    ctx.beginPath();
    ctx.arc(0, 0, t.radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "#111111";
    ctx.lineWidth = 3;
    ctx.stroke();

    if (damageRatio > 0.2) {
        // Skaderispor i rustningen
        ctx.strokeStyle = "#1a1a1a";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(-t.radius * 0.5, -t.radius * 0.3);
        ctx.lineTo(0, 0);
        ctx.lineTo(t.radius * 0.4, t.radius * 0.5);
        ctx.stroke();
    }

    if (damageRatio >= 0.6) {
        // Kritisk skada: Brinnande lågor och gnistor
        ctx.fillStyle = Math.random() > 0.5 ? "#ff1744" : "#ff9800";
        ctx.beginPath();
        ctx.arc(t.radius * 0.3, -t.radius * 0.4, 6 + Math.random() * 4, 0, Math.PI * 2);
        ctx.fill();

    let barW = t.w;

    ctx.fillStyle = "rgba(0, 0, 0, 0.7)";
    ctx.fillRect(barX, barY, barW, barH);

    // Fylld hälsa

    ctx.fillStyle = hpPercent > 0.5 ? "#00ffcc" : (hpPercent > 0.25 ? "#ffeb3b" : "#ff1744");
    ctx.fillRect(barX, barY, barW * hpPercent, barH);

        ctx.font = "bold 10px 'Impact', sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("⚠️ SIKTAR!", 0, barY - 4);
    }

    ctx.restore();

        ctx.fillText("🛑 EMERGENCY STOP ACTUATED 🛑", canvas.width / 2, 70);

        // Nödstoppsknapp i mitten
        ctx.save();
        ctx.translate(canvas.width / 2, 145);
        ctx.scale(pulseScale, pulseScale);

        ctx.fillStyle = "#ffd600";
        ctx.beginPath();
        ctx.arc(0, 0, 44, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = "#000000";
        ctx.lineWidth = 4;
        ctx.stroke();

        ctx.fillStyle = "#ff1744";
        ctx.beginPath();
        ctx.arc(0, 0, 32, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(0, 0, 18, 0.2 * Math.PI, 0.8 * Math.PI);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(0, 0, 18, 1.2 * Math.PI, 1.8 * Math.PI);
        ctx.stroke();
        ctx.restore();

        // Informationsruta
        ctx.fillStyle = "rgba(30, 0, 0, 0.85)";
        ctx.fillRect(40, 205, canvas.width - 80, 130);
        ctx.strokeStyle = "#ff1744";
        ctx.lineWidth = 2;
        ctx.strokeRect(40, 205, canvas.width - 80, 130);

        ctx.fillStyle = "#ffd600";
        ctx.font = `bold 13px ${theme.fontFamily || 'sans-serif'}`;
        ctx.fillText(`UTLÖST VIA: ${eStopTriggerMethod}`, canvas.width / 2, 230);

        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 12px sans-serif";
        ctx.fillText("ALL AVFYRNING OCH RUNDTIMERS ÄR FYSISKT BLOCKERADE.", canvas.width / 2, 258);
        ctx.fillText("Hårdvarubrytning utförd. Inga poäng har förlorats.", canvas.width / 2, 280);

        ctx.fillStyle = "#94a3b8";
        ctx.font = "10px sans-serif";
        ctx.fillText("Triggers: [Pause/Break] | [Backspace] | [Scroll Lock] | [Delete] | [◄] | Dosa [R3] | Röst [STOPP]", canvas.width / 2, 315);

        // Återställningsknapp
        ctx.fillStyle = "#22c55e";
        ctx.fillRect(canvas.width / 2 - 140, canvas.height - 72, 280, 34);
        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 2;
        ctx.strokeRect(canvas.width / 2 - 140, canvas.height - 72, 280, 34);

        ctx.fillStyle = "#000000";
        ctx.font = `bold 12px ${theme.fontFamily || 'sans-serif'}`;
        ctx.fillText("VRID & ÅTERSTÄLL [ENTER]", canvas.width / 2, canvas.height - 50);

        ctx.fillStyle = "#ef4444";
        ctx.font = "bold 11px sans-serif";
        ctx.fillText("[ ESC: AVSLUTA RUNDAN OCH GÅ TILL MENYN ]", canvas.width / 2, canvas.height - 15);

        ctx.restore();
    }
        }
    };
})();

// =========================================================================
// 3. TANGENTBORDSHANTERARE & SPEL-LOOP
// =========================================================================
window.addEventListener('keydown', function(e) {
    keys[e.code] = true;
    if (UsbDeviceEnforcer.handleInput(e)) return;
    // Om inställningsmenyn är aktiv
    if (currentState === STATES.SETTINGS) {
        SettingsMenuEngine.handleInput(e);
        return;
    }

    // Tryck [O] eller [Select] under spelet för att öppna inställningar
    if (e.key === 'o' || e.key === 'O') {
        currentState = (currentState === STATES.SETTINGS) ? STATES.BOSS_BATTLE : STATES.SETTINGS;
        return;
    }

    if (typeof BossBattleGame !== 'undefined' && BossBattleGame.isActive) {
        BossBattleGame.handleInput(e);
    }
});

window.addEventListener('keyup', function(e) {
    keys[e.code] = false;
});

window.addEventListener('load', function() {
    BossBattleGame.start(canvas);

    function mainLoop() {
        UsbDeviceEnforcer.render(ctx, canvas);
        // Rita ut blinkande batteri- och trådlösvarnare
if (typeof WirelessControllerBatterySensor !== 'undefined') {
    WirelessControllerBatterySensor.renderHUD(ctx, canvas.width);
}
        if (currentState === STATES.SETTINGS) {
        SettingsMenuEngine.render(ctx, canvas);
    } else if (BossBattleGame.isActive) {
            BossBattleGame.update(canvas);
            BossBattleGame.render(ctx, canvas);
        }
        requestAnimationFrame(mainLoop);
    }
    requestAnimationFrame(mainLoop);
});
</script>
