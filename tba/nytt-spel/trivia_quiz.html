function t(key) {
    const lang = ['sv', 'no', 'en'].includes(currentLang) ? currentLang : 'sv';
    return (I18N[lang] && I18N[lang][key]) || (I18N.sv && I18N.sv[key]) || key;
}

function toggleLanguage(target) {
    // 🛑 Förhindra språkbyte helt om turneringsläget är aktivt via URL
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('tournament') === 'true') {
        currentLang = 'no';
        return;
    }
    if (target) {
        currentLang = target;
    } else {
        const order = ['sv', 'no', 'en'];
        let nextIdx = (order.indexOf(currentLang) + 1) % order.length;
        currentLang = order[nextIdx];
    }
    localStorage.setItem('trivia_lang', currentLang);
    // 🌦️ Uppdatera vädret direkt till den nya stadens temperatur och prognos
    weatherData.lastFetchTime = 0; // Nollställ cache så nytt anrop görs
    fetchPresetWeather();

    if (!useApiQuestions && (gameState === "MENU" || activeQuestions.length === 0)) {
        activeQuestions = getLocalQuestions(questionCountTarget);
    }
}
function drawFlags(ctx) {
    const w = canvas.width;
    ctx.save();

    // 🇸🇪 Sverige (x: w - 140)
    ctx.fillStyle = "#006aa7"; ctx.fillRect(w - 140, 10, 36, 24);
    ctx.fillStyle = "#fecc00";
    ctx.fillRect(w - 129, 10, 6, 24); ctx.fillRect(w - 140, 19, 36, 6);
    ctx.strokeStyle = currentLang === 'sv' ? "#00ffcc" : "#ffffff";
    ctx.lineWidth = currentLang === 'sv' ? 3 : 1;
    ctx.strokeRect(w - 140, 10, 36, 24);

    // 🇳🇴 Norge (x: w - 95)
    ctx.fillStyle = "#ba0c2f"; ctx.fillRect(w - 95, 10, 36, 24);
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(w - 85, 10, 8, 24); ctx.fillRect(w - 95, 18, 36, 8);
    ctx.fillStyle = "#00205b";
    ctx.fillRect(w - 83, 10, 4, 24); ctx.fillRect(w - 95, 20, 36, 4);
    ctx.strokeStyle = currentLang === 'no' ? "#00ffcc" : "#ffffff";
    ctx.lineWidth = currentLang === 'no' ? 3 : 1;
    ctx.strokeRect(w - 95, 10, 36, 24);

    // 🇬🇧 Storbritannia (x: w - 50)
    ctx.fillStyle = "#012169"; ctx.fillRect(w - 50, 10, 36, 24);
    ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(w - 50, 10); ctx.lineTo(w - 14, 34); ctx.moveTo(w - 14, 10); ctx.lineTo(w - 50, 34); ctx.stroke();
    ctx.fillStyle = "#ffffff"; ctx.fillRect(w - 37, 10, 9, 24); ctx.fillRect(w - 50, 17, 36, 10);
    ctx.fillStyle = "#c8102e"; ctx.fillRect(w - 35, 10, 5, 24); ctx.fillRect(w - 50, 19, 36, 6);
    ctx.strokeStyle = currentLang === 'en' ? "#00ffcc" : "#ffffff";
    ctx.lineWidth = currentLang === 'en' ? 3 : 1;
    ctx.strokeRect(w - 50, 10, 36, 24);

    ctx.restore();
}

let selectedDifficulty = "NORMAL"; // "EASY", "NORMAL", "HARD", "EXTREME"
let questionCountTarget = 10;      // 10, 20, 30, 40, 50
let useApiQuestions = false;

// Säker hjälpare för att hämta lokala frågor baserat på språk och svårighet
let runtimeQuestionPool = []; // Håller kvarvarande ospelade frågor för vald nivå och språk

function getLocalQuestions(count) {
    const lang = ['sv', 'no', 'en'].includes(currentLang) ? currentLang : 'sv';
    const langDb = LOCAL_QUESTIONS_DB[lang] || LOCAL_QUESTIONS_DB.sv;
    
    // Hämta strikt och enhetligt från vald svårighetsgrad
    let sourcePool = langDb[selectedDifficulty] || [];
    if (sourcePool.length === 0 && langDb !== LOCAL_QUESTIONS_DB.sv) {
        sourcePool = (LOCAL_QUESTIONS_DB.sv && LOCAL_QUESTIONS_DB.sv[selectedDifficulty]) || [];
    }

    // Om högen är tom eller en ny match startar: fyll på med ospelade kopior
    if (!runtimeQuestionPool || runtimeQuestionPool.length === 0) {
        runtimeQuestionPool = sourcePool.map(item => ({
            q: item.q,
            answers: [...item.answers],
            correct: item.correct
        })).sort(() => Math.random() - 0.5);
    }

    const picked = [];
    const amount = count || questionCountTarget || 10;

    for (let i = 0; i < amount; i++) {
        // Om alla frågor har använts och kastats: ladda om grundpoolen så spelet inte kraschar
        if (runtimeQuestionPool.length === 0) {
            runtimeQuestionPool = sourcePool.map(item => ({
                q: item.q,
                answers: [...item.answers],
                correct: item.correct
            })).sort(() => Math.random() - 0.5);
        }

        // KASTA frågan ur högen med splice så den aldrig kan väljas igen
        const qObj = runtimeQuestionPool.splice(0, 1)[0];
        if (qObj) picked.push(qObj);
    }

    return picked;
}

function spawnBombExplosion(cx, cy, isSmoke = false) {
    const count = isSmoke ? 45 : 70;
    const colors = isSmoke 
        ? ["#1a1a1a", "#333333", "#4d4d4d", "#666666"] 
        : ["#ff1744", "#ff5722", "#ff9800", "#ffeb3b", "#ffffff", "#424242"];

    for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = isSmoke ? (1 + Math.random() * 3) : (2 + Math.random() * 10);
        bombExplosionParticles.push({
            x: cx,
            y: cy,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - (isSmoke ? (2 + Math.random() * 2) : (1 + Math.random() * 3)),
            size: isSmoke ? (6 + Math.random() * 8) : (3 + Math.random() * 6),
            color: colors[Math.floor(Math.random() * colors.length)],
            alpha: 1.0,
            decay: isSmoke ? 0.008 : (0.015 + Math.random() * 0.02)
        });
    }
}

function playBombDing() {
    try {
        const actx = getAudioContext();
        if (!actx) return;
        const osc = actx.createOscillator();
        const gain = actx.createGain();

        osc.type = "sine";
        osc.frequency.setValueAtTime(1046.50, actx.currentTime); // C6 hög klockton
        osc.frequency.exponentialRampToValueAtTime(1318.51, actx.currentTime + 0.12); // E6

        gain.gain.setValueAtTime(0.3, actx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + 0.4);

        osc.connect(gain);
        gain.connect(actx.destination);
        osc.start();
        osc.stop(actx.currentTime + 0.4);
    } catch (e) {}
}

function playBombBoooop() {
    try {
        const actx = getAudioContext();
        if (!actx) return;
        const osc = actx.createOscillator();
        const gain = actx.createGain();

        osc.type = "sawtooth"; // Rå, raspig arkad-buzz
        osc.frequency.setValueAtTime(120, actx.currentTime);
        osc.frequency.linearRampToValueAtTime(80, actx.currentTime + 0.35); // Sjunkande surr

        gain.gain.setValueAtTime(0.35, actx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + 0.35);

        osc.connect(gain);
        gain.connect(actx.destination);
        osc.start();
        osc.stop(actx.currentTime + 0.35);
    } catch (e) {}
}

            lon = 18.06;
        }
    }

    const now = Date.now();
    // Cache-kontroll (hämtar om det gått mer än 15 min eller om staden ändrats)
    if (now - weatherData.lastFetchTime < 15 * 60 * 1000 && weatherData.tempStr !== "--" && !weatherData.isError && weatherData.lastLang === currentLang) {
        return;
    }

    try {
        const url = "https://api.open-meteo.com/v1/forecast?latitude=" + lat + "&longitude=" + lon + "&current_weather=true";
        const res = await fetch(url);
        if (!res.ok) throw new Error("HTTP_" + res.status);
        const data = await res.json();

        if (data && data.current_weather && typeof data.current_weather.temperature === "number") {
            const tVal = data.current_weather.temperature;
            weatherData.tempStr = (tVal > 0 ? "+" : "") + tVal.toFixed(1);
            weatherData.weatherCode = data.current_weather.weathercode || 0;
            weatherData.isError = false;
            weatherData.lastFetchTime = now;
            weatherData.lastLang = currentLang; // Håller koll på vilken stad som hämtades
        } else {
            throw new Error("INVALID_PAYLOAD");
        }
    } catch (e) {
        weatherData.isError = true;
        weatherData.tempStr = "ERROR";
    }
}

// Ritar en liten proceduriell väderskärm (Sol, Moln, Regn, Snö eller Blixt)
function drawMiniWeatherScreen(ctx, x, y, w, h, code, isError) {
    ctx.save();
    // Mörk LCD-bakgrund med subtil ram
    ctx.fillStyle = "rgba(10, 18, 30, 0.95)";
    ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = "rgba(56, 189, 248, 0.35)";
    ctx.lineWidth = 1.5;
    ctx.strokeRect(x, y, w, h);

    const cx = x + w / 2;
    const cy = y + h / 2;

    if (isError) {
        ctx.fillStyle = "#ef4444";
        ctx.font = "bold 14px monospace";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("⚠️", cx, cy);
        ctx.restore();
        return;
    }

    // Rita förenklade arkad-väderikoner
    if (code === 0 || code === 1) {
        // ☀️ Klar himmel / Sol
        ctx.fillStyle = "#fbbf24";
        ctx.beginPath();
        ctx.arc(cx, cy, 7, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = "rgba(251, 191, 36, 0.6)";
        ctx.lineWidth = 2;
        ctx.stroke();
    } else if (code >= 51 && code <= 67) {
        // 🌧️ Regn
        ctx.fillStyle = "#94a3b8";
        ctx.beginPath();
        ctx.arc(cx - 4, cy - 2, 6, 0, Math.PI * 2);
        ctx.arc(cx + 4, cy - 2, 5, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = "#38bdf8";
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(cx - 3, cy + 4); ctx.lineTo(cx - 5, cy + 9);
        ctx.moveTo(cx + 3, cy + 4); ctx.lineTo(cx + 1, cy + 9);
        ctx.stroke();
    } else if (code >= 71 && code <= 77) {
        // ❄️ Snö
        ctx.fillStyle = "#e2e8f0";
        ctx.font = "12px sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("❄️", cx, cy);
    } else {
        // ☁️ Molnigt (Standard)
        ctx.fillStyle = "#64748b";
        ctx.beginPath();
        ctx.arc(cx - 5, cy, 6, 0, Math.PI * 2);
        ctx.arc(cx + 4, cy, 7, 0, Math.PI * 2);
        ctx.arc(cx, cy - 4, 6, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.restore();
}

function startBadgeScanner(playerIndex) {

    }
}

// Körs när användaren klickar på kamerarutan
async function requestCameraAccess() {
    const statusText = document.getElementById('scanStatus');
    const video = document.getElementById('crewCam');

    if (statusText) {
        statusText.innerText = "Ber om kameratilgang...";
        statusText.style.color = "#ffd700";
    }

    try {
        cameraStream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: "environment", width: { ideal: 640 }, height: { ideal: 480 } }
        });

        if (video) {
            video.srcObject = cameraStream;
            video.onclick = null; // Ta bort klicklyssnaren när den är igång
        }

        if (statusText) {
            statusText.innerText = "Hold årets Crew-badge mot kameraet...";
            statusText.style.color = "#22c55e";
        }

        // Starta QR-detektering
        if ('BarcodeDetector' in window) {
            const detector = new BarcodeDetector({ formats: ['qr_code', 'code_128', 'ean_13'] });
            if (scanInterval) clearInterval(scanInterval);

            scanInterval = setInterval(async () => {
                if (document.getElementById('crewBadgeModal').style.display === 'none') {
                    clearInterval(scanInterval);
                    return;
                }
                try {
                    const barcodes = await detector.detect(video);
                    for (const barcode of barcodes) {
                        if (barcode.rawValue === "POLARPARTY-CREW-2026") {
                            clearInterval(scanInterval);
                            scanInterval = null;
                            badgeApproved();
                            break;
                        }
                    }
                } catch (e) {}
            }, 300);
        }
    } catch (err) {
        if (statusText) {
            statusText.innerText = "Kameratilgang nektet. Skriv inn Crew-PIN nedenfor:";
            statusText.style.color = "#ff4444";
        }
    }
}

function verifyCrewPin() {
    const pinInput = document.getElementById('crewPinInput');
    if (!pinInput) return;
    
    // Standard Crew-kod: 2026
    if (pinInput.value === "2026") {
        pinInput.value = "";

        pinInput.focus();
    }

function executeDisqualification() {
    const select = document.getElementById('simpleReasonSelect');
    const custom = document.getElementById('simpleReasonCustom');
    const finalReason = select.value === "ANNET" ? (custom.value.trim() || "Diskvalifisert") : select.value;

    if (targetDqIndex !== null) {
        disqualifyPlayer(targetDqIndex, finalReason);
    }

    closeCrewModal();
    isTournamentPaused = false;
}

function stopCamera() {
    if (scanInterval) {
        clearInterval(scanInterval);
        scanInterval = null;
    }
    if (cameraStream) {
        cameraStream.getTracks().forEach(track => track.stop());
        cameraStream = null;
    }
}

function closeCrewModal() {
    stopCamera();
    document.getElementById('crewBadgeModal').style.display = 'none';
    targetDqIndex = null;
}

function calculateEvaluation() {
    const lang = ['sv', 'no', 'en'].includes(currentLang) ? currentLang : 'sv';
    const pack = QUIZ_EVALUATION[lang] || QUIZ_EVALUATION.sv;

    // 💣 Bomblägets rankingordning för slutskärmen
    if (gameMode === "BOMB") {
        const activeMatchPlayers = players.slice(0, playerCount);
        const survivor = activeMatchPlayers.find(p => !p.isEliminated);
        const reversedEliminated = [...eliminatedOrder].reverse();

        const ranked = [];
        if (survivor) ranked.push(survivor);
        reversedEliminated.forEach(p => {
            if (!ranked.some(r => r.id === p.id)) ranked.push(p);
        });
        activeMatchPlayers.forEach(p => {
            if (!ranked.some(r => r.id === p.id)) ranked.push(p);
        });

        // Placera ut skärmkoordinater och trigga sot/aska på den som kom sist (oavsett 2, 3 eller 4 spelare)
        const total = ranked.length;
        ranked.forEach((p, idx) => {
            p.screenX = canvas.width * 0.5;
            p.screenY = 140 + idx * 58;
            if (idx === total - 1) {
                spawnBombExplosion(p.screenX, p.screenY, true); // Sot och aska på sistaplatsen
            } else if (idx === 0) {
                spawnBombExplosion(p.screenX, p.screenY, false); // Guld/eld-gnistor på vinnaren
            }
        });
    }

    const totalPossible = Math.max(100, activeQuestions.length * 100);
    const ratio = Math.min(1.0, Math.max(0.0, score / totalPossible));

    const matched = pack.grades.find(g => ratio >= g.minRatio) || pack.grades[pack.grades.length - 1];

    const causeList = pack.causes[deathSequence.reason] || pack.causes.LIVES;
    const randomCauseQuote = causeList[Math.floor(Math.random() * causeList.length)];

    lastEvaluation = {
        rank: matched.rank,
        title: matched.title,
        color: matched.color,
        gradeQuote: matched.quote,
        causeQuote: randomCauseQuote
    };
}

function scheduleBotActions() {
    if (playStyle !== "VS_BOTS" || gameState !== "PLAYING") return;
    if (isTournamentPaused) return;
    if (botActionTimeout) clearTimeout(botActionTimeout);

    const q = activeQuestions[currentQuestionIdx];
    if (!q) return;

    // 💣 PASS THE BOMB: Endast aktuell bot agerar
    if (gameMode === "BOMB") {
        const currentP = players[activeBombPlayer];
        if (currentP && currentP.isBot && !currentP.isEliminated) {
            triggerSingleBotDecision(activeBombPlayer, q);
        }
        return;
    }

    // 🛡️ STEAL & SHIELD: Alla levande bottar tävlar om att svara
    if (gameMode === "STEAL_SHIELD") {
        for (let i = 1; i < playerCount; i++) {
            if (players[i].isBot && !players[i].isEliminated) {
                triggerSingleBotDecision(i, q);
            }
        }
    }
}

function triggerSingleBotDecision(botIdx, questionObj) {
    const cfg = BOT_CONFIGS[botDifficulty] || BOT_CONFIGS.NORMAL;
    const reactionDelay = Math.floor(cfg.minReactionMs + Math.random() * (cfg.maxReactionMs - cfg.minReactionMs));

    botActionTimeout = setTimeout(() => {
        if (gameState !== "PLAYING") return;
        // Dubbelkolla om botten fortfarande ska svara
        if (gameMode === "BOMB" && activeBombPlayer !== botIdx) return;
        if (players[botIdx].isEliminated) return;

        // Bestäm om botten gissar rätt eller fel baserat på accuracy
        const isCorrect = Math.random() < cfg.accuracy;
        let chosenAnswer = questionObj.correct;

        if (!isCorrect) {
            const wrongOptions = [0, 1, 2, 3].filter(idx => idx !== questionObj.correct);
            chosenAnswer = wrongOptions[Math.floor(Math.random() * wrongOptions.length)];
        }

        // Skicka in botens svar
        handleMultiplayerAnswer(chosenAnswer, botIdx);
    }, reactionDelay);
}

// Detektera om skärmen är en modern platt-TV/skärm (inte CRT)
function verifyCrtTelevision() {
    // Kontrollera bildförhållande och upplösning: 
    // Äkta tjock-TV-anslutningar har nästan uteslutande 4:3-format (t.ex. 640x480, 800x600, 1024x768)
    // och standard 50/60 Hz uppdatering. Moderna 16:9 / 16:10 bredbildsskärmar saknar katodstrålerör.
    const aspect = window.screen.width / window.screen.height;
    const isWidescreen = aspect > 1.45; // 16:9 är ~1.77, 16:10 är 1.6
    const isHighDpi = (window.devicePixelRatio || 1) > 1.25;

    if (isWidescreen || isHighDpi) {
        return false; // Modern platt-TV / datorskärm!
    }
    return true; // Trolig CRT (4:3 upplösning)
}

// Beräkna svarsknapparnas positioner dynamiskt
function getAnswerBoxes() {
    const w = canvas.width;
    const h = canvas.height;
    const isPortrait = h > w;

    if (isPortrait) {
        // 📱 STÅENDE MOBIL: 4 knappar staplade vertikalt
        const boxW = Math.min(w - 32, 480);
        const boxH = Math.max(55, Math.min(85, (h * 0.44) / 4));
        const startX = (w - boxW) / 2;
        const startY = h * 0.46;
        const gap = (h * 0.46) / 4;

        return [
            { x: startX, y: startY, w: boxW, h: boxH },
            { x: startX, y: startY + gap, w: boxW, h: boxH },
            { x: startX, y: startY + gap * 2, w: boxW, h: boxH },
            { x: startX, y: startY + gap * 3, w: boxW, h: boxH }
        ];
    } else {
        // 💻 PADDA / LANDSKAP: 2x2 rutnät
        const boxW = Math.min((w - 70) / 2, 420);
        const boxH = Math.max(65, Math.min(115, h * 0.18));
        const gapX = 24;
        const totalW = boxW * 2 + gapX;
        const startX = (w - totalW) / 2;
        const startY = h * 0.52;
        const gapY = boxH + 16;

        return [
            { x: startX, y: startY, w: boxW, h: boxH },
            { x: startX + boxW + gapX, y: startY, w: boxW, h: boxH },
            { x: startX, y: startY + gapY, w: boxW, h: boxH },
            { x: startX + boxW + gapX, y: startY + gapY, w: boxW, h: boxH }
        ];
    }
}

// 📅 DAGLIG UTMANING: HÄMTAR DAGENS FRÅGOR BASERAT PÅ DATUMSTÄMPEL
// =========================================================================
async function fetchDailyChallengeQuestions() {
    const hasInternet = await verifyActualInternetConnection();
    if (!hasInternet) {
        // Nätverkstestet misslyckades -> felmodalen öppnas och startQuiz avbryts
        return false;
    }
    isApiLoading = true;
    clueErrorModal.active = false;

    // 1. Direkt nätverkskontroll: Offline -> Trasig kabel
    if (navigator.onLine === false) {
        isApiLoading = false;
        clueErrorModal = {
            active: true,
            provider: "TELIA",
            errorType: "OFFLINE", // 🔌 Trasig kabel
            msg: currentLang === "sv"
                ? "TELIA: Nätverkskabeln är urdragen! Du måste vara ansluten till internet för att ladda Dagens Utmaning."
                : "TELIA: Network cable unplugged! Internet connection required for Daily Challenge."
        };
        return false;
    }

    // 2. Beräkna en stabil datum-seed (ÅÅÅÅ-MM-DD) så alla spelare får samma frågor idag
    const now = new Date();
    const dateSeed = `\({now.getFullYear()}-\){String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
    
    // Använd OpenTDB API med fast antal för dagens utmaning (t.ex. 5 frågor)
    const targetUrl = `https://opentdb.com/api.php?amount=5&type=multiple`;

    const controller = new AbortController();
    // 4 sekunder gräns innan anslutningen anses för långsam (snigel)
    const timeoutTimer = setTimeout(() => controller.abort(), 4000);

    let detectedError = "GENERIC";

    try {
        const response = await fetch(targetUrl, { signal: controller.signal });
        clearTimeout(timeoutTimer);

        if (!response.ok) {
            // Serverfel / Otillåtet svar -> Spelskiva med frågetecken
            detectedError = "GENERIC";
            throw new Error("HTTP_STATUS_" + response.status);
        }

        const data = await response.json();
        if (data.response_code !== 0 || !data.results || data.results.length === 0) {
            // Tom eller korrupt payload -> Spelskiva med frågetecken
            detectedError = "GENERIC";
            throw new Error("CORRUPT_PAYLOAD");
        }

        const dec = str => {
            const txt = document.createElement('textarea');
            txt.innerHTML = str;
            return txt.value;
        };

        // Formatera frågorna för quizmotorn
        activeQuestions = data.results.map(item => {
            const choices = item.incorrect_answers.map(dec);
            const correctAns = dec(item.correct_answer);
            const correctIdx = Math.floor(Math.random() * 4);
            choices.splice(correctIdx, 0, correctAns);
            return {
                q: dec(item.question),
                answers: choices,
                correct: correctIdx
            };
        });

        isApiLoading = false;
        return true;

    } catch (err) {
        clearTimeout(timeoutTimer);
        isApiLoading = false;

        // Kartlägg fel till specifik Telia-vektorikon
        let msg = "";

        if (err.name === "AbortError" || (err.message && err.message.includes("TIMED_OUT"))) {
            // 🐌 Snigel: Timeout
            detectedError = "TIMED_OUT";
            msg = currentLang === "sv"
                ? "TELIA: Anslutningen tog för lång tid (CONNECTION_TIMED_OUT)! Servern svarar som en snigel."
                : "TELIA: Request timed out (CONNECTION_TIMED_OUT)! The network is crawling.";
        } else if (err instanceof TypeError || (err.message && (err.message.includes("Failed to fetch") || err.message.includes("NetworkError")))) {
            // 📡 Trasig router: DNS-uppslag misslyckades
            detectedError = "NAME_NOT_RESOLVED";
            msg = currentLang === "sv"
                ? "TELIA: DNS-fel (NAME_NOT_RESOLVED)! Routern kan inte hitta frågedatabasen."
                : "TELIA: DNS failure (NAME_NOT_RESOLVED)! Router failed to locate server.";
        } else {
            // 💽 Spelskiva med frågetecken: Serverfel / Korrupt data
            detectedError = "GENERIC";
            msg = currentLang === "sv"
                ? "TELIA: Kunde inte tolka frågedatan! Nätverkspaketet var skadat eller ofullständigt."
                : "TELIA: Failed to decode question payload! Data packet was corrupted.";
        }

        // Öppna den officiella Telia-felmodalen
        clueErrorModal = {
            active: true,
            provider: "TELIA",
            errorType: detectedError,
            msg: msg
        };

        return false;
    }
}

// Starta som Host (rumskod genereras)
function initOnlineHost() {
    if (typeof Peer === "undefined") {
        isOnlineConnecting = false;
        playStyle = "LOCAL";
        clueErrorModal = {
            active: true,
            provider: "TELIA",
            errorType: "OFFLINE",
            msg: currentLang === "sv"
                ? "TELIA: PeerJS kunde inte laddas! Kontrollera nätverket eller script-länken i head."
                : "TELIA: PeerJS library failed to load! Check network or script tag in head."
        };
        return;
    }

    isOnlineConnecting = true;
    const roomCode = "TRIVIA-" + Math.floor(1000 + Math.random() * 9000);
    onlineRoomCode = roomCode;

    try {
        peer = new Peer(roomCode);

        peer.on('open', (id) => {
            isOnlineConnecting = false;
            playStyle = "ONLINE_HOST";
            myPlayerIndex = 0;
        });

        peer.on('connection', (conn) => {
            if (peerConnections.length >= 3) {
                conn.close();
                return;
            }

            peerConnections.push(conn);
            const assignedIdx = peerConnections.length;

            conn.on('open', () => {
                conn.send({ type: "WELCOME", assignedIndex: assignedIdx, playerCount: playerCount });
            });

            conn.on('data', (data) => {
                handleNetworkPacket(data, assignedIdx);
            });

            conn.on('close', () => {
                peerConnections = peerConnections.filter(c => c !== conn);
            });
        });

        peer.on('error', (err) => {
            isOnlineConnecting = false;
            triggerOfflineFailureModal();
        });
    } catch (e) {
        isOnlineConnecting = false;
        playStyle = "LOCAL";
        triggerOfflineFailureModal();
    }
}

                peerConnections = [conn];
            });

            conn.on('data', (data) => {
                handleNetworkPacket(data, -1);
            });

            conn.on('error', () => {
                isOnlineConnecting = false;
                triggerOfflineFailureModal();
            });
        });

        peer.on('error', () => {
            isOnlineConnecting = false;
            triggerOfflineFailureModal();
        });
    } catch (e) {
        isOnlineConnecting = false;
        playStyle = "LOCAL";
        triggerOfflineFailureModal();
    }
}

// Nätverkspaket-hanterare
function handleNetworkPacket(pkt, senderIndex) {
    if (pkt.type === "WELCOME") {
        myPlayerIndex = pkt.assignedIndex;
    } 
    else if (pkt.type === "START_GAME") {
        activeQuestions = pkt.questions;
        gameMode = pkt.gameMode;
        playerCount = pkt.playerCount;
        setupMatchPlayers();
        gameState = "PLAYING";
        loadQuestion(0);
    } 
    else if (pkt.type === "ANSWER_SUBMITTED") {
        // Klient svarade, Host kör domslut
        if (playStyle === "ONLINE_HOST") {
            handleMultiplayerAnswer(pkt.answerIdx, senderIndex);
            broadcastState();
        }
    } 
    else if (pkt.type === "STATE_SYNC") {
        // Klient uppdaterar sin kopia av matchstatusen från Host
        players = pkt.players;
        activeBombPlayer = pkt.activeBombPlayer;
        bombTimer = pkt.bombTimer;
        currentQuestionIdx = pkt.questionIdx;
    }
}

function broadcastState() {
    if (playStyle !== "ONLINE_HOST") return;
    const payload = {
        type: "STATE_SYNC",
        players: players,
        activeBombPlayer: activeBombPlayer,
        bombTimer: bombTimer,
        questionIdx: currentQuestionIdx
    };
    peerConnections.forEach(conn => {
        if (conn.open) conn.send(payload);
    });
}

let isSimulatedOffline = false;

try {
    if (!window._realOnLineDefined) {
        window._realOnLine = window.navigator.onLine;
        Object.defineProperty(navigator, 'onLine', {
            configurable: true,
            get: function() {
                return !isSimulatedOffline && (window._realOnLine ?? true);
            }
        });
        window._realOnLineDefined = true;
    }
} catch (e) {}

window.addEventListener('online', () => { window._realOnLine = true; isSimulatedOffline = false; });
window.addEventListener('offline', () => { window._realOnLine = false; isSimulatedOffline = true; });

async function verifyActualInternetConnection() {
    // 1. Om nätverkskortet rapporterar frånkopplat
    if (window._realOnLine === false || navigator.onLine === false) {
        // Kontrollera en extra gång om navigator faktiskt är offline
        if (!window._realOnLine) {
            triggerOfflineFailureModal();
            return false;
        }
    }

    // Om vi kör lokalt via file://, lita på webbläsarens faktiska nätverksstatus
    // för att inte blockeras av webbläsarens säkerhetspolicy för lokala filer
    if (window.location.protocol === 'file:') {
        if (!window.navigator.onLine) {
            triggerOfflineFailureModal();
            return false;
        }
        isSimulatedOffline = false;
        return true;
    }

    // 2. Ping-test via bildobjekt (helt immunt mot CORS och fetch-begränsningar)
    return new Promise((resolve) => {
        let finished = false;
        const testImg = new Image();

        const timer = setTimeout(() => {
            if (!finished) {
                finished = true;
                testImg.src = "";
                // Timeout räknas inte som offline om hårdvaran är ansluten
                isSimulatedOffline = false;
                resolve(true);
            }
        }, 2500);

        testImg.onload = testImg.onerror = () => {
            if (!finished) {
                finished = true;
                clearTimeout(timer);
                isSimulatedOffline = false;
                resolve(true); // Fick kontakt med nätet
            }
        };

        // Cache-busting ping mot Google favicon
        testImg.src = "https://www.google.com/favicon.ico?_=" + Date.now();
    });
}

async function fetchApiQuestions() {
    isApiLoading = true;
    apiErrorModal.active = false;

    let apiDiff = "medium";
    if (selectedDifficulty === "EASY") apiDiff = "easy";
    else if (selectedDifficulty === "NORMAL") apiDiff = "medium";
    else if (selectedDifficulty === "HARD" || selectedDifficulty === "EXTREME") apiDiff = "hard";

    const fetchAmount = Math.max(10, Math.min(questionCountTarget || 20, 50));
    const url = "https://opentdb.com/api.php?amount=" + fetchAmount + "&difficulty=" + apiDiff + "&type=multiple";

    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 6000);

    try {
        let res = await fetch(url, { signal: controller.signal });
        clearTimeout(timeoutId);

        if (!res.ok) throw new Error("HTTP_" + res.status);
        let data = await res.json();

        // Om specifik svårighetsgrad saknar tillräckligt med frågor: prova utan svårighetsfilter
        if (data.response_code !== 0 || !data.results || data.results.length === 0) {
            const fallbackRes = await fetch("https://opentdb.com/api.php?amount=" + fetchAmount + "&type=multiple");
            if (fallbackRes.ok) {
                data = await fallbackRes.json();
            }
        }

        if (!data.results || data.results.length === 0) {
            throw new Error("API_EMPTY");
        }

        // Avkoda HTML-entiteter som &quot; &#039; &amp; etc.
        const dec = (str) => {
            const txt = document.createElement("textarea");
            txt.innerHTML = str;
            return txt.value;
        };

        activeQuestions = data.results.map((item) => {
            const choices = item.incorrect_answers.map(dec);
            const correctAns = dec(item.correct_answer);
            const correctIdx = Math.floor(Math.random() * 4);
            choices.splice(correctIdx, 0, correctAns);

            return {
                q: dec(item.question),
                answers: choices,
                correct: correctIdx,
                _shuffled: true
            };
        });

        isApiLoading = false;
        return true;
    } catch (err) {
        clearTimeout(timeoutId);
        isApiLoading = false;

        // Fallback till lokala frågor vid nätverksfel
        if (typeof apiErrorModal !== "undefined") {
            apiErrorModal.active = true;
            apiErrorModal.errorType = "OFFLINE";
            if (typeof t === "function") {
                apiErrorModal.msg = t("errOfflineDesc");
            }
        }
        activeQuestions = getLocalQuestions(questionCountTarget || 10);
        return false;
    }
}

function sanitizePlayerName(raw) {
    let clean = (raw || "").trim().toUpperCase();
    const fallbackName = t("guestName");

    // Tomt -> GÄST / GUEST
    if (clean.length === 0) return fallbackName;

    // Endast A-Ö, 0-9 och mellanslag
    const validRegex = /^[A-ZÅÄÖ0-9 ]+$/;
    if (!validRegex.test(clean)) return fallbackName;

    // Censur av fula ord
    for (let word of BANNED_WORDS) {
        if (clean.includes(word)) return fallbackName;
    }

    return clean;
}

            document.body.innerHTML = "";
            document.body.appendChild(overlay);
            document.body.style.overflow = "hidden";
        };

        if (document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded", showNetOnNetScreen);
        } else {
            showNetOnNetScreen();
        }

        throw new Error("HARDWARE_BARRIER_TRIGGERED: " + failReasonTitle);
    }
})();

                           (idLower.includes("sony") && idLower.includes("0df2")); // USB PID för Edge

    const isXboxElite = idLower.includes("xbox elite") || 
                        idLower.includes("elite wireless") || 
                        idLower.includes("elite controller") ||
                        idLower.includes("0b00") || idLower.includes("0b05"); // USB PID för Elite Series 1 & 2

    if (isDualSenseEdge || isXboxElite) {
        return "ELITE_PRO_BANNED";
    }

    // Nya retro-tillbehör
    if (idLower.includes("turbo") || idLower.includes("pce") || idLower.includes("pc engine") || idLower.includes("tg16") || idLower.includes("grafx")) return "PCE_TURBOGRAFX";
    if (idLower.includes("gba") || idLower.includes("game boy") || idLower.includes("gameboy") || idLower.includes("super game boy")) return "GBA_LINK";
    if (idLower.includes("intelli") || idLower.includes("coleco")) return "INTELLIVISION";
    if (idLower.includes("trackball") || idLower.includes("spinner") || idLower.includes("roller")) return "TRACKBALL_MOUSE";

    // Tidigare dosor
    if (idLower.includes("amiga") || idLower.includes("cd32") || idLower.includes("commodore")) return "AMIGA";
    if (idLower.includes("cd-i") || idLower.includes("cdi") || idLower.includes("philips")) return "PHILIPS_CDI";
    if (idLower.includes("nes") || idLower.includes("famicom")) return "NES";
    if (idLower.includes("snes") || idLower.includes("sfc") || idLower.includes("super nintendo")) return "SNES";
    if (idLower.includes("n64") || idLower.includes("nintendo 64")) return "N64";
    if (idLower.includes("gamecube") || idLower.includes("ngc")) return "GAMECUBE";
    if (idLower.includes("master system") || idLower.includes("sms pad")) return "MASTER_SYSTEM";
    if (idLower.includes("saturn")) return "SATURN";
    // Wiimote / Wii Remote / Mayflash DolphinBar
    if (idLower.includes("wiimote") || idLower.includes("wii remote") || idLower.includes("rvl-cnt") || idLower.includes("dolphinbar")) {
        return "WIIMOTE_GUN";
    }
    // Nintendo Joy-Cons (Vänster, Höger eller parade)
    if (idLower.includes("joy-con") || idLower.includes("joycon") || idLower.includes("switch controller")) {
        return "JOYCON";
    }

    // PlayStation Move Motion & Navigation Controllers
    if (idLower.includes("motion controller") || idLower.includes("navigation controller") || idLower.includes("ps move") || idLower.includes("playstation move")) {
        return "PS_MOVE";
    }

    // Ljuspistoler (AimTrak, Sinden, GunCon, NES Zapper USB)
    if (idLower.includes("lightgun") || idLower.includes("aimtrak") || idLower.includes("sinden") || idLower.includes("guncon") || idLower.includes("zapper")) {
        // Kontrollera direkt om spelaren försöker köra på platt skärm
        if (!verifyCrtTelevision()) {
            KamekAntiCheat.lock("CRT_REQUIRED_CHEAT");
            return "LIGHTGUN_CRT";
        }
        return "LIGHTGUN_CRT";
    }
    if (idLower.includes("dreamcast") || idLower.includes("maple")) return "DREAMCAST_PAD";
    if (idLower.includes("genesis") || idLower.includes("mega drive") || idLower.includes("megadrive") || idLower.includes("sega")) return "GENESIS";
    if (idLower.includes("neo geo") || idLower.includes("neogeo") || idLower.includes("snk")) return "NEOGEO";
    if (idLower.includes("atari") || idLower.includes("2600") || idLower.includes("7800") || idLower.includes("jaguar")) return "ATARI";
    if (idLower.includes("playstation") || idLower.includes("dualshock") || idLower.includes("ps1") || idLower.includes("ps2") || idLower.includes("ps3") || idLower.includes("ps4") || idLower.includes("ps5")) return "PLAYSTATION";

    return "GENESIS";
}

if (isControllerCheckActive) {

        gp.buttons.forEach((btn, idx) => {

            const btnKey = `p\({playerIndex}_btn_\){idx}`;


            if (isDown && !lastControllerButtonStates[btnKey]) {
                // Buzz-knappar eller standard 0-3 (A, B, C, D)
                let ans = -1;
                if (currentType === "BUZZ") {
                    if (idx === 1) ans = 0;
                    if (idx === 2) ans = 1;
                    if (idx === 3) ans = 2;
                    if (idx === 4) ans = 3;
                } else {
                    if (idx === 0) ans = 0;
                    if (idx === 1) ans = 1;
                    if (idx === 2) ans = 2;
                    if (idx === 3) ans = 3;
                }

                if (ans !== -1 && gameState === "PLAYING") {
                    handleMultiplayerAnswer(ans, playerIndex);
                }
            }
            lastControllerButtonStates[btnKey] = isDown;
        });

        // ---------------------------------------------------------------------
        // 🚨 MÄTNING AV TURBO-KNAPPAR & RAPID-FIRE
        // ---------------------------------------------------------------------
        gp.buttons.forEach((btn, idx) => {
            const btnKey = `\({i}_btn_\){idx}`;
            const wasDown = lastControllerButtonStates[btnKey] || false;
            const isDown = btn.pressed || (typeof btn === 'object' && btn.value > 0.5);

            if (isDown && !wasDown) {
                const now = performance.now();
                if (!controllerButtonBurstTracker[btnKey]) {
                    controllerButtonBurstTracker[btnKey] = [];
                }
                controllerButtonBurstTracker[btnKey].push(now);

                // Behåll nedslag inom senaste 1000 ms
                controllerButtonBurstTracker[btnKey] = controllerButtonBurstTracker[btnKey].filter(t => now - t < 1000);

                // Om knappen tryckts mer än 16 gånger på en sekund -> Fysisk Turbo-knapp
                if (controllerButtonBurstTracker[btnKey].length >= 16) {
                    KamekAntiCheat.lock("HARDWARE_TURBO_CHEAT");
                    return;
                }

                handleUniversalAccessoryInput(currentType, "BUTTON", idx);
            }
            lastControllerButtonStates[btnKey] = isDown;
        });

        // Avlyssning av analoga axlar och styrkors
        if (gp.axes && gp.axes.length >= 2) {
            const axisXKey = `${i}_axis_x`;
            const axisYKey = `${i}_axis_y`;
            const deadZone = 0.55;

            const axX = gp.axes[0];
            const axY = gp.axes[1];

            if (axX < -deadZone && !lastControllerAxisStates[axisXKey + "_neg"]) {
                handleUniversalAccessoryInput(currentType, "AXIS", "LEFT");
                lastControllerAxisStates[axisXKey + "_neg"] = true;
            } else if (axX >= -deadZone) {
                lastControllerAxisStates[axisXKey + "_neg"] = false;
            }

            if (axX > deadZone && !lastControllerAxisStates[axisXKey + "_pos"]) {
                handleUniversalAccessoryInput(currentType, "AXIS", "RIGHT");
                lastControllerAxisStates[axisXKey + "_pos"] = true;
            } else if (axX <= deadZone) {
                lastControllerAxisStates[axisXKey + "_pos"] = false;
            }

            if (axY < -deadZone && !lastControllerAxisStates[axisYKey + "_neg"]) {
                handleUniversalAccessoryInput(currentType, "AXIS", "UP");
                lastControllerAxisStates[axisYKey + "_neg"] = true;
            } else if (axY >= -deadZone) {
                lastControllerAxisStates[axisYKey + "_neg"] = false;
            }

            if (axY > deadZone && !lastControllerAxisStates[axisYKey + "_pos"]) {
                handleUniversalAccessoryInput(currentType, "AXIS", "DOWN");
                lastControllerAxisStates[axisYKey + "_pos"] = true;
            } else if (axY <= deadZone) {
                lastControllerAxisStates[axisYKey + "_pos"] = false;
            }
        }
    }

    if (!detectedAny) {
        connectedAccessoryType = "INGEN";
    }
}

// Röststyrningsstatus: "OFF", "REQUESTING", "ACTIVE", "DENIED", "UNSUPPORTED"
let voiceStatus = "OFF";
let recognition = null;
let micAudioStream = null;


async function initVoiceControl() {
    // Om redan aktiv, neka inte igen utan låt den vara på
    if (voiceStatus === "ACTIVE" || voiceStatus === "REQUESTING") return;

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        voiceStatus = "UNSUPPORTED";
        return;
    }

    voiceStatus = "REQUESTING";

    try {
        // 1. Fråga om mikrofontillstånd via webbläsarens popup
        micAudioStream = await navigator.mediaDevices.getUserMedia({ audio: true });

        // 2. Användaren tryckte "Tillåt" -> Initiera talmotorn
        recognition = new SpeechRecognition();
        recognition.continuous = true;
        recognition.interimResults = false;
        if (recognition) {
            recognition.lang = currentLang === 'sv' ? 'sv-SE' : (currentLang === 'no' ? 'nb-NO' : 'en-US');
        }

        recognition.onresult = (event) => {
            if (KamekAntiCheat.isTriggered()) return;
            const last = event.results.length - 1;
            const text = event.results[last][0].transcript.trim().toLowerCase();

            // 1. 🚨 GROVA REGELBROTT -> Direkt låsning utan varning!
            for (let bad of SWEAR_WORDS_SEVERE) {
                if (text.includes(bad)) {
                    KamekAntiCheat.lock("GROSS_MISCONDUCT");
                    return;
                }
            }

            // 2. ⚠️ VANLIGA SVORDOMAR & KÖNSORD -> Varning, spärr vid 3
            for (let bad of SWEAR_WORDS_STANDARD) {
                // Matcha hela ord eller delar i talet
                const regex = new RegExp(`\\b${bad}\\b`, 'i');
                if (regex.test(text) || text.includes(bad)) {
                    swearWarnings++;
                    const warnTemplate = t("profanityWarningText");
lastSwearText = warnTemplate.replace("%STRIKE%", swearWarnings);
swearWarningTimer = 180;
                    swearWarningTimer = 180; // Visas i ca 3 sekunder
                    triggerHapticFeedback("WRONG");

                    try {
                        new Audio('windows_error.wav').play().catch(() => {});
                    } catch(e) {}

                    if (swearWarnings >= 3) {
                        KamekAntiCheat.lock("TOXIC_BEHAVIOR");
                    }
                    return;
                }
            }

            // =============================================================
            // 🧙‍♂️ KAMEK HÅN-PÅSKÄGG: "KAMEK", "SKRATTA", "HÅNA", "TROLLA"
            // =============================================================
            if (text.includes("kamek") || text.includes("skratta") || text.includes("håna") || text.includes("laugh")) {
                try {
                    const trollAudio = new Audio('kamek.mp3');
                    trollAudio.volume = 1.0;
                    trollAudio.play().catch(() => {});
                } catch (e) {}
                return;
            }

            // =============================================================
            // 🔍 RÖSTSTYRDA LIVLINOR & LEDTRÅDAR (BÅDE SV & EN)
            // =============================================================
            if (gameState === "PLAYING") {
                // Begär Google-ledtråd i CLASSIC: "ledtråd", "hjälp", "googla", "hint"
                if (text.includes("ledtråd") || text.includes("googla") || text.includes("hjälp") || text.includes("hint") || text.includes("clue")) {
                    if (typeof requestGoogleClue === 'function') requestGoogleClue();
                    return;
                }

                // Miljonärslägets livlinor:
                if (gameMode === "MILLIONAIRE") {
                    if (text.includes("femtio") || text.includes("fifty") || text.includes("halvera")) {
                        useFiftyFifty();
                        return;
                    }
                    if (text.includes("ring") || text.includes("vän") || text.includes("friend") || text.includes("telefon")) {
                        usePhoneFriend();
                        return;
                    }
                    if (text.includes("publik") || text.includes("audience") || text.includes("fråga alla")) {
                        useAskAudience();
                        return;
                    }
                }
            }

            // =============================================================
            // 🎯 SVARSALTERNATIV A, B, C, D (UTÖKAT ORDFÖRRÅD)
            // =============================================================
            if (gameState === "PLAYING") {
                // Alternativ A: Blå / Ett / Första / Alpha / Vänster
                if (
                    text.includes("blå") || text.includes("blue") || 
                    text.includes("ett") || text.includes("one") || text.includes("1") || 
                    text.includes("alfa") || text.includes("alpha") || text.includes("vänster") || text.includes("left") ||
                    text === "a" || text.startsWith("a ") || text.endsWith(" a")
                ) {
                    selectAnswer(0);
                    return;
                }

                // Alternativ B: Orange / Röd / Två / Andra / Beta / Upp
                if (
                    text.includes("orange") || text.includes("röd") || text.includes("red") || 
                    text.includes("två") || text.includes("two") || text.includes("2") || 
                    text.includes("beta") || text.includes("upp") || text.includes("up") ||
                    text === "b" || text.startsWith("b ") || text.endsWith(" b")
                ) {
                    selectAnswer(1);
                    return;
                }

                // Alternativ C: Grön / Tre / Tredje / Charlie / Gamma / Ner
                if (
                    text.includes("grön") || text.includes("green") || 
                    text.includes("tre") || text.includes("three") || text.includes("3") || 
                    text.includes("gamma") || text.includes("charlie") || text.includes("ner") || text.includes("ned") || text.includes("down") ||
                    text === "c" || text.startsWith("c ") || text.endsWith(" c")
                ) {
                    selectAnswer(2);
                    return;
                }

                // Alternativ D: Gul / Fyra / Fjärde / Delta / Höger
                if (
                    text.includes("gul") || text.includes("yellow") || 
                    text.includes("fyra") || text.includes("four") || text.includes("4") || 
                    text.includes("delta") || text.includes("höger") || text.includes("right") ||
                    text === "d" || text.startsWith("d ") || text.endsWith(" d")
                ) {
                    selectAnswer(3);
                    return;
                }
            }

            // =============================================================
            // 📋 MENY & NAVIGERING: "STARTA", "SPELA", "MENY", "START"
            // =============================================================
            if (gameState === "MENU") {
                if (text.includes("starta") || text.includes("börja") || text.includes("start") || text.includes("spela") || text.includes("play")) {
                    openNamePrompt();
                    return;
                }
            } else if (gameState === "GAMEOVER") {
                if (text.includes("meny") || text.includes("igen") || text.includes("omstart") || text.includes("restart") || text.includes("menu")) {
                    resetDatabaseAndReturnToMenu();
                    return;
                }
            }
        };

        recognition.onerror = (e) => {
            if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
                voiceStatus = "DENIED";
            }
        };

        recognition.onend = () => {
            if (voiceStatus === "ACTIVE") {
                try { recognition.start(); } catch(e) {}
            }
        };

        recognition.start();
        voiceStatus = "ACTIVE";

    } catch (err) {
        // 3. Användaren tryckte "Blockera / Nej" eller stängde prompten
        if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
            voiceStatus = "DENIED";
        } else {
            voiceStatus = "DENIED";
        }
        try { new Audio('windows_error.wav').play().catch(() => {}); } catch(e) {}
    }
}

async function loadQuestion(idx) {
    // 💣 KONTROLL FÖR BOMBLÄGET: HÄMTA 100 NYA FRÅGOR VID SLUT
    if (gameMode === "BOMB") {
        if (idx >= activeQuestions.length) {
            if (useApiQuestions) {
                // OpenTDB: Hämta 2 st 50-frågors uppsättningar (totalt 100 frågor)
                if (typeof fetchApiQuestions === "function") {
                    await fetchApiQuestions(100);
                }
            } else {
                // Lokalt: Hämta 100 unika frågor från den lokala databasen
                const freshLocal = getLocalQuestions(100);
                activeQuestions = activeQuestions.concat(freshLocal);
            }
        }
    } else if (gameMode === "STEAL_SHIELD" || playStyle === "VS_BOTS") {
        if (idx >= activeQuestions.length) {
            const extra = getLocalQuestions(15);
            activeQuestions = activeQuestions.concat(extra);
        }
    } else {
        // Enspelarläget avslutas när standardfrågorna tar slut
        if (idx >= activeQuestions.length) {
            deathSequence.active = false;
            deathSequence.gameOverAlpha = 1.0;
            deathSequence.reason = "COMPLETED";
            gameState = "GAMEOVER";
            if (typeof calculateEvaluation === "function") calculateEvaluation();
            if (typeof saveFinalScore === "function") saveFinalScore(score);
            try { new Audio("win.mp3").play().catch(() => {}); } catch(e) {}
            return;
        }
    }

    currentQuestionIdx = idx;

    // Blanda svarsalternativen dynamiskt om det inte redan är gjort
    const q = activeQuestions[currentQuestionIdx];
    if (q) {
        if (typeof sessionSeenQuestions !== "undefined") {
            sessionSeenQuestions.add(q.q);
        }

        if (q.answers && !q._shuffled) {
            const originalCorrectText = q.answers[q.correct];
            for (let i = q.answers.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                const temp = q.answers[i];
                q.answers[i] = q.answers[j];
                q.answers[j] = temp;
            }
            q.correct = q.answers.indexOf(originalCorrectText);
            q._shuffled = true;
        }
    }

    questionTimer = MAX_TIME;
    lastTickSec = -1;
    tickSubCounter = 0;
    selectedAnswerIdx = -1;
    if (typeof clueErrorModal !== "undefined") clueErrorModal.active = false;
    eliminatedAnswers = [];
    activeClueText = "";
    if (typeof lifelineModal !== "undefined") lifelineModal.active = false;
    questionStartTime = performance.now();

    // Trigga bottarna om läget är mot bottar
    if (playStyle === "VS_BOTS" && typeof scheduleBotActions === "function") {
        scheduleBotActions();
    }
}

function playUrgentBombTick(secondsLeft) {
    try {
        const actx = getAudioContext();
        if (!actx) return;

        const osc = actx.createOscillator();
        const gain = actx.createGain();

        // Frekvensen glider uppåt från 1200 Hz till 2400 Hz ju närmare 0 man kommer
        const progress = Math.max(0, Math.min(1, secondsLeft / 4.5));
        const freq = 2400 - (progress * 1200);

        osc.type = "sawtooth";
        osc.frequency.setValueAtTime(freq, actx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(freq * 0.5, actx.currentTime + 0.035);

        // Något högre volym när explosionen är nära
        const vol = 0.35 - (progress * 0.15);
        gain.gain.setValueAtTime(vol, actx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + 0.035);

        osc.connect(gain);
        gain.connect(actx.destination);

        osc.start();
        osc.stop(actx.currentTime + 0.035);
    } catch (e) {}
}

function playSadTrombone() {
    try {
        const actx = getAudioContext();
        if (!actx) return;

        // Fyra fallande toner: D4 -> C#4 -> C4 -> B3 (med böjd ton och vibrato)
        const notes = [
            { freq: 293.66, dur: 0.35, delay: 0.00 },
            { freq: 277.18, dur: 0.35, delay: 0.38 },
            { freq: 261.63, dur: 0.35, delay: 0.76 },
            { freq: 246.94, dur: 0.90, delay: 1.14 } // Sista långa tonen (waaaaa)
        ];

        notes.forEach((n, idx) => {
            const osc = actx.createOscillator();
            const gain = actx.createGain();

            osc.type = "sawtooth";

            // Liten mjuk glidning nedåt för mässingsblås-känsla
            const startTime = actx.currentTime + n.delay;
            const stopTime = startTime + n.dur;

            osc.frequency.setValueAtTime(n.freq, startTime);
            osc.frequency.linearRampToValueAtTime(n.freq * 0.96, stopTime);

            gain.gain.setValueAtTime(0.001, startTime);
            gain.gain.linearRampToValueAtTime(0.28, startTime + 0.05);
            gain.gain.exponentialRampToValueAtTime(0.001, stopTime);

            // Biquad-filter för dämpad "wah"-effekt
            const filter = actx.createBiquadFilter();
            filter.type = "lowpass";
            filter.frequency.setValueAtTime(650, startTime);
            filter.frequency.linearRampToValueAtTime(idx === 3 ? 400 : 900, stopTime);

            osc.connect(filter);
            filter.connect(gain);
            gain.connect(actx.destination);

            osc.start(startTime);
            osc.stop(stopTime);
        });
    } catch (e) {}
}

function playBombAlarmTick(urgencyRatio) {
    try {
        const actx = getAudioContext();
        if (!actx) return;
        const osc = actx.createOscillator();
        const gain = actx.createGain();

        // Frekvensen stiger från 1100 Hz upp till 1900 Hz ju närmare 0 man kommer
        const freq = 1100 + (1 - urgencyRatio) * 800;
        osc.type = "sawtooth";
        osc.frequency.setValueAtTime(freq, actx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(freq * 0.7, actx.currentTime + 0.04);

        gain.gain.setValueAtTime(0.22, actx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + 0.04);

        osc.connect(gain);
        gain.connect(actx.destination);
        osc.start();
        osc.stop(actx.currentTime + 0.04);
    } catch(e) {}
}

async function requestGoogleClue() {
    if (gameState !== "PLAYING" || selectedAnswerIdx !== -1 || isClueLoading) return;
    if (googleCluesLeft <= 0) return;

    const hasInternet = await verifyActualInternetConnection();
    if (!hasInternet) {
        return; // Avbryt direkt, felmodalen öppnas utan att dra någon ledtråd
    }

    googleCluesLeft--;
    isClueLoading = true;
    clueErrorModal.active = false;

    // Kontrollera direkt om enheten är helt offline
    if (navigator.onLine === false) {
        isClueLoading = false;
        googleCluesLeft++;
        clueErrorModal = {
            active: true,
            provider: "TELIA",
            errorType: "OFFLINE",
            msg: currentLang === "sv"
                ? "TELIA: Nätverkskabeln verkar vara utdragen eller avsliten! Du är helt offline."
                : "TELIA: Network cable unplugged or broken! You are currently offline."
        };
        return;
    }

    const q = activeQuestions[currentQuestionIdx];
    if (!q) {
        isClueLoading = false;
        return;
    }

    const cleanQuery = q.q
        .replace(/[\?\!\.\,\"\']/g, " ")
        .replace(/\b(vad|vem|vilket|vilken|vilka|hur|när|var|what|which|who|where|how|when|is|the|a|an)\b/gi, "")
        .trim();

    let snippetText = "";
    let detectedError = "GENERIC";

    // 1. Försök med Google JSONP
    try {
        if (typeof fetchGoogleSuggestionsJSONP === "function") {
            const suggestions = await fetchGoogleSuggestionsJSONP(cleanQuery);
            if (suggestions && suggestions.length > 0) {
                snippetText = `🔎 GOOGLE: "${suggestions.slice(0, 3).join(' • ')}"`;
            }
        }
    } catch (e) {
        if (e.message === "GOOGLE_TIMEOUT") detectedError = "TIMED_OUT";
        else if (e.message === "GOOGLE_SCRIPT_ERROR") detectedError = "NAME_NOT_RESOLVED";
    }

    // 2. Försök med Wikipedia fallback
    if (!snippetText) {
        try {
            const lang = currentLang === "sv" ? "sv" : "en";
            const wikiUrl = "https://" + lang + ".wikipedia.org/w/api.php?action=query&list=search&srsearch=" + encodeURIComponent(cleanQuery) + "&utf8=&format=json&origin=*";
            
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 4000);

            const wRes = await fetch(wikiUrl, { signal: controller.signal });
            clearTimeout(timeoutId);

            if (wRes && wRes.ok) {
                const wData = await wRes.json();
                if (wData.query && wData.query.search && wData.query.search.length > 0) {
                    let rawSnippet = wData.query.search[0].snippet.replace(/<\/?[^>]+(>|$)/g, "").trim();
                    if (rawSnippet.length > 0) {
                        snippetText = `📖 WIKIPEDIA: "...${rawSnippet}..."`;
                    }
                }
            }
        } catch (e) {
            if (e.name === "AbortError") {
                detectedError = "TIMED_OUT";
            } else if (e instanceof TypeError || (e.message && e.message.includes("Failed to fetch"))) {
                detectedError = "NAME_NOT_RESOLVED";
            }
        }
    }

    // 3. Resultat
    if (snippetText) {
        activeClueText = snippetText;
        isClueLoading = false;
    } else {
        isClueLoading = false;
        googleCluesLeft++; // Återbetala livlinan

        let msgText = "";
        if (detectedError === "NAME_NOT_RESOLVED") {
            msgText = currentLang === "sv"
                ? "TELIA: DNS-fel (NAME_NOT_RESOLVED)! Routern svarar inte på adressuppslag."
                : "TELIA: DNS failure (NAME_NOT_RESOLVED)! Router failed to look up host.";
        } else if (detectedError === "TIMED_OUT") {
            msgText = currentLang === "sv"
                ? "TELIA: Anslutningen tog för lång tid (CONNECTION_TIMED_OUT)!"
                : "TELIA: Connection timed out (CONNECTION_TIMED_OUT)!";
        } else {
            msgText = currentLang === "sv"
                ? "TELIA: Sökningen kunde inte slutföras p.g.a. okänt nätverksfel."
                : "TELIA: Lookup failed due to an unexpected network issue.";
        }

        clueErrorModal = {
            active: true,
            provider: "TELIA",
            errorType: detectedError,
            msg: msgText
        };
    }
}

let audioCtx = null;

function getAudioContext() {
    if (!audioCtx) {
        const AudioCtxClass = window.AudioContext || window.webkitAudioContext;
        if (AudioCtxClass) audioCtx = new AudioCtxClass();
    }
    if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume().catch(() => {});
    }
    return audioCtx;
}

// Skapar ett arkad-klick/tick i högtalaren med anpassad tonhöjd
function playClockTick(freq = 800, duration = 0.035, isUrgent = false) {
    try {
        const ctx = getAudioContext();
        if (!ctx) return;

        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = isUrgent ? "sawtooth" : "triangle";
        osc.frequency.setValueAtTime(freq, ctx.currentTime);
        // Snabb pitch drop för krispigt mekaniskt klick
        osc.frequency.exponentialRampToValueAtTime(freq * 0.4, ctx.currentTime + duration);

        gain.gain.setValueAtTime(isUrgent ? 0.25 : 0.12, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start();
        osc.stop(ctx.currentTime + duration);
    } catch (e) {
        // Ignorera om ljudet inte tillåts än
    }
}

function checkChromecastViolation() {
    if (KamekAntiCheat.isTriggered()) return true;

    var ua = (navigator.userAgent || "").toLowerCase();

    // 1. Spärra om spelet körs direkt i en Chromecast / Google TV ("CrKey")
    if (ua.indexOf("crkey") !== -1 || ua.indexOf("chromecast") !== -1) {
        KamekAntiCheat.lock("CHROMECAST_BLOCKED");
        return true;
    }

    // 2. Kontrollera Google Cast Sender API säkert
    try {
        if (window.chrome && window.chrome.cast) {
            if (window.chrome.cast.isAvailable === true) {
                KamekAntiCheat.lock("CHROMECAST_BLOCKED");
                return true;
            }
        }
    } catch(e) {}

    // 3. Fånga om Google Cast SDK laddas asynkront under spelets gång
    try {
        window['__onGCastApiAvailable'] = function(isAvailable) {
            if (isAvailable) {
                KamekAntiCheat.lock("CHROMECAST_BLOCKED");
            }
        };
    } catch(e) {}

    // 4. Kontrollera Presentation API utan att läsa instans-specifika getters
    try {
        if (navigator.presentation && navigator.presentation.receiver) {
            KamekAntiCheat.lock("CHROMECAST_BLOCKED");
            return true;
        }
    } catch(e) {}

    return false;
}

// Avancerad touch-lyssnare som granskar finger-autenticitet
window.addEventListener('touchstart', (e) => {
    if (KamekAntiCheat.isTriggered()) return;

    if (e.touches && e.touches.length > 0) {
        const touch = e.touches[0];

        // 🤖 KONTROLL 1: Syntetisk klickbot (Auto-Clicker)
        // Om touch-händelsen saknar radie och är triggad av en overlay-app
        if (touch.radiusX !== undefined && touch.radiusX === 0 && touch.radiusY === 0) {
            // Vissa äldre desktopsimulatorer saknar radie, men på riktiga mobiler har fingrar alltid radie > 0
            if (/android|iphone|ipad/i.test(navigator.userAgent) && !e.isTrusted) {
                KamekAntiCheat.lock("AUTO_CLICKER_BOT");
                return;
            }
        }

        // 🤖 KONTROLL 2: Omänsklig reaktionstid (< 160 ms från att frågan laddades)
        if (gameState === "PLAYING" && questionStartTime > 0) {
            const reactionTime = performance.now() - questionStartTime;
            if (reactionTime < 160) {
                KamekAntiCheat.lock("AUTO_CLICKER_BOT");
                return;
            }
        }

        handleInputAt(touch.clientX, touch.clientY);
    }

    if (e.cancelable) {
        e.preventDefault();
    }
}, { passive: false });

// Utför diskvalificeringen och sätter upp Kamek-hånet
function disqualifyPlayer(playerIndex, reason) {
    if (playerIndex === null || !players || !players[playerIndex]) return;

    const p = players[playerIndex];
    p.lives = 0;
    p.isEliminated = true;
    p.isDQ = true;
    disqualifiedPlayers[playerIndex] = reason;

    if (!eliminatedOrder.some(el => el.id === p.id)) {
        eliminatedOrder.push(p);
    }

    // Explodera spelarens plats med rök/aska
    spawnBombExplosion(canvas.width * 0.5, canvas.height * 0.5, true);

    // Aktivera Kamek-hånet
    kamekBubble.active = true;
    kamekBubble.playerIdx = playerIndex;
    kamekBubble.timer = 300;
    kamekBubble.isDQ = true;
    kamekBubble.text = "NYEHEHEHE! FERSKET AV CREW: " + reason.toUpperCase();

    try { playBombBoooop(); } catch (e) {}

    // Skicka bomben vidare till nästa levande spelare
    passBombToNextPlayer();
}

// Tangentbordsstyrning
window.addEventListener('keydown', (e) => {
    // Om Kamek har låst spelet, ignorera alla tangenter så att skärmen inte laddas om!
    if (KamekAntiCheat.isTriggered()) {
        e.preventDefault();
        return;
    }


    // 1. Öppna Crew-dialogen via Shift + 1-4 ELLER Shift + F1-F4
    if (!showCrewDqDialog && e.shiftKey) {
        let targetIdx = null;

        // Fånga vanliga sifferraden oavsett Shift-tecken (!, ", #, ¤)
        if (e.code === 'Digit1') targetIdx = 0;
        else if (e.code === 'Digit2') targetIdx = 1;
        else if (e.code === 'Digit3') targetIdx = 2;
        else if (e.code === 'Digit4') targetIdx = 3;

        // Fånga även F1 - F4
        else if (e.code === 'F1' || e.key === 'F1') targetIdx = 0;
        else if (e.code === 'F2' || e.key === 'F2') targetIdx = 1;
        else if (e.code === 'F3' || e.key === 'F3') targetIdx = 2;
        else if (e.code === 'F4' || e.key === 'F4') targetIdx = 3;

        if (targetIdx !== null) {
            e.preventDefault(); // Stoppar webbläsarens hjälpmeny vid F1
            
            // Kontrollera att bombläget är igång och spelaren existerar
            if (gameMode === "BOMB" && players && players[targetIdx] && !players[targetIdx].isDQ) {
                if (e.shiftKey) return; // <-- Lägg till denna spärr om du behåller den!
                dqDialogPlayerIdx = targetIdx;
                // showCrewDqDialog = true;
                isCustomReasonMode = false;
                customReasonText = "";
                isTournamentPaused = true;
                pauseReason = "DOMMERPAUSE: DISKVALIFISERING";
            }
            return;
        }
    }

    // 2. Interaktion när dialogen är öppen
    if (showCrewDqDialog) {
        e.preventDefault();

        // Stäng/avbryt med Escape
        if (e.key === 'Escape') {
            if (isCustomReasonMode) {
                isCustomReasonMode = false;
            } else {
                showCrewDqDialog = false;
                isTournamentPaused = false;
                pauseReason = "";
            }
            return;
        }

        // Steg A: Välj orsak 1-5 eller tryck 6 för egen text
        if (!isCustomReasonMode) {
            // e.code fungerar oavsett om NumLock är på eller av
            const codeToNumber = {
                'Digit1': 0, 'Numpad1': 0,
                'Digit2': 1, 'Numpad2': 1,
                'Digit3': 2, 'Numpad3': 2,
                'Digit4': 3, 'Numpad4': 3,
                'Digit5': 4, 'Numpad5': 4,
                'Digit6': 5, 'Numpad6': 5
            };

            const selectedIdx = codeToNumber[e.code];

            if (selectedIdx !== undefined) {
                if (selectedIdx >= 0 && selectedIdx <= 4) {
                    const reason = PRESET_REASONS[selectedIdx].substring(3);
                    commitDisqualification(dqDialogPlayerIdx, reason);
                } else if (selectedIdx === 5) {
                    isCustomReasonMode = true;
                    customReasonText = "";
                }
            }
        } 
        // Steg B: Skriv egen orsak direkt i rutan och tryck Enter
        else {
            if (e.key === 'Enter') {
                const finalReason = customReasonText.trim() || "Diskvalifisert av Crew";
                commitDisqualification(dqDialogPlayerIdx, finalReason);
            } else if (e.key === 'Backspace') {
                customReasonText = customReasonText.slice(0, -1);
            } else if (e.key.length === 1 && customReasonText.length < 35) {
                customReasonText += e.key;
            }
        }
    }

    if (showLanguageSelectorModal) {
        const langKeys = ['sv', 'no', 'en'];

        if (e.key === 'ArrowUp') {
            langModalSelectedIndex = (langModalSelectedIndex + 2) % 3;
            return;
        }
        if (e.key === 'ArrowDown') {
            langModalSelectedIndex = (langModalSelectedIndex + 1) % 3;
            return;
        }
        if (e.key === 'Enter' || e.key === ' ') {
            toggleLanguage(langKeys[langModalSelectedIndex]);
            showLanguageSelectorModal = false;
            return;
        }
        return;
    }

    if (e.key === 'l' || e.key === 'L') {
        toggleLanguage();
        return;
    }

    if (isControllerCheckActive) {
    if (e.key === "1") registerControllerPress(0);
    if (e.key === "2") registerControllerPress(1);
    if (e.key === "3") registerControllerPress(2);
    if (e.key === "4") registerControllerPress(3);
    return;
}

    if (gameState === "MENU") {
        if (e.key === 'F1') {
    e.preventDefault();
    window.open('regler_bomb.html', 'PolarPartyRegler', 'width=1000,height=750');
}
        if (e.key === '1') gameMode = "CLASSIC";
        if (e.key === '2') gameMode = "SUDDEN";
        if (e.key === '3') gameMode = "SPEED";
        if (e.key === 't' || e.key === 'T') useTimer = !useTimer;
        if (e.key === 'k' || e.key === 'K') {
            useApiQuestions = !useApiQuestions;
            if (useApiQuestions) fetchApiQuestions();
            else activeQuestions = [...LOCAL_QUESTIONS];
        }

        // Växla svårighetsgrad med S
        if (e.key === 's' || e.key === 'S') {
            const diffs = ["EASY", "NORMAL", "HARD", "EXTREME"];
            let idx = (diffs.indexOf(selectedDifficulty) + 1) % diffs.length;
            selectedDifficulty = diffs[idx];
        }

        // Justera antal frågor per runda med Q (10 -> 20 -> 30 -> 40 -> 50)
        if (e.key === 'q' || e.key === 'Q') {
            questionCountTarget += 10;
            if (questionCountTarget > 50) questionCountTarget = 10;
        }

        

        // Växla Liv-läge på/av med H (Hearts)
        if (e.key === 'h' || e.key === 'H') {
            useLives = !useLives;
        }
        if (e.key === 'Enter') startQuiz();
    } else // I spelets aktiva skede:
    if (gameState === "PLAYING" && gameMode !== "BOMB") {
        // Alternativ A: 1, NumPad 1, A, Vänsterpil[cite: 1]
        if (['1', 'a', 'A', 'ArrowLeft', 'Numpad1'].includes(e.key)) selectAnswer(0);
        // Alternativ B: 2, NumPad 2, B, Uppil[cite: 1]
        if (['2', 'b', 'B', 'ArrowUp', 'Numpad2'].includes(e.key)) selectAnswer(1);
        // Alternativ C: 3, NumPad 3, C, Nedpil[cite: 1]
        if (['3', 'c', 'C', 'ArrowDown', 'Numpad3'].includes(e.key)) selectAnswer(2);
        // Alternativ D: 4, NumPad 4, D, Högerpil[cite: 1]
        if (['4', 'd', 'D', 'ArrowRight', 'Numpad4'].includes(e.key)) selectAnswer(3);
        
        // Mellanslag eller H: Begär Google-ledtråd
        if (e.key === ' ' || e.key === 'h' || e.key === 'H') {
            if (typeof requestGoogleClue === 'function') requestGoogleClue();
        }
    }
    else if (gameState === "PLAYING" && gameMode === "BOMB") {
    // -------------------------------------------------------------
    // SPELARE 1: F1 - F4 (Översta raden vänster)
    // -------------------------------------------------------------
    const p1FuncKeys = { "F1": 0, "F2": 1, "F3": 2, "F4": 3 };
    if (p1FuncKeys[e.key] !== undefined) {
        e.preventDefault(); // Hindrar t.ex. Windows/webbläsarens Hjälp-meny på F1
        handleMultiplayerAnswer(p1FuncKeys[e.key], 0);
        return;
    }

    // -------------------------------------------------------------
    // SPELARE 2: Sifferraden 1 - 4 (Mitten vänster)
    // -------------------------------------------------------------
    const p2NumberKeys = { "1": 0, "2": 1, "3": 2, "4": 3 };
    if (p2NumberKeys[e.key] !== undefined && e.code.startsWith("Digit")) {
        handleMultiplayerAnswer(p2NumberKeys[e.key], 1);
        return;
    }

    // -------------------------------------------------------------
    // SPELARE 3: Piltangenterna (Mitten / Navigationskluster)
    // -------------------------------------------------------------
    const p3ArrowKeys = { 
        "ArrowLeft": 0,  // A / Blå
        "ArrowUp": 1,    // B / Orange
        "ArrowDown": 2,  // C / Grön
        "ArrowRight": 3  // D / Gul
    };
    if (p3ArrowKeys[e.key] !== undefined) {
        e.preventDefault(); // Hindrar sidan från att scrolla
        handleMultiplayerAnswer(p3ArrowKeys[e.key], 2);
        return;
    }

    // -------------------------------------------------------------
    // SPELARE 4: Numpad 1 - 4 ELLER F5 - F8 (Valfri högerzon)
    // -------------------------------------------------------------
    // Alternativ A: Numpad-siffrorna
    const p4NumpadKeys = { 
        "Numpad1": 0, 
        "Numpad2": 1, 
        "Numpad3": 2, 
        "Numpad4": 3 
    };
    if (p4NumpadKeys[e.code] !== undefined) {
        handleMultiplayerAnswer(p4NumpadKeys[e.code], 3);
        return;
    }

    // Alternativ B: F5 - F8
    const p4FuncKeys = { "F5": 0, "F6": 1, "F7": 2, "F8": 3 };
    if (p4FuncKeys[e.key] !== undefined) {
        e.preventDefault(); // Hindrar F5 från att ladda om spelet!
        handleMultiplayerAnswer(p4FuncKeys[e.key], 3);
        return;
    }
    }
    
    else if (gameState === "GAMEOVER") {
        if (e.key === 'Enter' || e.key === 'Escape') gameState = "MENU";
    }

    // =========================================================================
    // 📺 SMART TV-FJÄRRKONTROLL (ANSLUTEN TILL PC VIA USB/BLUETOOTH)
    // =========================================================================
    // Back / Exit -> Ledtråd
    if (e.key === "Backspace" || e.key === "Escape" || e.key === "BrowserBack" || e.keyCode === 10009) {
        if (gameState === "PLAYING") {
            if (typeof requestGoogleClue === 'function') requestGoogleClue();
            return;
        }
    }

    // Appknappar på PC-fjärrkontroller (Netflix / YouTube / App-tangenter)
    if (e.key === "LaunchApplication1" || e.key === "LaunchApplication2" || e.keyCode === 10071 || e.keyCode === 461) {
        e.preventDefault();
        const tvQuotes = [
            "🔧 GÖRAN: 'Ingen Netflix på arbetstid! Här felsöker vi tändstift!'",
            "🧙‍♂️ KAMEK: 'NYEHE! Du kan inte pausa mitt prov med en streamingknapp!'",
            "🐕 DUCK HUNT DOG: 'Voff! Du försökte byta kanal mitt i frågan?!'"
        ];
        activeClueText = tvQuotes[Math.floor(Math.random() * tvQuotes.length)];
        return;
    }
});

// 📡 TELIA REALTIME DIAGNOSTICS & SYSTEM SPÄRR
// =========================================================================
const TeliaSystemDiagnostics = (function() {
    let fps = 60;
    let frameCount = 0;
    let lastFpsCalc = performance.now();
    let lowFpsStreak = 0;

    let pingMs = 35;
    let lastPingCheck = 0;
    let highPingStreak = 0;

    let batteryLevel = 1.0;
    let isCharging = true;
    let batterySupported = false;

    let networkType = "4g";
    let isSlowConnection = false;
    let memoryWarning = false;

    let activeWarning = null; // Visas i toppen
    let isCriticalLock = false;
    let criticalReason = "";

    // Textbank för realtidsvarningar och kritiska låsningar
    const DIAG_TEXTS = {
        sv: {
