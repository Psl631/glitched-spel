            CRIT_BATTERY: {
                title: "KRITISKT LÅG BATTERINIVÅ",
                desc: "TELIA ENERGILÄGE: Batteriet har sjunkit till under 5% (%BAT%%)! Telefonen/datorn riskerar att dö mitt i en fråga. Ladda enheten för att få spela!"
            },
            CRIT_FPS: {
                title: "KRITISKT PRESTANDAFALL (POTATIS-HÅRDVARA)",
                desc: "TELIA DIAGNOSTIK: Bildfrekvensen har kraschat under 12 FPS! Din enhet överhettas eller kör för tunga bakgrundsprocesser för att hinna svara på tid."
            },
            CRIT_PING: {
                title: "EXTREM LATENS / NÄTVERKSHA Havererat",
                desc: "TELIA NÄTDRIFT: Pingen rusade till %PING% ms! Det tar längre tid för signalen att nå dig än ett brev med Postnord. Spärrad mot lagg-fusk!"
            },
            CRIT_OFFLINE: {
                title: "INGEN INTERNETANSLUTNING",
                desc: "TELIA FELMEDDELANDE: Uppkopplingen bröts fullständigt! Sladden har dragits ur eller Wi-Fi-routern har packat ihop."
            }
        },
        en: {
            warnBattery: "⚠️ TELIA WARNING: Low battery (%BAT%%)! Plug in charger!",
            warnFps: "⚠️ PERFORMANCE WARNING: Low frame rate (%FPS% FPS)! Close background tabs!",
            warnPing: "⚠️ LATENCY WARNING: High network jitter (%PING% ms)!",
            warnNet: "⚠️ POOR CONNECTION: Network degraded to %TYPE%!",
            warnMem: "⚠️ MEMORY WARNING: Browser tab is running out of RAM!",

            CRIT_BATTERY: {
                title: "CRITICALLY DEPLETED BATTERY",
                desc: "TELIA POWER SAVER: Battery fallen below 5% (%BAT%%)! Device is about to power down. Plug in charger to continue!"
            },
            CRIT_FPS: {
                title: "CRITICAL HARDWARE LAG (UNPLAYABLE)",
                desc: "TELIA DIAGNOSTICS: Refresh rate plunged under 12 FPS! Extreme throttling detected. Quiz halted to preserve fairness."
            },
            CRIT_PING: {
                title: "EXTREME NETWORK LATENCY",
                desc: "TELIA NETWORK OPS: Latency exceeded %PING% ms! Packet delivery stalled. Blocked against connection manipulation!"
            },
            CRIT_OFFLINE: {
                title: "NO INTERNET CONNECTION",
                desc: "TELIA SERVICE ALERT: Device is completely offline! Network cable disconnected or Wi-Fi gateway unresponsive."
            }
        },
        no: {
            warnBattery: "⚠️ TELIA ADVARSEL: Lavt batterinivå (%BAT%%)! Plugg inn laderen snarest!",
            warnFps: "⚠️ YTELSE-ADVARSEL: Lav bildefrekvens (%FPS% FPS)! Lukk bakgrunnsapper!",
            warnPing: "⚠️ NETTVERKSADVARSEL: Høy forsinkelse mot serveren (%PING% ms)!",
            warnNet: "⚠️ SVAKT INTERNETT: Tilkoblingen er degradert (%TYPE%)!",
            warnMem: "⚠️ RAM-ADVARSEL: Nettleserens fane er i ferd med å gå tom for minne!",

            CRIT_BATTERY: {
                title: "KRITISK LAVT BATTERINIVÅ",
                desc: "TELIA STRØMSPARING: Batteriet har falt under 5% (%BAT%%)! Enheten risikerer å slå seg av midt under et spørsmål. Lad enheten for å spille!"
            },
            CRIT_FPS: {
                title: "KRITISK YTELSESTAP (POTET-MASKINVARE)",
                desc: "TELIA DIAGNOSTIKK: Bildefrekvensen har krasjet under 12 FPS! Enheten din overopphetes eller kjører for tunge bakgrunnsprosesser."
            },
            CRIT_PING: {
                title: "EKSTREM FORSINKELSE / NETTVERKSHAVARI",
                desc: "TELIA NETTDRIFT: Pingen føk opp til %PING% ms! Det tar lenger tid for signalet å nå deg enn en pakke med Posten. Spærret mot lagg-juks!"
            },
            CRIT_OFFLINE: {
                title: "INGEN INTERNETT-TILKOBLING",
                desc: "TELIA FEILMELDING: Tilkoblingen ble brutt fullstendig! Nettverkskabelen er dratt ut eller Wi-Fi-ruteren har tatt kvelden."
            },
            restartBtn: "🔄 START REGISTRERINGEN PÅ NYTT",
            actionAdvice: "Løs problemet og klikk hvor som helst på skjermen for å starte prøven på nytt."
        }
    };

    // 1. Initialisera batteriövervakning
    if (navigator.getBattery) {
        navigator.getBattery().then(batt => {
            batterySupported = true;
            batteryLevel = batt.level;
            isCharging = batt.charging;

            batt.addEventListener('levelchange', () => { batteryLevel = batt.level; });
            batt.addEventListener('chargingchange', () => { isCharging = batt.charging; });
        }).catch(() => {});
    }

    // 2. Initialisera nätverksövervakning
    const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
    if (conn) {
        const checkConn = () => {
            networkType = conn.effectiveType || "4g";
            isSlowConnection = (networkType === "slow-2g" || networkType === "2g" || (conn.downlink && conn.downlink < 0.5));
        };
        conn.addEventListener('change', checkConn);
        checkConn();
    }

    // 3. Kontrollera offline/online
    window.addEventListener('offline', () => {
        TeliaSystemDiagnostics.triggerCritical("CRIT_OFFLINE");
    });

    // 4. Ping-mätare (simulerad eller mot ping-fil/favicon)
    function measurePing() {
        const start = performance.now();
        const testImg = new Image();
        testImg.src = "telia.png?t=" + start;
        testImg.onload = testImg.onerror = () => {
            pingMs = Math.round(performance.now() - start);
        };
    }

    return {
        update: function() {
            if (isCriticalLock) return;

            const now = performance.now();
            frameCount++;

            // Beräkna FPS varje sekund
            if (now - lastFpsCalc >= 1000) {
                fps = Math.round((frameCount * 1000) / (now - lastFpsCalc));
                frameCount = 0;
                lastFpsCalc = now;

                // FPS-kontroll
                if (fps < 24) lowFpsStreak++;
                else lowFpsStreak = Math.max(0, lowFpsStreak - 1);

                // Kritisk FPS-spärr (under 12 FPS under 3 sekunder i rad)
                if (lowFpsStreak >= 3 && gameState === "PLAYING") {
                    this.triggerCritical("CRIT_FPS");
                    return;
                }
            }

            // Mät ping var 4:e sekund
            if (now - lastPingCheck >= 4000) {
                lastPingCheck = now;
                measurePing();

                if (pingMs > 450) highPingStreak++;
                else highPingStreak = Math.max(0, highPingStreak - 1);

                // Kritisk Ping-spärr (över 1200 ms under 2 kontroller)
                if (pingMs > 1200 && highPingStreak >= 2 && gameState === "PLAYING") {
                    this.triggerCritical("CRIT_PING");
                    return;
                }
            }

            // Minneskontroll (Chromium)
            if (performance.memory) {
                const used = performance.memory.usedJSHeapSize;
                const limit = performance.memory.jsHeapSizeLimit;
                memoryWarning = (used / limit > 0.88);
            }

            // Kritisk Batterinivå: under 5% och laddar inte
            if (batterySupported && !isCharging && batteryLevel <= 0.14 && gameState === "PLAYING") {
                this.triggerCritical("CRIT_BATTERY");
                return;
            }

            // Sätt dynamisk icke-kritisk varning i toppen
            const lang = currentLang === 'en' ? 'en' : 'sv';
            const tPack = DIAG_TEXTS[lang];

            if (batterySupported && !isCharging && batteryLevel <= 0.25) {
                activeWarning = tPack.warnBattery.replace("%BAT%", Math.round(batteryLevel * 100));
            } else if (fps < 24) {
                activeWarning = tPack.warnFps.replace("%FPS%", fps);
            } else if (pingMs > 450) {
                activeWarning = tPack.warnPing.replace("%PING%", pingMs);
            } else if (isSlowConnection) {
                activeWarning = tPack.warnNet.replace("%TYPE%", networkType.toUpperCase());
            } else if (memoryWarning) {
                activeWarning = tPack.warnMem;
            } else {
                activeWarning = null;
            }
        },

        triggerCritical: function(reasonKey) {
            isCriticalLock = true;
            criticalReason = reasonKey;
            try { new Audio('windows_error.wav').play().catch(() => {}); } catch(e) {}
        },

        isLocked: function() {
            return isCriticalLock;
        },

        drawHUD: function(ctx, w) {
            // Ritar den pulserande varningen i överkant under spelet om något haltar
            if (!activeWarning || isCriticalLock) return;

            ctx.save();
            const pulse = Math.floor(Date.now() / 300) % 2 === 0;
            ctx.fillStyle = pulse ? "rgba(220, 38, 38, 0.95)" : "rgba(234, 88, 12, 0.95)";
            ctx.fillRect(0, 0, w, 24);

            ctx.strokeStyle = "#ffd600";
            ctx.lineWidth = 1;
            ctx.strokeRect(0, 0, w, 24);

            ctx.textAlign = "center";
            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 11px sans-serif";
            ctx.fillText(activeWarning, w / 2, 16);
            ctx.restore();
        },

        drawCriticalScreen: function(ctx, w, h) {
            if (!isCriticalLock) return;

            const lang = currentLang === 'en' ? 'en' : 'sv';
            const pack = DIAG_TEXTS[lang];
            const reasonData = pack[criticalReason] || pack.CRIT_OFFLINE;

            ctx.save();
            ctx.setTransform(1, 0, 0, 1, 0, 0);

            // Mörk Telia-lila spärrbakgrund
            ctx.fillStyle = "#120422";
            ctx.fillRect(0, 0, w, h);

            // Varningsram
            const isPulse = Math.floor(Date.now() / 200) % 2 === 0;
            ctx.strokeStyle = isPulse ? "#ff1744" : "#ffd600";
            ctx.lineWidth = 4;
            ctx.strokeRect(16, 16, w - 32, h - 32);

            ctx.textAlign = "center";

            // Telia-logotyp (Bevarar korrekt bildförhållande / aspect ratio)
            const teliaImg = new Image();
            teliaImg.src = 'telia.png';
            if (teliaImg.complete && teliaImg.naturalWidth > 0) {
                const maxW = 180;
                const maxH = 80;
                const ratio = teliaImg.naturalWidth / teliaImg.naturalHeight;
                
                let imgW = maxW;
                let imgH = imgW / ratio;

                if (imgH > maxH) {
                    imgH = maxH;
                    imgW = imgH * ratio;
                }

                ctx.drawImage(teliaImg, (w - imgW) / 2, 35, imgW, imgH);
            }

            // Rubrik
            ctx.fillStyle = "#ff1744";
            ctx.font = "bold 18px 'arial', sans-serif";
            ctx.fillText(reasonData.title, w / 2, 140);

            // Meddelanderuta
            const boxW = Math.min(w - 40, 680);
            const boxH = 150;
            const boxX = (w - boxW) / 2;
            const boxY = 165;

            ctx.fillStyle = "#1e0836";
            ctx.fillRect(boxX, boxY, boxW, boxH);
            ctx.strokeStyle = "#ffd600";
            ctx.lineWidth = 2;
            ctx.strokeRect(boxX, boxY, boxW, boxH);

            // Ersätt variabler i texten
            let rawDesc = reasonData.desc
                .replace("%BAT%", Math.round(batteryLevel * 100))
                .replace("%PING%", pingMs);

let currentLedColor = { r: 0, g: 0, b: 0, intensity: 0 };

function triggerHapticFeedback(patternType) {
    // 1. Mobil enhet via Vibration API
    if (navigator.vibrate) {
        if (patternType === "WRONG") {
            navigator.vibrate([180, 80, 220]); // bzzt-bzzt
        } else if (patternType === "URGENT_TICK") {
            navigator.vibrate(40); // Litet hjärtslag/ryck
        }
        // "CORRECT" ger ingenting enligt önskemål
    }

    // 2. Ansluten gamepad via Gamepad API (vibrationActuator / playEffect)
    if (navigator.getGamepads) {
        const gamepads = navigator.getGamepads();
        for (let i = 0; i < gamepads.length; i++) {
            const gp = gamepads[i];
            if (!gp || !gp.connected) continue;

            if (gp.vibrationActuator && gp.vibrationActuator.playEffect) {
                if (patternType === "WRONG") {
                    gp.vibrationActuator.playEffect("dual-rumble", {
                        startDelay: 0,
                        duration: 180,
                        weakMagnitude: 0.8,
                        strongMagnitude: 1.0
                    }).then(() => {
                        setTimeout(() => {
                            gp.vibrationActuator.playEffect("dual-rumble", {
                                startDelay: 0,
                                duration: 220,
                                weakMagnitude: 0.9,
                                strongMagnitude: 1.0
                            });
                        }, 70);
                    }).catch(() => {});
                } else if (patternType === "URGENT_TICK") {
                    gp.vibrationActuator.playEffect("dual-rumble", {
                        startDelay: 0,
                        duration: 50,
                        weakMagnitude: 0.35,
                        strongMagnitude: 0.1
                    }).catch(() => {});
                }
            }

            // 3. PS4/PS5 DualShock/DualSense fysisk LED-ljuslist
            if (gp.lightbar && gp.lightbar.setColor) {
                if (patternType === "CORRECT") gp.lightbar.setColor({ red: 0, green: 255, blue: 0 });
                else if (patternType === "WRONG") gp.lightbar.setColor({ red: 255, green: 0, blue: 0 });
                else if (patternType === "URGENT_TICK") gp.lightbar.setColor({ red: 255, green: 140, blue: 0 });
            }
        }
    }
}

function drawSingle7SegmentDigit(ctx, char, x, y, w, h, palette) {
    const segs = SEGMENT_MAP[char] || SEGMENT_MAP[' '];
    const t = Math.max(2, Math.floor(w * 0.18));
    const halfH = h / 2;

    const definitions = [
        [[x + t, y], [x + w - t, y], [x + w - t * 1.5, y + t], [x + t * 1.5, y + t]],
        [[x + w, y + t], [x + w, y + halfH - t * 0.5], [x + w - t, y + halfH - t * 0.2], [x + w - t, y + t * 1.5]],
        [[x + w, y + halfH + t * 0.5], [x + w, y + h - t], [x + w - t, y + h - t * 1.5], [x + w - t, y + halfH + t * 0.2]],
        [[x + t, y + h], [x + w - t, y + h], [x + w - t * 1.5, y + h - t], [x + t * 1.5, y + h - t]],
        [[x, y + halfH + t * 0.5], [x, y + h - t], [x + t, y + h - t * 1.5], [x + t, y + halfH + t * 0.2]],
        [[x, y + t], [x, y + halfH - t * 0.5], [x + t, y + halfH - t * 0.2], [x + t, y + t * 1.5]],
        [[x + t * 1.2, y + halfH - t * 0.5], [x + w - t * 1.2, y + halfH - t * 0.5], 
         [x + w - t * 0.6, y + halfH], [x + w - t * 1.2, y + halfH + t * 0.5], 
         [x + t * 1.2, y + halfH + t * 0.5], [x + t * 0.6, y + halfH]]
    ];

    for (let i = 0; i < 7; i++) {
        const poly = definitions[i];
        const isActive = segs[i] === 1;

        ctx.beginPath();
        ctx.moveTo(poly[0][0], poly[0][1]);
        for (let p = 1; p < poly.length; p++) {
            ctx.lineTo(poly[p][0], poly[p][1]);
        }
        ctx.closePath();

        if (isActive) {
            ctx.shadowColor = palette.glow;
            ctx.shadowBlur = 8;
            ctx.fillStyle = palette.on;
            ctx.fill();
            ctx.shadowBlur = 0;
        } else {
            ctx.fillStyle = palette.off;
            ctx.fill();
        }
    }
}

function draw7SegmentDisplay(ctx, str, x, y, digitW, digitH, paletteName = "RED", align = "left") {
    const palette = LED_PALETTES[paletteName] || LED_PALETTES.RED;
    const spacing = Math.floor(digitW * 0.25);
    const textStr = String(str).toUpperCase();

    let totalW = 0;
    for (let c of textStr) {
        if (c === '.') totalW += Math.floor(digitW * 0.4);
        else if (c === ':') totalW += Math.floor(digitW * 0.45);
        else totalW += digitW + spacing;
    }
    totalW -= spacing;

    let startX = x;
    if (align === "right") startX = x - totalW;
    else if (align === "center") startX = x - (totalW / 2);

    const pad = 5;
    ctx.save();
    ctx.fillStyle = "rgba(4, 6, 12, 0.95)";
    ctx.fillRect(startX - pad, y - pad, totalW + pad * 2, digitH + pad * 2);
    ctx.strokeStyle = "rgba(255, 255, 255, 0.12)";
    ctx.lineWidth = 1.5;
    ctx.strokeRect(startX - pad, y - pad, totalW + pad * 2, digitH + pad * 2);

    let curX = startX;
    for (let i = 0; i < textStr.length; i++) {
        const char = textStr[i];

        if (char === '.') {
            const dotSize = Math.max(3, digitH * 0.14);
            ctx.beginPath();
            ctx.arc(curX + dotSize, y + digitH - dotSize, dotSize / 2, 0, Math.PI * 2);
            ctx.fillStyle = palette.on;
            ctx.shadowColor = palette.glow;
            ctx.shadowBlur = 6;
            ctx.fill();
            ctx.shadowBlur = 0;
            curX += Math.floor(digitW * 0.4);
        } 
        else if (char === ':') {
            // ⏰ Blinkande digitalurs-kolon (två vertikala prickar)
            const dotSize = Math.max(3, Math.floor(digitH * 0.12));
            const colonW = Math.floor(digitW * 0.45);
            const dotX = curX + colonW / 2;
            const dotY1 = y + Math.floor(digitH * 0.32);
            const dotY2 = y + Math.floor(digitH * 0.68);

            ctx.fillStyle = palette.on;
            ctx.shadowColor = palette.glow;
            ctx.shadowBlur = 6;

            ctx.beginPath();
            ctx.arc(dotX, dotY1, dotSize / 2, 0, Math.PI * 2);
            ctx.arc(dotX, dotY2, dotSize / 2, 0, Math.PI * 2);
            ctx.fill();

            ctx.shadowBlur = 0;
            curX += colonW;
        } 
        else {
            drawSingle7SegmentDigit(ctx, char, curX, y, digitW, digitH, palette);
            curX += digitW + spacing;
        }
    }
    ctx.restore();
}

function update() {
    if (KamekAntiCheat.isTriggered()) return; // Frys all spellogik och timers
    TeliaSystemDiagnostics.update();
    if (checkChromecastViolation()) return;
    if (TeliaSystemDiagnostics.isLocked()) return; // Frys spelet vid kritisk nätverks-/batterikrasch
    if (isTournamentPaused) return;
    pollAllGamingAccessories();
    if (lostHeartAnimTimer > 0) lostHeartAnimTimer--;

    // 💀 DÖDSSEKVENS-ÖVERGÅNG
    if (deathSequence.active) {
        deathSequence.timer++;

        // Fas 1 (Frame 0–45): Hjärtat blinkar, spelet fryser
        // Fas 2 (Frame 45–105): Tonas ned till helsvart (1 sekund)
        if (deathSequence.timer > 45 && deathSequence.timer <= 105) {
            deathSequence.blackAlpha = (deathSequence.timer - 45) / 60;
        }

        // Fas 3 (Frame 105+): Byt till faktiskt GAMEOVER och tona fram Game Over-skärmen
        if (deathSequence.timer > 105) {
            gameState = "GAMEOVER";
            if (deathSequence.gameOverAlpha < 1.0) {
                deathSequence.gameOverAlpha += 0.025; // Mjuk framtoning
            }
        }
        return; // Stoppa övriga timers under animationen
    }

    if (isControllerCheckActive) {
        if (controllerCheckCountdown > 0) {
            controllerCheckCountdown--;
            if (controllerCheckCountdown === 0) {
                isControllerCheckActive = false;
                startQuiz(); // Startar matchen med bevarat gameMode och 2-4 spelare
            }
        }
        return; // Blockera övrig speluppdatering tills testet är helt klart
    }

    if (gameState === "PLAYING" && gameMode === "BOMB") {
        bombTimer -= (1 / 60);

        // 🚨 NÄR TIDEN ÄR KRITISK (< 4.5 sekunder)
        if (bombTimer <= 4.5 && bombTimer > 0) {
            // Skaka skärmen och öka skakningen ju närmare 0 man kommer
            screenShake = Math.max(screenShake, (4.5 - bombTimer) * 1.6);

            // Intervall för tickandet:
            // 4.5s - 2.5s: Var 16:e frame (~4 ggr/sek)
            // 2.5s - 1.0s: Var 8:e frame (~7.5 ggr/sek)
            // < 1.0s:      Var 4:e frame (15 ggr/sek - extrem panik)
            let tickFrameInterval = 16;
            if (bombTimer < 1.0) {
                tickFrameInterval = 4;
            } else if (bombTimer < 2.5) {
                tickFrameInterval = 8;
            }

            if (Math.floor(Date.now() / (tickFrameInterval * 16.6)) % 2 === 0 && Math.random() < 0.35) {
                playUrgentBombTick(bombTimer);
                triggerHapticFeedback("URGENT_TICK");
            }
        }

        if (bombTimer <= 0) {
            bombTimer = 0;
            handleBombExplosion();
        }
    }

    if (gameState === "PLAYING" && useTimer) {
        questionTimer -= (1 / 60);

        // -----------------------------------------------------------------
        // DYNAMISK TICK-FREKVENS (sekunder):
        // > 6 sek: 1 tick/sekund (800 Hz)
        // 3 - 6 sek: 2 tick/sekund (1100 Hz)
        // < 3 sek: 4 tick/sekund (1600 Hz, intensiv larm-puls)
        // -----------------------------------------------------------------
        tickSubCounter++;

        if (questionTimer > 6) {
            const currentSec = Math.floor(questionTimer);
            if (currentSec !== lastTickSec) {
                lastTickSec = currentSec;
                playClockTick(850, 0.03, false);
            }
        } else if (questionTimer > 3) {
            if (tickSubCounter % 30 === 0) {
                playClockTick(1150, 0.04, false);
            }
        } else if (questionTimer > 0) {
            if (tickSubCounter % 15 === 0) {
                playClockTick(1600, 0.05, true);
                triggerHapticFeedback("URGENT_TICK"); // 📳 Haptisk puls vid ont om tid!
            }
        }

    // 1. Kör ALLTID partikelanimering och borttagning
    for (let i = bombExplosionParticles.length - 1; i >= 0; i--) {
        const p = bombExplosionParticles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.25;
        p.alpha -= p.decay;
        if (p.alpha <= 0) {
            bombExplosionParticles.splice(i, 1);
        }
    }

    // 2. Kör ALLTID hjärtblink och visuella effekttimers
    if (lostHeartAnimTimer > 0) lostHeartAnimTimer--;
    for (let i = 0; i < playerCount; i++) {
        if (players[i] && players[i].lostHeartTimer > 0) {
            players[i].lostHeartTimer--;
        }
    }

        if (questionTimer <= 0) {
            questionTimer = 0;
            feedbackStatus = "TIMEOUT";
            const stillAlive = handleMistake(true);
            if (stillAlive && !deathSequence.active) {
                gameState = "FEEDBACK";
                feedbackTimer = 90;
            }
        }
    } else if (gameState === "FEEDBACK") {
        feedbackTimer--;
        if (feedbackTimer <= 0) {
            loadQuestion(currentQuestionIdx + 1);
            if (gameState !== "GAMEOVER") gameState = "PLAYING";
        }
    }
}

function wrapText(context, text, maxWidth) {
    if (!text) return [];
    const words = text.split(" ");
    const lines = [];
    let currentLine = words[0] || "";

    for (let i = 1; i < words.length; i++) {
        const word = words[i];
        const width = context.measureText(currentLine + " " + word).width;
        if (width < maxWidth) {
            currentLine += " " + word;
        } else {
            lines.push(currentLine);
            currentLine = word;
        }
    }
    if (currentLine) {
        lines.push(currentLine);
    }
    return lines;
}


// Hittar nästa levande spelare i bombcirkeln
function passBombToNextPlayer() {
    const activeMatchPlayers = players.slice(0, playerCount);
    const alivePlayers = activeMatchPlayers.filter(p => !p.isEliminated);

    // Om 1 eller 0 spelare återstår, avsluta matchen
    if (alivePlayers.length <= 1) {
        calculateEvaluation();
        gameState = "GAMEOVER";
        return;
    }

    // Rulla fram till nästa spelare som inte är utslagen
    let nextIdx = (activeBombPlayer + 1) % playerCount;
    while (players[nextIdx].isEliminated) {
        nextIdx = (nextIdx + 1) % playerCount;
    }

    activeBombPlayer = nextIdx;
    loadQuestion((currentQuestionIdx + 1) % activeQuestions.length);
}

function handleBombExplosion() {
    // 💥 Spela ljudfilen explosion.mp3 direkt vid detonation
    playExplosionSound();

    // Kraftig skärmskakning
    screenShake = 18.0;

    const pBoxW = canvas.width / playerCount;
    const pCenterX = activeBombPlayer * pBoxW + pBoxW / 2;
    const pCenterY = 40;
    spawnBombExplosion(pCenterX, pCenterY);

    const victim = players[activeBombPlayer];
    victim.lives--;
    screenShake = 18;
    victim.lostHeartTimer = 45;

    if (victim.lives <= 0) {
        victim.isEliminated = true;
        eliminatedOrder.push(victim); // Sparar vem som åkte ut först/sist
        const quotePool = KAMEK_ELIMINATION_QUOTES[currentLang] || KAMEK_ELIMINATION_QUOTES.en;
            try {
                const snd = new Audio('kamek.mp3');
                snd.volume = 1.0;
                snd.play().catch(() => {});
            } catch (e) {}

            const targetP = (typeof players !== 'undefined' && players[activeBombPlayer]) ? players[activeBombPlayer] : null;
const isPlayerDQ = Boolean(targetP && targetP.isDQ) || Boolean(kamekBubble && kamekBubble.isDQ);

            // Starta pratbubblan
            kamekBubble.active = true;
            kamekBubble.timer = isPlayerDQ ? 900 : 420; // 900 frames (~15 sek) vid DQ, annars 420 (~7 sek)
            kamekBubble.playerIdx = activeBombPlayer;
            
kamekBubble.text = quotePool[Math.floor(Math.random() * quotePool.length)];

    }

    const alive = players.slice(0, playerCount).filter(p => !p.isEliminated);
    if (alive.length <= 1) {
        const winner = alive[0] || victim;
        // Placering: Vinnaren först, därefter de utslagna i omvänd ordning (den som åkte ut sist blir 2:a osv)
        finalStandings = [winner, ...eliminatedOrder.slice().reverse()];

        deathSequence.active = false;
        deathSequence.gameOverAlpha = 1.0;
        deathSequence.reason = "BOMB_END";
        gameState = "GAMEOVER";

        calculateBombRankings(winner);
        try { new Audio('win.mp3').play().catch(() => {}); } catch(e) {}
        return;
    }

    if (bombStartTimeSetting === "RANDOM_15_30" || bombStartTimeSetting === "BLIND") {
        bombTimer = +(15 + Math.random() * 15).toFixed(1);
    } else {
        bombTimer = typeof bombStartTimeSetting === "number" ? bombStartTimeSetting : 15.0;
    }
    passBombToNextPlayer();
    loadQuestion(currentQuestionIdx + 1);

function handleMultiplayerAnswer(ansIdx, playerIdx) {
    const q = activeQuestions[currentQuestionIdx];
    const isCorrect = (ansIdx === q.correct);

    if (playStyle === "ONLINE_CLIENT") {
        if (peerConnections[0] && peerConnections[0].open) {
            peerConnections[0].send({ type: "ANSWER_SUBMITTED", answerIdx: ansIdx });
        }
        return;
    }

    // =========================================================================
    // 💣 LÄGE: PASS THE BOMB
    // =========================================================================
    if (gameMode === "BOMB") {
        // Endast spelaren som håller i bomben får svara
        if (playerIdx !== activeBombPlayer) return;

        if (isCorrect) {
            playBombDing(); // 🔔 Ljus ding
            passBombToNextPlayer();
            loadQuestion(currentQuestionIdx + 1);
        } else {
            // Fel svar straffar timern med 2 sekunder
            playBombBoooop(); // 🚨 Djup BÖÖÖÖP
            bombTimer = Math.max(0.5, bombTimer - 2.0);
            try { new Audio('boooop.mp3').play().catch(() => {}); } catch(e) {}
            triggerHapticFeedback("WRONG");
            loadQuestion(currentQuestionIdx + 1);
        }
        return;
    }

    // =========================================================================
    // 🛡️ LÄGE: STEAL & SHIELD
    // =========================================================================
    if (gameMode === "STEAL_SHIELD") {
        const p = players[playerIdx];
        if (p.isEliminated) return;

        if (isCorrect) {
            try { new Audio('pling.mp3').play().catch(() => {}); } catch(e) {}
            // Varje rätt svar ger val: Stjäl 50p från ledaren eller aktivera sköld
            if (!p.shield) {
                p.shield = true;
                p.score += 50;
            } else {
                // Hitta ledaren och stjäl poäng om ledaren saknar sköld
                const opponents = players.slice(0, playerCount).filter((_, idx) => idx !== playerIdx && !_.isEliminated);
                opponents.sort((a, b) => b.score - a.score);
                if (opponents.length > 0 && opponents[0].score > 0) {
                    if (opponents[0].shield) {
                        opponents[0].shield = false; // Knäck skölden!
                    } else {
                        opponents[0].score = Math.max(0, opponents[0].score - 50);
                        p.score += 50;
                    }
                } else {
                    p.score += 100;
                }
            }
            loadQuestion(currentQuestionIdx + 1);
        } else {
            p.shield = false;
            p.score = Math.max(0, p.score - 30);
            try { new Audio('boooop.mp3').play().catch(() => {}); } catch(e) {}
        }
    }
}

function drawNetworkErrorVector(ctx, type, cx, cy) {
    ctx.save();
    ctx.lineCap = "round";
    ctx.lineJoin = "round";

    // =========================================================================
    // 🐌 1. CONNECTION_TIMED_OUT: Snigel med ironiska fartränder
    // =========================================================================
    if (type === "TIMEOUT" || type === "TIMED_OUT") {
        // Skalet (brun spiral)
        ctx.fillStyle = "#78350f";
        ctx.strokeStyle = "#f59e0b";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(cx - 6, cy - 4, 18, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        // Skalets inre mönster
        ctx.strokeStyle = "#fbbf24";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(cx - 6, cy - 4, 10, 0, Math.PI * 1.6);
        ctx.stroke();

        // Snigelkropp (grön gelé)
        ctx.fillStyle = "#10b981";
        ctx.strokeStyle = "#047857";
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.moveTo(cx - 34, cy + 12);
        ctx.quadraticCurveTo(cx + 8, cy + 13, cx + 20, cy + 6);
        ctx.lineTo(cx + 26, cy - 8); // Huvud
        ctx.lineTo(cx + 31, cy - 18); // Spröt 1
        ctx.moveTo(cx + 26, cy - 8);
        ctx.lineTo(cx + 22, cy - 18); // Spröt 2
        ctx.stroke();

        // Ögonglober på spröten
        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.arc(cx + 31, cy - 18, 3, 0, Math.PI * 2);
        ctx.arc(cx + 22, cy - 18, 3, 0, Math.PI * 2);
        ctx.fill();

        // Ironiska fartränder (visar hur "snabb" snigeln är)
        ctx.strokeStyle = "rgba(250, 204, 21, 0.7)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(cx - 42, cy - 8); ctx.lineTo(cx - 62, cy - 8);
        ctx.moveTo(cx - 38, cy + 2); ctx.lineTo(cx - 54, cy + 2);
        ctx.stroke();
    }
    // =========================================================================
    // 🔌 2. OFFLINE: Avbruten/avsliten nätverkskabel med gnistor och koppartrådar
    // =========================================================================
    else if (type === "OFFLINE") {
        // Vänster blå kabeldel
        ctx.strokeStyle = "#0284c7";
        ctx.lineWidth = 9;
        ctx.beginPath();
        ctx.moveTo(cx - 65, cy);
        ctx.lineTo(cx - 16, cy);
        ctx.stroke();

        // Höger blå kabeldel
        ctx.beginPath();
        ctx.moveTo(cx + 16, cy);
        ctx.lineTo(cx + 65, cy);
        ctx.stroke();

        // Frilagda spretiga koppartrådar (orange/gul/grön)
        ctx.lineWidth = 2;
        ctx.strokeStyle = "#f97316";
        ctx.beginPath();
        ctx.moveTo(cx - 16, cy); ctx.lineTo(cx - 6, cy - 7);
        ctx.moveTo(cx + 16, cy); ctx.lineTo(cx + 6, cy + 7);
        ctx.stroke();

        ctx.strokeStyle = "#eab308";
        ctx.beginPath();
        ctx.moveTo(cx - 16, cy); ctx.lineTo(cx - 5, cy + 7);
        ctx.moveTo(cx + 16, cy); ctx.lineTo(cx + 5, cy - 7);
        ctx.stroke();

        // Blixtrande elektrisk kortslutning i gapet
        const pulse = Math.floor(Date.now() / 120) % 2 === 0;
        ctx.fillStyle = pulse ? "#facc15" : "#ff0055";
        ctx.font = "bold 22px sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("⚡", cx, cy);
    }
    // =========================================================================
    // 📡 3. NAME_NOT_RESOLVED (DNS-FEL): Knäckt router med rök och larmdiod
    // =========================================================================
    else if (type === "NAME_NOT_RESOLVED") {
        // Routerchassi
        ctx.fillStyle = "#1e293b";
        ctx.fillRect(cx - 36, cy - 2, 72, 24);
        ctx.strokeStyle = "#64748b";
        ctx.lineWidth = 2;
        ctx.strokeRect(cx - 36, cy - 2, 72, 24);

        // Vänster rak antenn
        ctx.strokeStyle = "#94a3b8";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(cx - 22, cy - 2);
        ctx.lineTo(cx - 28, cy - 22);
        ctx.stroke();

        // Höger knäckt antenn
        ctx.beginPath();
        ctx.moveTo(cx + 22, cy - 2);
        ctx.lineTo(cx + 26, cy - 12);
        ctx.lineTo(cx + 38, cy - 8);
        ctx.stroke();

        // Röd pulserande fel-LED på fronten
        const flash = Math.floor(Date.now() / 200) % 2 === 0;
        ctx.fillStyle = flash ? "#ef4444" : "#450a0a";
        ctx.beginPath();
        ctx.arc(cx - 24, cy + 10, 3.5, 0, Math.PI * 2);
        ctx.fill();

        // Rött kryss över routern
        ctx.strokeStyle = "#ef4444";
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(cx - 14, cy - 10); ctx.lineTo(cx + 14, cy + 18);
        ctx.moveTo(cx + 14, cy - 10); ctx.lineTo(cx - 14, cy + 18);
        ctx.stroke();
    }
    // =========================================================================
    // 💽 4. GENERIC / SERVERFEL: Repad CD-skiva med frågetecken
    // =========================================================================
    else {
        ctx.fillStyle = "#0f172a";
        ctx.strokeStyle = "#38bdf8";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(cx, cy, 22, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        // Innerhål
        ctx.fillStyle = "#1e293b";
        ctx.beginPath();
        ctx.arc(cx, cy, 7, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        // Spricka genom skivan
        ctx.strokeStyle = "#f43f5e";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(cx - 14, cy - 14);
        ctx.lineTo(cx - 2, cy - 2);
        ctx.lineTo(cx + 12, cy + 14);
        ctx.stroke();

        ctx.fillStyle = "#facc15";
        ctx.font = "bold 20px monospace";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("?", cx + 18, cy - 14);
    }

    ctx.restore();
}

let podiumParticles = [];

function launchPodiumEffects(rankedPlayers) {
    // rankedPlayers = Array med spelarobjekt sorterade från 1:a till 4:e plats
    // Varje spelare förväntas ha en skärmkoordinat på slutskärmen: (p.x, p.y)
    podiumParticles = [];

    rankedPlayers.forEach((player, rankIdx) => {
        const px = player.screenX || (canvas.width * (0.2 + rankIdx * 0.2));
        const py = player.screenY || (canvas.height * 0.6);

        // 1:A PLATS - CHAMPION CONFETTI (Guld, glitter, neon)
        if (rankIdx === 0) {
            const goldColors = ["#ffd700", "#ffae00", "#ffffff", "#00e5ff", "#ff007f"];
            for (let i = 0; i < 140; i++) {
                podiumParticles.push({
                    x: px, y: py,
                    vx: (Math.random() - 0.5) * 14,
                    vy: -(Math.random() * 12 + 6), // Skjuts högt upp
                    grav: 0.22,
                    size: Math.random() * 8 + 4,
                    color: goldColors[Math.floor(Math.random() * goldColors.length)],
                    rot: Math.random() * 360,
                    vRot: (Math.random() - 0.5) * 12,
                    type: "rect"
                });
            }
        }

        // 2:A PLATS - SILVER-GLITTER (Mindre gnistor i silver/vitt/blått)
        else if (rankIdx === 1) {
            const silverColors = ["#e0e0e0", "#ffffff", "#90caf9", "#b0bec5"];
            for (let i = 0; i < 70; i++) {
                podiumParticles.push({
                    x: px, y: py,
                    vx: (Math.random() - 0.5) * 9,
                    vy: -(Math.random() * 8 + 4),
                    grav: 0.2,
                    size: Math.random() * 5 + 3,
                    color: silverColors[Math.floor(Math.random() * silverColors.length)],
                    rot: Math.random() * 360,
                    vRot: (Math.random() - 0.5) * 8,
                    type: "star"
                });
            }
        }

        // 3:E PLATS - TRÖSTPARTIKLAR (Brons/koppar som snabbt faller)
        else if (rankIdx === 2) {
            const bronzeColors = ["#cd7f32", "#b87333", "#8c531b"];
            for (let i = 0; i < 35; i++) {
                podiumParticles.push({
                    x: px, y: py,
                    vx: (Math.random() - 0.5) * 6,
                    vy: -(Math.random() * 5 + 2), // Orkar knappt lyfta
                    grav: 0.25,
                    size: Math.random() * 4 + 2,
                    color: bronzeColors[Math.floor(Math.random() * bronzeColors.length)],
                    rot: 0,
                    vRot: 0,
                    type: "circle"
                });
            }
        }

        // 4:E PLATS (SIST) - SOT, ASKA OCH SORG (Grå rökpuffar och sotflagor)
        else if (rankIdx === 3) {
            for (let i = 0; i < 40; i++) {
                podiumParticles.push({
                    x: px + (Math.random() - 0.5) * 40,
                    y: py,
                    vx: (Math.random() - 0.5) * 3,
                    vy: -(Math.random() * 2 + 0.5), // Pyser långsamt uppåt som rök
                    grav: -0.02, // Negativ gravation = flyter upp
                    alpha: 0.8,
                    decay: Math.random() * 0.008 + 0.004,
                    size: Math.random() * 12 + 6,
                    color: Math.random() > 0.5 ? "#222222" : "#555555",
                    type: "smoke"
                });
            }
        }
    });
}

function updateAndDrawPodiumEffects() {
    for (let i = podiumParticles.length - 1; i >= 0; i--) {
        const p = podiumParticles[i];

        p.x += p.vx;
        p.y += p.vy;
        p.vy += p.grav;

        // Rökhantering för jumboplatsen
        if (p.type === "smoke") {
            p.alpha -= p.decay;
            p.size += 0.15; // Röken sväller
            if (p.alpha <= 0) {
                podiumParticles.splice(i, 1);
                continue;
            }
            ctx.save();
            ctx.globalAlpha = Math.max(0, p.alpha);
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
            continue;
        }

        // Ta bort partiklar som fallit utanför skärmen
        if (p.y > canvas.height + 50) {
            podiumParticles.splice(i, 1);
            continue;
        }

        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.fillStyle = p.color;

        if (p.type === "rect") {
            p.rot += p.vRot;
            ctx.rotate((p.rot * Math.PI) / 180);
            ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
        } else if (p.type === "star" || p.type === "circle") {
            ctx.beginPath();
            ctx.arc(0, 0, p.size / 2, 0, Math.PI * 2);
            ctx.fill();
        }

        ctx.restore();
    }
}

            ctx.moveTo(w / 2 - 40, iconY - 20); ctx.lineTo(w / 2 - 60, iconY - 20);
            ctx.stroke();

        } else if (apiErrorModal.errorType === "OFFLINE") {
            // 🔌⚡ TRASIG INTERNETKABEL vid OFFLINE
            const cx = w / 2;
            const cy = iconY - 12;

            // Vänster kabelända
            ctx.strokeStyle = "#0284c7";
            ctx.lineWidth = 8;
            ctx.lineCap = "round";
            ctx.beginPath();
            ctx.moveTo(cx - 70, cy);
            ctx.lineTo(cx - 16, cy);
            ctx.stroke();

            // Höger kabelända
            ctx.beginPath();
            ctx.moveTo(cx + 16, cy);
            ctx.lineTo(cx + 70, cy);
            ctx.stroke();

            // Frilagda koppartrådar
            ctx.strokeStyle = "#ea580c";
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(cx - 16, cy); ctx.lineTo(cx - 8, cy - 6);
            ctx.moveTo(cx - 16, cy); ctx.lineTo(cx - 8, cy + 6);
            ctx.moveTo(cx + 16, cy); ctx.lineTo(cx + 8, cy - 6);
            ctx.moveTo(cx + 16, cy); ctx.lineTo(cx + 8, cy + 6);
            ctx.stroke();

            // Blixt / Kortslutning i mitten
            ctx.font = "24px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText("⚡", cx, cy + 8);

        } else if (apiErrorModal.errorType === "NAME_NOT_RESOLVED") {
            // 📡💥 TRASIG ROUTER vid NAME_NOT_RESOLVED
            const cx = w / 2;
            const cy = iconY - 10;

            // Routerchassi
            ctx.fillStyle = "#1e293b";
            ctx.fillRect(cx - 40, cy, 80, 24);
            ctx.strokeStyle = "#64748b";
            ctx.lineWidth = 2;
            ctx.strokeRect(cx - 40, cy, 80, 24);

            // Antenner
            ctx.strokeStyle = "#94a3b8";
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(cx - 25, cy); ctx.lineTo(cx - 35, cy - 20);
            ctx.moveTo(cx + 25, cy); ctx.lineTo(cx + 35, cy - 20);
            ctx.stroke();

            // Röd blinkande larmdiod
            const pulse = Math.floor(Date.now() / 200) % 2 === 0;
            ctx.fillStyle = pulse ? "#ff1744" : "#450a0a";
            ctx.beginPath();
            ctx.arc(cx - 20, cy + 12, 4, 0, Math.PI * 2);
            ctx.fill();

            // Trasig explosion / kryss över routern
            ctx.font = "24px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText("💥", cx + 22, cy - 6);
        }

        // ---------------------------------------------------------------------
        // TEXTER OCH KNAPPAR
        // ---------------------------------------------------------------------
        ctx.textAlign = "center";
        ctx.fillStyle = "#ff1744";
        ctx.font = "bold 16px 'arial', sans-serif";
        
        let titleText = t("errOfflineTitle");
        if (apiErrorModal.errorType === "TIMEOUT") titleText = t("errTimeoutTitle");
        else if (apiErrorModal.errorType === "NAME_NOT_RESOLVED") titleText = t("errDnsTitle");
        ctx.fillText(titleText, w / 2, modalY + 95);

        // Meddelande
        ctx.fillStyle = "#ffffff";
        ctx.font = isPortrait ? "bold 11px sans-serif" : "bold 13px sans-serif";
        ctx.fillText(apiErrorModal.msg, w / 2, modalY + 125);

        ctx.fillStyle = "#ffd600";
        ctx.font = "11px sans-serif";
        ctx.fillText(t("apiModalPrompt"), w / 2, modalY + 155);

        // Knappar: [ OK ] och [ AVBRYT ]
        const btnW = 140;
        const btnH = 44;
        const btnY = modalY + modalH - 60;
        const okX = modalX + (modalW / 2) - btnW - 20;
        const cancelX = modalX + (modalW / 2) + 20;

        // OK (Grön)
        ctx.fillStyle = "#16a34a";
        ctx.fillRect(okX, btnY, btnW, btnH);
        ctx.strokeStyle = "#4ade80";
        ctx.lineWidth = 2;
        ctx.strokeRect(okX, btnY, btnW, btnH);

        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 14px sans-serif";
        ctx.fillText(t("apiBtnOk"), okX + btnW / 2, btnY + 27);

        // AVBRYT (Röd)
        ctx.fillStyle = "#dc2626";
        ctx.fillRect(cancelX, btnY, btnW, btnH);
        ctx.strokeStyle = "#f87171";
        ctx.lineWidth = 2;
        ctx.strokeRect(cancelX, btnY, btnW, btnH);

        ctx.fillStyle = "#ffffff";
        ctx.fillText(t("apiBtnCancel"), cancelX + btnW / 2, btnY + 27);

        ctx.restore();
    }

   // =========================================================================
    // 🏆 GAME OVER (BETYG, HÅN ÖVERST -> TOPPLISTA UNDERST -> ALLT ÖVERSATT)
    // =========================================================================
// =========================================================================
    // 🏆 GAME OVER ROUTING (SEPARATA SKÄRMAR)
    // =========================================================================
    if (gameState === "GAMEOVER") {
        ctx.save();
        ctx.filter = "none";

        const alpha = deathSequence.active ? Math.min(1.0, deathSequence.gameOverAlpha) : 1.0;
        ctx.globalAlpha = alpha;

        const isMultiplayerMode = (gameMode === "BOMB" || gameMode === "STEAL_SHIELD" || playStyle !== "LOCAL");

        if (isMultiplayerMode) {
            renderMultiplayerGameOver(ctx, w, h, isPortrait);
        } else {
            renderSinglePlayerGameOver(ctx, w, h, isPortrait);
        }

        ctx.restore();
        return; // Avsluta renderingen för denna frame
    }

    function renderMultiplayerGameOver(ctx, w, h, isPortrait) {
    ctx.save();

    // 1. Sortera och beräkna rankings för Bombläget eller Poängläget
    let ranked = [];
    const activeMatchPlayers = players.slice(0, playerCount); //[cite: 1]

    if (gameMode === "BOMB") { //[cite: 1]
        const survivor = activeMatchPlayers.find(p => !p.isEliminated); //[cite: 1]
        if (survivor) ranked.push(survivor); //[cite: 1]

        const revElim = [...eliminatedOrder].reverse(); //[cite: 1]
        revElim.forEach(p => {
            if (!ranked.some(r => r.id === p.id)) ranked.push(p); //[cite: 1]
        });

        activeMatchPlayers.forEach(p => {
            if (!ranked.some(r => r.id === p.id)) ranked.push(p); //[cite: 1]
        });
    } else {
        ranked = [...activeMatchPlayers].sort((a, b) => b.score - a.score); //[cite: 1]
    }

    const total = ranked.length;

    // 2. Skapa partiklar varsamt (max 90 aktiva så FPS inte sjunker)
    const cardW = Math.min(w - 36, 520);
    const cardH = isPortrait ? 54 : 48;
    const startY = isPortrait ? h * 0.22 : h * 0.24;
    const gap = isPortrait ? 62 : 56;

    if (typeof spawnBombExplosion === "function" && bombExplosionParticles.length < 90) { //[cite: 1]
        const lastIdx = total - 1;
        const lastY = startY + lastIdx * gap + cardH / 2;
        const winY = startY + cardH / 2;

        // Skapa sot/aska på förloraren
        if (Math.random() < 0.12) {
            spawnBombExplosion(w / 2, lastY, true); //[cite: 1]
        }
        // Skapa guld/eldgnistor på vinnaren
        if (Math.random() < 0.08) {
            spawnBombExplosion(w / 2, winY, false); //[cite: 1]
        }
    }

    // 3. Rubriker
    ctx.textAlign = "center";
    ctx.fillStyle = "#ff1744"; //[cite: 1]
    ctx.font = "bold 26px 'Luckiest Guy', sans-serif";
    ctx.fillText("💣 " + t("finalStandingsTitle"), w / 2, isPortrait ? h * 0.12 : h * 0.14); //[cite: 1]

    ctx.fillStyle = "#94a3b8"; //[cite: 1]
    ctx.font = "bold 13px sans-serif";
    ctx.fillText(t("bombSummarySub"), w / 2, isPortrait ? h * 0.16 : h * 0.19); //[cite: 1]

    // 4. Rita resultatraderna
    ranked.forEach((p, idx) => {
        const cy = startY + idx * gap;
        const isFirst = (idx === 0);
        const isLast = (idx === total - 1);

        ctx.fillStyle = isFirst 
            ? "rgba(255, 215, 0, 0.16)" 
            : (isLast ? "rgba(239, 68, 68, 0.16)" : "rgba(30, 41, 59, 0.75)");
        ctx.fillRect((w - cardW) / 2, cy, cardW, cardH);

        ctx.strokeStyle = isFirst ? "#ffd700" : (isLast ? "#ef4444" : p.color); //[cite: 1]
        ctx.lineWidth = (isFirst || isLast) ? 2.5 : 1.5;
        ctx.strokeRect((w - cardW) / 2, cy, cardW, cardH);

        const rankText = typeof getPodiumRankLabel === "function" 
            ? getPodiumRankLabel(idx, total) //[cite: 1]
            : `#${idx + 1}`;

        ctx.textAlign = "left";
        ctx.fillStyle = isFirst ? "#ffd700" : (isLast ? "#ef4444" : "#ffffff");
        ctx.font = "bold 15px sans-serif";
        ctx.fillText(rankText, (w - cardW) / 2 + 16, cy + cardH / 2 + 5);

        ctx.fillStyle = p.color; //[cite: 1]
        ctx.font = "bold 16px sans-serif";
        ctx.fillText(p.name, (w - cardW) / 2 + 140, cy + cardH / 2 + 5);

        ctx.textAlign = "right";
        ctx.font = "20px sans-serif";
        ctx.fillText(isFirst ? "👑🏆" : (isLast ? "💀💨" : "🥈"), (w + cardW) / 2 - 16, cy + cardH / 2 + 7);
    });

    // 5. UPP DATERA OCH RITA UT ALLA BOMB-PARTIKLAR (Detta saknades!)
    for (let i = bombExplosionParticles.length - 1; i >= 0; i--) { //[cite: 1]
        const pt = bombExplosionParticles[i]; //[cite: 1]
        pt.x += pt.vx; //[cite: 1]
        pt.y += pt.vy; //[cite: 1]
        pt.alpha -= pt.decay; //[cite: 1]

        if (pt.alpha <= 0) {
            bombExplosionParticles.splice(i, 1);
            continue;
        }

        ctx.save();
        ctx.globalAlpha = Math.max(0, pt.alpha); //[cite: 1]
        ctx.fillStyle = pt.color; //[cite: 1]
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI * 2); //[cite: 1]
        ctx.fill();
        ctx.restore();
    }

    // 6. Återvändsprompt längst ner
    ctx.textAlign = "center";
    ctx.fillStyle = "#38bdf8"; //[cite: 1]
    ctx.font = "bold 13px sans-serif";
    ctx.fillText(t("returnPromptDesktop"), w / 2, h - 35); //[cite: 1]

    ctx.restore();
}

function renderSinglePlayerGameOver(ctx, w, h, isPortrait) {
    ctx.fillStyle = "rgba(7, 9, 18, 0.98)";
    ctx.fillRect(0, 0, w, h);

    const isWin = deathSequence.reason === "COMPLETED";
    const pulse = Math.floor(Date.now() / 250) % 2 === 0;

    ctx.strokeStyle = pulse ? (lastEvaluation.color || "#ffd600") : "#ffffff";
    ctx.lineWidth = 4;
    ctx.strokeRect(12, 12, w - 24, h - 24);

    ctx.textAlign = "center";

    // 1. Rubrik
    ctx.fillStyle = isWin ? "#22c55e" : "#ff1744";
    ctx.font = isPortrait ? "22px 'Luckiest Guy', cursive" : "32px 'Luckiest Guy', cursive";
    ctx.fillText(isWin ? t("quizCompleteTitle") : t("gameOverTitle"), w / 2, h * 0.07);

    // 2. Betygsbricka
    const badgeSize = isPortrait ? 48 : 56;
    const badgeX = (w / 2) - badgeSize - 15;
    const badgeY = h * 0.09;

    ctx.fillStyle = "rgba(15, 23, 42, 0.9)";
    ctx.fillRect(badgeX, badgeY, badgeSize, badgeSize);
    ctx.strokeStyle = lastEvaluation.color || "#ffd600";
    ctx.lineWidth = 2.5;
    ctx.strokeRect(badgeX, badgeY, badgeSize, badgeSize);

    ctx.fillStyle = lastEvaluation.color || "#ffd600";
    ctx.font = isPortrait ? "bold 28px 'Luckiest Guy', cursive" : "bold 36px 'Luckiest Guy', cursive";
    ctx.fillText(lastEvaluation.rank || "C", badgeX + (badgeSize / 2), badgeY + (badgeSize * 0.75));

    ctx.textAlign = "left";
    ctx.fillStyle = "#ffffff";
    ctx.font = isPortrait ? "bold 13px sans-serif" : "bold 15px sans-serif";
    ctx.fillText(t("scoreLabel") + " " + score + " " + t("pointsSuffix"), badgeX + badgeSize + 15, badgeY + 22);

    ctx.fillStyle = lastEvaluation.color || "#ffd600";
    ctx.font = isPortrait ? "bold 11px sans-serif" : "bold 13px sans-serif";
    ctx.fillText(lastEvaluation.title || "", badgeX + badgeSize + 15, badgeY + 44);

    // 3. Meddelandepanel
    const msgW = Math.min(w - 32, 680);
    const msgH = isPortrait ? Math.min(105, h * 0.17) : Math.min(100, h * 0.16);
    const msgX = (w - msgW) / 2;
    const msgY = badgeY + badgeSize + 10;

    ctx.fillStyle = "rgba(18, 24, 45, 0.92)";
    ctx.fillRect(msgX, msgY, msgW, msgH);
    ctx.strokeStyle = "#38bdf8";
    ctx.lineWidth = 1.5;
    ctx.strokeRect(msgX, msgY, msgW, msgH);

    ctx.textAlign = "center";
    ctx.fillStyle = "#ffd600";
    ctx.font = isPortrait ? "bold 10px sans-serif" : "bold 12px sans-serif";
    ctx.fillText(lastEvaluation.causeQuote || "", w / 2, msgY + 20);

    ctx.strokeStyle = "rgba(56, 189, 248, 0.25)";
    ctx.beginPath();
    ctx.moveTo(msgX + 16, msgY + 28);
    ctx.lineTo(msgX + msgW - 16, msgY + 28);
    ctx.stroke();

    ctx.fillStyle = "#e2e8f0";
    ctx.font = isPortrait ? "10px sans-serif" : "12px sans-serif";
    const quoteWords = (lastEvaluation.gradeQuote || "").split(' ');
    let qLine = '';
    let qLineY = msgY + 46;
    for (let n = 0; n < quoteWords.length; n++) {
        let test = qLine + quoteWords[n] + ' ';
        if (ctx.measureText(test).width > msgW - 24 && n > 0) {
            ctx.fillText(qLine, w / 2, qLineY);
            qLine = quoteWords[n] + ' ';
            qLineY += (isPortrait ? 16 : 18);
        } else {
            qLine = test;
        }
    }
    ctx.fillText(qLine, w / 2, qLineY);

    // 4. Highscore-topplista
    const hsList = getHighscores();
    const listW = Math.min(w - 32, 540);
    const listY = msgY + msgH + 12;
    const bottomBtnH = 44;
    const listH = Math.max(140, (h - listY - bottomBtnH - 24));
    const listX = (w - listW) / 2;

    ctx.fillStyle = "rgba(15, 23, 42, 0.92)";
    ctx.fillRect(listX, listY, listW, listH);
    ctx.strokeStyle = "#ffd600";
    ctx.lineWidth = 2;
    ctx.strokeRect(listX, listY, listW, listH);

    ctx.fillStyle = "#ffd600";
    ctx.font = isPortrait ? "13px 'Luckiest Guy', cursive" : "16px 'Luckiest Guy', cursive";
    ctx.fillText(t("leaderboardTitle"), w / 2, listY + 24);

    if (hsList.length === 0) {
        ctx.fillStyle = "#94a3b8";
        ctx.font = isPortrait ? "11px sans-serif" : "13px sans-serif";
        ctx.fillText(t("noScoresYet"), w / 2, listY + (listH / 2) + 6);
    } else {
        const maxRows = 5;
        const rowHeight = (listH - 40) / Math.min(maxRows, Math.max(hsList.length, 1));
        ctx.font = isPortrait ? "bold 11px sans-serif" : "bold 13px sans-serif";

        hsList.slice(0, maxRows).forEach((item, idx) => {
            const rowY = listY + 46 + (idx * rowHeight);

            ctx.textAlign = "left";
            ctx.fillStyle = idx === 0 ? "#ffd600" : (idx === 1 ? "#00ffcc" : (idx === 2 ? "#fb923c" : "#ffffff"));
            ctx.fillText((idx + 1) + ". " + item.name, listX + 16, rowY);

            ctx.textAlign = "right";
            ctx.fillStyle = "#38bdf8";
            ctx.fillText(item.score + " p  [" + (item.diff || "") + "]", listX + listW - 16, rowY);
        });
    }

    // 5. Returknapp
    const btnW = Math.min(w - 32, 420);
    const btnX = (w - btnW) / 2;
    const btnY = h - bottomBtnH - 14;

    ctx.fillStyle = "#0284c7";
    ctx.fillRect(btnX, btnY, btnW, bottomBtnH);
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 2;
    ctx.strokeRect(btnX, btnY, btnW, bottomBtnH);

    ctx.textAlign = "center";
    ctx.fillStyle = "#ffffff";
    ctx.font = isPortrait ? "bold 11px sans-serif" : "bold 13px sans-serif";
    ctx.fillText(isMobileDevice ? t("returnPromptMobile") : t("returnPromptDesktop"), w / 2, btnY + (bottomBtnH * 0.62));
}
    // =========================================================================
    // ⚠️ VISUELL VARNING VID SVORDOMAR (1/3 och 2/3)
    // =========================================================================
    if (swearWarningTimer > 0 && !KamekAntiCheat.isTriggered()) {
        swearWarningTimer--;
        ctx.save();
        const bannerW = Math.min(w - 20, 560);
        const bannerH = 34;
        const bannerX = (w - bannerW) / 2;
        const bannerY = isPortrait ? h * 0.45 : h * 0.48;

        const pulse = Math.floor(Date.now() / 120) % 2 === 0;
        ctx.fillStyle = pulse ? "#dc2626" : "#991b1b";
        ctx.fillRect(bannerX, bannerY, bannerW, bannerH);
        ctx.strokeStyle = "#ffd600";
        ctx.lineWidth = 2;
        ctx.strokeRect(bannerX, bannerY, bannerW, bannerH);

        ctx.textAlign = "center";
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 13px sans-serif";
        ctx.fillText(lastSwearText, w / 2, bannerY + 22);
        ctx.restore();
    }

    // =========================================================================
    // 🎙️ RÖSTSTYRNINGS-BAR I BOTTEN
    // =========================================================================
    ctx.save();
    ctx.textAlign = "left";
    ctx.font = isPortrait ? "bold 10px sans-serif" : "bold 11px sans-serif";

    let voiceText = "";
    let voiceColor = "#94a3b8";

    if (voiceStatus === "ACTIVE") {
        voiceText = t("voiceActive");
        voiceColor = "#22c55e"; // Grön
    } else if (voiceStatus === "DENIED") {
        voiceText = t("voiceDenied");
        voiceColor = "#ff1744"; // Röd vid nekad mick
    } else if (voiceStatus === "REQUESTING") {
        voiceText = t("voiceRequesting");
        voiceColor = "#ffd600"; // Gul medan dialogen är öppen
    } else if (voiceStatus === "UNSUPPORTED") {
        voiceText = t("voiceUnsupported");
        voiceColor = "#64748b";
    } else {
        voiceText = t("voiceOff");
        voiceColor = "#38bdf8"; // Ljusblå klickbar
    }

    // Bakgrundsplatta för tydlig klickyta
    ctx.fillStyle = "rgba(10, 15, 28, 0.85)";
    ctx.fillRect(10, h - 34, isPortrait ? w - 20 : 480, 26);
    ctx.strokeStyle = voiceColor;
    ctx.lineWidth = 1;
    ctx.strokeRect(10, h - 34, isPortrait ? w - 20 : 480, 26);

    ctx.fillStyle = voiceColor;
    ctx.fillText(voiceText, 20, h - 17);
    ctx.restore();

    // =========================================================================
    // 🌐 SNURRANDE GLOB VID API-LADDNING
    // =========================================================================
    if (isApiLoading) {
        ctx.save();
        ctx.fillStyle = "rgba(5, 6, 12, 0.94)";
        ctx.fillRect(0, 0, w, h);

        const centerX = w / 2;
        const centerY = h * 0.42;
        const radius = Math.min(w * 0.12, 70);

        globeRotation += 0.04;

        // Rita wireframe-glob
        ctx.strokeStyle = "#38bdf8";
        ctx.lineWidth = 2.5;

        // Yttre cirkel (horisont)
        ctx.beginPath();
        ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
        ctx.stroke();

        // Ekvator & breddgrader
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.ellipse(centerX, centerY, radius, radius * 0.35, 0, 0, Math.PI * 2);
        ctx.stroke();

        ctx.beginPath();
        ctx.ellipse(centerX, centerY, radius, radius * 0.7, 0, 0, Math.PI * 2);
        ctx.stroke();

        // Roterande längdgrader (meridianer)
        for (let i = 0; i < 3; i++) {
            const rotOffset = globeRotation + (i * Math.PI / 3);
            const scaleX = Math.cos(rotOffset);
            ctx.beginPath();
            ctx.ellipse(centerX, centerY, Math.abs(radius * scaleX), radius, 0, 0, Math.PI * 2);
            ctx.strokeStyle = i === 0 ? "#00ffcc" : "rgba(56, 189, 248, 0.6)";
            ctx.stroke();
        }

        // Laddningstext
        const pulse = Math.floor(Date.now() / 200) % 2 === 0;
        ctx.textAlign = "center";
        ctx.fillStyle = pulse ? "#ffd600" : "#ffffff";
        ctx.font = isPortrait ? "bold 15px sans-serif" : "bold 18px sans-serif";
        ctx.fillText(currentLang === 'sv' ? "HÄMTAR FRÅGOR FRÅN OPENTDB..." : "CONNECTING TO OPENTDB...", centerX, centerY + radius + 45);

        ctx.fillStyle = "#94a3b8";
        ctx.font = "12px sans-serif";
        ctx.fillText(currentLang === 'sv' ? "Förbereder säker frågebuffert..." : "Buffering question packets...", centerX, centerY + radius + 70);

        ctx.restore();
    }

    if (apiErrorModal.active && apiErrorModal.errorType === "MOBILE_WARN") {
    const isMobileWarning = (apiErrorModal.errorType === "MOBILE_WARN");

    const modalW = Math.min(canvas.width - 32, 500);
    const modalH = isMobileWarning ? 230 : 270;
    const mx = (canvas.width - modalW) / 2;
    const my = (canvas.height - modalH) / 2;

    // Bakgrund
    ctx.fillStyle = "rgba(18, 4, 34, 0.98)";
    ctx.fillRect(mx, my, modalW, modalH);

    // Gul varningsram för mobil på desktop – röd larmram för nätverksfel
    ctx.strokeStyle = isMobileWarning ? "#facc15" : "#ff1744";
    ctx.lineWidth = 3;
    ctx.strokeRect(mx, my, modalW, modalH);

    ctx.textAlign = "center";

    // 1. Rubrik
    ctx.fillStyle = isMobileWarning ? "#facc15" : "#ff1744";
    ctx.font = "bold 18px 'Luckiest Guy', sans-serif";
    ctx.fillText(
        isMobileWarning ? t("mobileWarningTitle") : t("apiModalTitle"), 
        canvas.width / 2, 
        my + 40
    );

    // 2. Ikon / Varningstyp
    ctx.font = "32px sans-serif";
    ctx.fillText(isMobileWarning ? "📱" : "📡", canvas.width / 2, my + 82);

    // 3. Beskrivningstext
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 13px sans-serif";
    ctx.fillText(apiErrorModal.msg, canvas.width / 2, my + 120);

    // 4. Bekräftelseknapp
    const btnW = Math.min(modalW - 40, 320);
    const btnH = 44;
    const bx = (canvas.width - btnW) / 2;
    const by = my + modalH - 60;

    // Gul knapp för mobilfortsättning, blå/cyan för lokal fallback vid nätverksfel
    ctx.fillStyle = isMobileWarning ? "#eab308" : "#0284c7";
    ctx.fillRect(bx, by, btnW, btnH);
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 1.5;
    ctx.strokeRect(bx, by, btnW, btnH);

    ctx.fillStyle = isMobileWarning ? "#000000" : "#ffffff";
    ctx.font = "bold 12px sans-serif";
    ctx.fillText(
        isMobileWarning ? t("mobileWarningBtn") : t("apiBtnOk"), 
        canvas.width / 2, 
        by + 26
    );
}

    // =========================================================================
    // ⚠️ POPUP-MODAL VID NÄTVERKSFEL (OK / AVBRYT)
    // =========================================================================
    if (apiErrorModal.active && apiErrorModal.errorType !== "MOBILE_WARN") {
        if (apiErrorModal.errorType === "MOBILE_WARN") return;
        ctx.save();
        ctx.fillStyle = "rgba(2, 4, 10, 0.95)";
        ctx.fillRect(0, 0, w, h);

        const modalW = Math.min(w - 32, 540);
        const modalH = 220;
        const modalX = (w - modalW) / 2;
        const modalY = (h - modalH) / 2;

        // Varningsruta
        ctx.fillStyle = "rgba(24, 10, 26, 0.98)";
        ctx.fillRect(modalX, modalY, modalW, modalH);
        ctx.strokeStyle = "#ff1744";
        ctx.lineWidth = 3;
        ctx.strokeRect(modalX, modalY, modalW, modalH);

        // Titel
        ctx.textAlign = "center";
        ctx.fillStyle = "#ff1744";
        ctx.font = "bold 18px 'arial', sans-serif";
        ctx.fillText("⚠️ DATABASANSLUTNING MISSLYCKADES", w / 2, modalY + 36);

        // Beskrivning
        ctx.fillStyle = "#ffffff";
        ctx.font = isPortrait ? "bold 12px sans-serif" : "bold 13px sans-serif";
        ctx.fillText(apiErrorModal.msg, w / 2, modalY + 75);

        ctx.fillStyle = "#ffd600";
        ctx.font = "11px sans-serif";
        ctx.fillText(currentLang === 'sv' 
            ? "Vill du ladda de lokala reservfrågorna eller avbryta?" 
            : "Switch to local backup questions or return to menu?", w / 2, modalY + 110);

        // Knappar: [ OK ] och [ AVBRYT ]
        const btnW = 140;
        const btnH = 44;
        const btnY = modalY + modalH - 60;
        const okX = modalX + (modalW / 2) - btnW - 20;
        const cancelX = modalX + (modalW / 2) + 20;

        // Knapp: OK (Grön)
        ctx.fillStyle = "#16a34a";
        ctx.fillRect(okX, btnY, btnW, btnH);
        ctx.strokeStyle = "#4ade80";
        ctx.lineWidth = 2;
        ctx.strokeRect(okX, btnY, btnW, btnH);

        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 14px sans-serif";
        ctx.fillText(currentLang === 'sv' ? "✔ OK (LOKAL)" : "✔ OK (LOCAL)", okX + btnW / 2, btnY + 27);

        // Knapp: AVBRYT (Röd)
        ctx.fillStyle = "#dc2626";
        ctx.fillRect(cancelX, btnY, btnW, btnH);
        ctx.strokeStyle = "#f87171";
        ctx.lineWidth = 2;
        ctx.strokeRect(cancelX, btnY, btnW, btnH);

        ctx.fillStyle = "#ffffff";
        ctx.fillText(currentLang === 'sv' ? "✖ AVBRYT" : "✖ CANCEL", cancelX + btnW / 2, btnY + 27);

        ctx.restore();
    }

    // =========================================================================
    // 💡 ARKAD-LED BELYSNINGSRING (KANTER & GLÖD)
    // =========================================================================
    if (gameState === "PLAYING" || gameState === "FEEDBACK") {
        let ledR = 0, ledG = 0, ledB = 0, ledAlpha = 0;

        if (gameState === "FEEDBACK") {
            if (feedbackStatus === "CORRECT") {
                // 🟢 Blinka grönt vid rätt
                ledR = 34; ledG = 197; ledB = 94;
                ledAlpha = (Math.floor(feedbackTimer / 6) % 2 === 0) ? 0.85 : 0.2;
            } else {
                // 🔴 Blinka rött vid fel
                ledR = 239; ledG = 68; ledB = 68;
                ledAlpha = (Math.floor(feedbackTimer / 6) % 2 === 0) ? 0.95 : 0.25;
            }
        } else if (gameState === "PLAYING") {
            if (questionTimer <= 3) {
                // 🟠 Pulsera orange vid ont om tid (under 3 sek)
                ledR = 249; ledG = 115; ledB = 22;
                ledAlpha = 0.4 + 0.4 * Math.sin(Date.now() / 90);
            } else if (useLives && lives === 1) {
                // 🔴 Svagt rött vid sista livet kvar
                ledR = 220; ledG = 38; ledB = 38;
                ledAlpha = 0.22 + 0.08 * Math.sin(Date.now() / 400);
            }
        }

        if (ledAlpha > 0) {
            ctx.save();
            ctx.strokeStyle = `rgba(${ledR}, ${ledG}, ${ledB}, ${ledAlpha})`;
            ctx.lineWidth = 14;
            ctx.shadowColor = `rgba(${ledR}, ${ledG}, ${ledB}, 0.9)`;
            ctx.shadowBlur = 24;
            ctx.strokeRect(7, 7, w - 14, h - 14);

            // Inre tunn ljusledare
            ctx.strokeStyle = `rgba(255, 255, 255, ${Math.min(1, ledAlpha * 0.9)})`;
            ctx.lineWidth = 2;
            ctx.strokeRect(7, 7, w - 14, h - 14);
            ctx.restore();
        }
    }

    // 1. Rita gult/orange varningsband i toppen om batteri/ping/fps varnar
    TeliaSystemDiagnostics.drawHUD(ctx, canvas.width);

    // =========================================================================
    // 🎮 KONTROLL-POPUP MED KONSOLENS HJÄLTE & vvbm.jfif BAKGRUND
    // =========================================================================
    if (activeControllerModal.active && activeControllerModal.scheme) {
        ctx.save();
        ctx.setTransform(1, 0, 0, 1, 0, 0);

        const s = activeControllerModal.scheme;
        // Hämta engelska eller svenska texter dynamiskt
        const langPack = (currentLang === 'en' && s.en) ? s.en : (s.sv || s);

        const boxW = Math.min(w - 32, 600);
        const boxH = Math.min(h - 40, 420);
        const boxX = (w - boxW) / 2;
        const boxY = (h - boxH) / 2;

        // 1. Rita bakgrundsbilden (vvbm.jfif) inuti modalen
        if (vvbmBgImg.complete && vvbmBgImg.naturalWidth > 0) {
            ctx.drawImage(vvbmBgImg, boxX, boxY, boxW, boxH);
            // Lägg en halvtransparent färgad hinna över bilden så texten syns klockrent
            ctx.fillStyle = s.bgTint || "rgba(10, 15, 30, 0.85)";
            ctx.fillRect(boxX, boxY, boxW, boxH);
        } else {
            ctx.fillStyle = s.bgTint || "rgba(15, 23, 42, 0.96)";
            ctx.fillRect(boxX, boxY, boxW, boxH);
        }

        // Yttre arkadram
        ctx.strokeStyle = s.allowed ? "#ffd600" : "#ff1744";
        ctx.lineWidth = 4;
        ctx.strokeRect(boxX, boxY, boxW, boxH);

        ctx.textAlign = "center";

        ctx.textAlign = "center";
        ctx.fillStyle = s.allowed ? "#ffd600" : "#ff1744";
        ctx.font = "bold 20px 'Luckiest Guy', cursive, sans-serif";
        ctx.fillText(s.name, w / 2, boxY + 34);

        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 15px monospace";
        const heroLabel = currentLang === 'en' ? "HERO:" : "HJÄLTE:";
        ctx.fillText(`\({heroLabel}\){s.character}`, w / 2, boxY + 60);

        // Instruktioner på rätt språk
        ctx.textAlign = "left";
        ctx.font = "bold 13px sans-serif";
        let textY = boxY + 102;

        langPack.instructions.forEach((line) => {
            if (line.includes("RÖR INTE") || line.includes("DO NOT TOUCH")) ctx.fillStyle = "#ff5555";
            else if (line.includes("BANNAD") || line.includes("BANNED")) ctx.fillStyle = "#ff3333";
            else ctx.fillStyle = "#f8fafc";

            ctx.fillText(line, boxX + 30, textY);
            textY += 26;
        });

        // Hån-citat på valt språk
        const tauntWords = langPack.taunt.split(' ');
        // Hån-ruta i botten
        const tauntH = 65;
        const tauntY = boxY + boxH - tauntH - 60;
        ctx.fillStyle = "rgba(0, 0, 0, 0.65)";
        ctx.fillRect(boxX + 20, tauntY, boxW - 40, tauntH);
        ctx.strokeStyle = "#ffd600";
        ctx.lineWidth = 1.5;
        ctx.strokeRect(boxX + 20, tauntY, boxW - 40, tauntH);

        ctx.fillStyle = "#ffd600";
        ctx.font = "italic 11px sans-serif";
        const words = s.taunt.split(' ');
        let tLine = '';
        let tY = tauntY + 22;
        for (let n = 0; n < words.length; n++) {
            let test = tLine + words[n] + ' ';
            if (ctx.measureText(test).width > boxW - 60 && n > 0) {
                ctx.fillText(tLine, boxX + 30, tY);
                tLine = words[n] + ' ';
                tY += 18;
            } else {
                tLine = test;
            }
        }
        ctx.fillText(tLine, boxX + 30, tY);

        // Stäng-knapp / Statusknapp
        const btnW = 180;
        const btnH = 36;
        const btnX = (w - btnW) / 2;
        const btnY = boxY + boxH - 46;

        ctx.fillStyle = s.allowed ? "#16a34a" : "#dc2626";
        ctx.fillRect(btnX, btnY, btnW, btnH);
        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 2;
        ctx.strokeRect(btnX, btnY, btnW, btnH);

        ctx.textAlign = "center";
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 12px monospace";
        ctx.fillText(langPack.dismissBtn, w / 2, btnY + 23);

        ctx.restore();
    }

    // =========================================================================
    // 🎯 HÅRKORS FÖR WIIMOTE OCH LJUSPISTOL SAMT CRT-BLIXT
    // =========================================================================
    if (gunCrosshair.flashTimer > 0) {
        gunCrosshair.flashTimer--;
        // Klassisk NES Zapper/GunCon vit rasterruta över hela skärmen vid avfyrning
        ctx.save();
        ctx.fillStyle = "rgba(255, 255, 255, 0.4)";
        ctx.fillRect(0, 0, w, h);
        ctx.restore();
    }

    if (gunCrosshair.visible && gameState === "PLAYING") {
        ctx.save();
        const gx = gunCrosshair.x;
        const gy = gunCrosshair.y;

        // Yttre siktring
        ctx.strokeStyle = "#ff1744";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(gx, gy, 16, 0, Math.PI * 2);
        ctx.stroke();

        // Sikteskryss
        ctx.beginPath();
        ctx.moveTo(gx - 22, gy); ctx.lineTo(gx - 6, gy);
        ctx.moveTo(gx + 6, gy); ctx.lineTo(gx + 22, gy);
        ctx.moveTo(gx, gy - 22); ctx.lineTo(gx, gy - 6);
        ctx.moveTo(gx, gy + 6); ctx.lineTo(gx, gy + 22);
        ctx.stroke();

        // Mittenprick
        ctx.fillStyle = "#ffd600";
        ctx.beginPath();
        ctx.arc(gx, gy, 2.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }

    // Rita explosionspartiklar
    if (bombExplosionParticles.length > 0) {
        ctx.save();
        for (let i = 0; i < bombExplosionParticles.length; i++) {
            const p = bombExplosionParticles[i];
            ctx.globalAlpha = Math.max(0, p.alpha);
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.restore();
    }

    // 2. Rita Kamek Anti-Cheat om fusk triggats
    if (KamekAntiCheat.isTriggered()) {
        KamekAntiCheat.draw(ctx, canvas);
    }

    // 3. Rita Telia Kritisk Spärr om hårdvara/nät kraschat
    if (TeliaSystemDiagnostics.isLocked()) {
        TeliaSystemDiagnostics.drawCriticalScreen(ctx, canvas.width, canvas.height);
    }

    // =========================================================================
    // 🧙‍♂️ KAMEKS COMIC SANS-PRATBUBBLA VID UTSLAGNING
    // =========================================================================
    if (kamekBubble.active && kamekBubble.timer > 0) {
        kamekBubble.timer--;

        const p = (typeof players !== 'undefined' && players[kamekBubble.playerIdx]) 
            ? players[kamekBubble.playerIdx] 
            : null;
        const isDQ = Boolean(p && p.isDQ) || Boolean(kamekBubble.isDQ);

        ctx.save();

        // 1. Hitta var frågeytan/svarsknapparna börjar så vi ALDRIG överlappar dem
        let highestQuestionY = canvas.height * 0.45;
        if (typeof getAnswerBoxes === 'function') {
            const boxes = getAnswerBoxes();
            if (boxes && boxes.length > 0) {
                highestQuestionY = Math.min(...boxes.map(b => b.y));
            }
        }

        // 2. Mått för pratbubblan
        const bw = isDQ ? 360 : 300;
        const bh = isDQ ? 100 : 65;

        // Beräkna spelarens horisontella position (X) och underkant (Y)
        let targetX = canvas.width / 2;
        let playerCardBottomY = 90; // Standard underkant om spelar-HUD ligger i toppen

        if (p && typeof p.screenX === 'number') {
            targetX = p.screenX;
            // Om spelarkortet har en definierad skärmposition, sätt underkanten direkt därunder
            playerCardBottomY = (typeof p.screenY === 'number') ? (p.screenY + 45) : 90;
        } else if (typeof playerCount !== 'undefined' && playerCount > 0) {
            const spacing = canvas.width / (playerCount + 1);
            targetX = spacing * (kamekBubble.playerIdx + 1);
        }

        // Centrera horisontellt under spelaren och håll den innanför skärmkanterna
        let bx = targetX - bw / 2;
        bx = Math.max(15, Math.min(canvas.width - bw - 15, bx));

        // Placera bubblan precis UNDER spelaren
        let by = playerCardBottomY + 10;

        // Spärra så bubblan aldrig glider ner och täcker frågeområdet
        if (by + bh > highestQuestionY - 8) {
            by = Math.max(10, highestQuestionY - bh - 8);
        }

        // 3. RITA PRATBUBBLAN
        ctx.fillStyle = "#ffffff";
        ctx.strokeStyle = isDQ ? "#ff1744" : "#222222";
        ctx.lineWidth = isDQ ? 3.5 : 2;

        ctx.beginPath();
        ctx.roundRect(bx, by, bw, bh, 10);
        ctx.fill();
        ctx.stroke();

        // 4. SVANS SOM PEKAR UPPÅT MOT DEN DISKADE/UTSLAGNA SPELARENS RUTA
        const tailBaseX = Math.max(bx + 20, Math.min(bx + bw - 20, targetX));
        ctx.beginPath();
        ctx.moveTo(tailBaseX - 10, by);
        ctx.lineTo(tailBaseX, Math.max(0, by - 10));
        ctx.lineTo(tailBaseX + 10, by);
        ctx.closePath();
        ctx.fillStyle = "#ffffff";
        ctx.fill();
        ctx.strokeStyle = isDQ ? "#ff1744" : "#222222";
        ctx.lineWidth = 2;
        ctx.stroke();

        // 5. TEXTER
        ctx.textAlign = "center";

        if (isDQ) {
            ctx.fillStyle = "#d32f2f";
            ctx.font = "bold 13px 'Comic Sans MS', cursive, sans-serif";
            ctx.fillText("🧙‍♂️ KAMEK: «FERSKET PÅ SCENEN!»", bx + bw / 2, by + 22);

            const reason = (typeof disqualifiedPlayers !== 'undefined' && disqualifiedPlayers[kamekBubble.playerIdx])
                ? disqualifiedPlayers[kamekBubble.playerIdx]
                : "Regelbrudd";
            ctx.fillStyle = "#b71c1c";
            ctx.font = "bold 11px 'Comic Sans MS', cursive, sans-serif";
            ctx.fillText(`🛑 ${reason}`, bx + bw / 2, by + 42);

            ctx.strokeStyle = "#e5e5e5";
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(bx + 15, by + 52);
            ctx.lineTo(bx + bw - 15, by + 52);
            ctx.stroke();

            ctx.fillStyle = "#111111";
            ctx.font = "italic 11px 'Comic Sans MS', cursive, sans-serif";
            ctx.fillText(kamekBubble.dqRoast || "«Takk for laget, taper!»", bx + bw / 2, by + 70);

            ctx.fillStyle = "#666666";
            ctx.font = "9px 'Comic Sans MS', cursive, sans-serif";
            ctx.fillText("Skammen vises på storskjerm...", bx + bw / 2, by + 88);
        } else {
            ctx.fillStyle = "#d32f2f";
            ctx.font = "bold 13px 'Comic Sans MS', cursive, sans-serif";
            ctx.fillText("🧙‍♂️ KAMEK:", bx + bw / 2, by + 24);

            ctx.fillStyle = "#111111";
            ctx.font = "12px 'Comic Sans MS', cursive, sans-serif";
            ctx.fillText(kamekBubble.text, bx + bw / 2, by + 48);
        }

        ctx.restore();

        if (kamekBubble.timer <= 0) {
            kamekBubble.active = false;
            kamekBubble.isDQ = false;
        }
    }

    renderCrewDqDialog(ctx);
    ctx.restore();
}

function mainLoop() {
    update();
    render();
    requestAnimationFrame(mainLoop);
}
requestAnimationFrame(mainLoop);
</script>

    <div style="background:#120422; border:3px solid #00ffcc; border-radius:12px; padding:24px; max-width:540px; width:90%; text-align:center; box-shadow:0 0 30px rgba(0,255,204,0.4); color:#fff;">

    </div>
</div>

    </button>
    <button type="button" onclick="closeCrewModal()" style="background: #e11d48; color: #fff; border: none; padding: 7px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 12px;">

    </button>
</div>

        <!-- STEG 2: ADMINVERKTYG (LÅSES UPP VID GODKÄND BADGE) -->
        <div id="badgeActionStep" style="display:none; text-align:left;">
            <div style="display:flex; align-items:center; justify-content:space-between; border-bottom:1px dashed #334155; padding-bottom:8px; margin-bottom:15px;">
                <span style="color:#22c55e; font-weight:bold; font-size:14px;">✓ CREW BADGE VERIFISERT</span>
                <span id="badgeTargetName" style="color:#38bdf8; font-weight:bold;"></span>
            </div>

            <h3 style="color:#ff1744; margin:0 0 10px 0; font-size:16px;">ADMINHANDLING: DISKVALIFISERING</h3>
            
            <label style="display:block; font-size:12px; color:#94a3b8; margin-bottom:6px;">VELG ÅRSAK:</label>
            <select id="simpleReasonSelect" onchange="toggleCustomField()" style="width:100%; padding:10px; background:#1e1b4b; border:1px solid #4338ca; color:#fff; border-radius:6px; font-size:13px; margin-bottom:10px;">
                <option value="Mobilbruk / Googling på scenen">1: Mobilbruk / Googling på scenen</option>
                <option value="Bruk av AI / Taleassistent">2: Bruk av AI / Taleassistent</option>
                <option value="Rørte pauseknapp under runden">3: Rørte pauseknapp under runden</option>
                <option value="Usportslig oppførsel / Raging">4: Usportslig oppførsel / Raging</option>
                <option value="Drog ut kabel / Sabotasje">5: Drog ut kabel / Sabotasje</option>
                <option value="ANNET">Annet (Skriv manuell grunn)...</option>

            <textarea id="simpleReasonCustom" placeholder="Skriv spesifikk årsak her..." style="display:none; width:100%; height:60px; background:#0f172a; border:1px solid #334155; color:#fff; border-radius:6px; padding:8px; font-size:12px; margin-bottom:15px; box-sizing:border-box;"></textarea>

            <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:15px;">
                <button onclick="closeCrewModal()" style="background:#334155; color:#fff; border:none; padding:10px 18px; border-radius:6px; cursor:pointer; font-weight:bold; font-size:13px;">
                    AVBRYT
                </button>
                <button onclick="executeDisqualification()" style="background:#ff1744; color:#fff; border:none; padding:10px 20px; border-radius:6px; cursor:pointer; font-weight:bold; font-size:13px; box-shadow:0 0 10px rgba(255,23,68,0.5);">
                    💥 GJENNOMFØR DISKVALIFIKASJON

        </div>

    </div>
